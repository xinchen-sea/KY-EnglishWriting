note:\"讲义原句，最稳\"},\r\n    {name:\"02 We are pleased to announce\", text:\"We are pleased to announce that the {activity} will be held in our university.\", zh:\"我们很高兴地宣布，我校将举办【活动】。\", note:\"与 01 等价，announce 更正式\"},\r\n    {name:\"03 Attention all students（醒目）\", text:\"Attention all students interested in {topic} on campus!\", zh:\"校园里所有对【主题】感兴趣的同学请注意！\", note:\"口语化、抓眼球，适合海报式通知\"},\r\n    {name:\"04 为丰富课外生活（带目的）\", text:\"To enrich students' extracurricular life and improve communication among club members, our club will host a wonderful {activity}.\", zh:\"为丰富学生课外生活、增进社团成员交流，我们社团将举办一场精彩的【活动】。\", note:\"讲义原句；自带目的，可省掉下一张「通知目的」卡\"}\r\n  ]\r\n},\r\n{\r\n  id:\"p1_notice_aim\", p:1, no:\"1.2\", title:\"通知目的\", hint:\"通知第二句：本通知要说什么\",\r\n  variants:[\r\n    {name:\"01 This notice is intended to…\", text:\"This notice is intended to introduce some details of this {activity}.\", zh:\"本通知旨在介绍本次【活动】的一些细节。\", note:\"讲义原句\"},\r\n    {name:\"02 serves the purpose of…\", text:\"This notice serves the purpose of introducing some of the activities.\", zh:\"这则通知的目的是介绍一些活动。\", note:\"讲义原句，稍啰嗦\"},\r\n    {name:\"03 现将相关事宜通知如下\", text:\"The relevant matters are hereby notified as follows.\", zh:\"现将相关事宜通知如下。\", note:\"最像中文通知的写法，简洁有力\"},\r\n    {name:\"04 以下是有关事项的通知\", text:\"The following are the notifications of the relevant matters.\", zh:\"以下是有关事项的通知。\", note:\"与 03 等价，名词化更重\"}\r\n  ]\r\n},\r\n\r\n/* ---------- 纪要 ---------- */\r\n{\r\n  id:\"p1_min_open\", p:1, no:\"1.1\", title:\"导入 / 开场\", hint:\"纪要第一句：谁主持、怎么开场\",\r\n  variants:[\r\n    {name:\"01 commenced with a warm welcome\", text:\"The meeting commenced with a warm welcome from {host}, followed by an introduction to the purpose of gathering.\", zh:\"会议以【主持人】的欢迎辞开始，随后介绍了此次会议的目的。\", note:\"讲义原句（主持人 = the chairman）\"},\r\n    {name:\"02 delivered welcoming remarks\", text:\"{host} delivered welcoming remarks, and provided a brief overview of the significance of {objective}.\", zh:\"【主持人】致欢迎辞，并简要介绍了【会议主题】的意义。\", note:\"讲义原句，比 01 更简洁\"}\r\n  ]\r\n},\r\n{\r\n  id:\"p1_min_aim\", p:1, no:\"1.2\", title:\"会议目的\", hint:\"纪要第二句：这次会议为什么开\",\r\n  variants:[\r\n    {name:\"01 回顾上周活动\", text:\"The meeting aimed to briefly review the activity held last week.\", zh:\"本次会议旨在对上周的活动做简要回顾。\", note:\"复盘型会议（如总结比赛）\"},\r\n    {name:\"02 筹划下周活动\", text:\"The meeting aimed to make a plan for the activity to be held next week.\", zh:\"本次会议旨在为下周举行的活动制定计划。\", note:\"筹备型会议\"},\r\n    {name:\"03 讨论问题并找方案\", text:\"The meeting aimed to discuss the problem of {topic} and find some suitable solutions.\", zh:\"本次会议旨在讨论【主题】的问题并找到合适的解决方案。\", note:\"问题导向型会议，最通用\"}\r\n  ]\r\n},\r\n{\r\n  id:\"p1_min_join\", p:1, no:\"1.3\", title:\"参与讨论\", hint:\"可接在上面三句之后（讲义：很多同学/同事/老师参与了讨论）\", optional:true,\r\n  variants:[\r\n    {name:\"01 Many students participated\", text:\"Many students participated in the discussion.\", zh:\"许多同学参与了讨论。\", note:\"校园场景\"},\r\n    {name:\"02 Many colleagues participated\", text:\"Many colleagues participated in the discussion.\", zh:\"许多同事参与了讨论。\", note:\"公司场景\"},\r\n    {name:\"03 Many professors participated\", text:\"Many professors participated in the discussion.\", zh:\"许多教授参与了讨论。\", note:\"学术场景\"}\r\n  ]\r\n}\r\n);\r\n\n/* ==== data_cards_p2.js ==== */\n/* ================= 功能句库（讲义 50 句 + 补充） ================= */\r\nvar FUNC = [\r\n  /* ① 活动基本信息 */\r\n  {grp:\"① 活动基本信息（时间/地点/事件）\", name:\"01 会议将在…举行\", text:\"{sub:conn} The meeting will be held in {place} at 8:00 a.m. on Sunday, December 19th.\", zh:\"会议将于12月19日周日上午8点在【地点】举行。\"},\r\n  {grp:\"① 活动基本信息（时间/地点/事件）\", name:\"02 我校将于…举办\", text:\"{sub:conn} Our university will host the {activity} in {place} on Sunday, December 19th.\", zh:\"我校将于12月19日周日在【地点】举办【活动】。\"},\r\n  {grp:\"① 活动基本信息（时间/地点/事件）\", name:\"03 定于…举行（scheduled）\", text:\"{sub:conn} The {activity} is scheduled to take place in {place} {timeLong}.\", zh:\"【活动】定于【时间】在【地点】举行。\"},\r\n  {grp:\"① 活动基本信息（时间/地点/事件）\", name:\"04 commencing at（正式）\", text:\"{sub:conn} On {dateLong}, the {activity} will be held in {place}, commencing at 8:00 a.m.\", zh:\"【日期】，【活动】将在【地点】举行，上午8点开始。\"},\r\n  {grp:\"① 活动基本信息（时间/地点/事件）\", name:\"05 is to be held（通知体）\", text:\"{sub:conn} The {activity} is to be held in {place} {timeLong}.\", zh:\"【活动】将于【时间】在【地点】举行（通知常用）。\"},\r\n\r\n  /* ② 活动主题目的 */\r\n  {grp:\"② 活动主题与目的\", name:\"06 主题是…\", text:\"{sub:conn} The subject of the {activity} is {topic}.\", zh:\"【活动】的主题是【主题】。\"},\r\n  {grp:\"② 活动主题与目的\", name:\"07 目的是…\", text:\"{sub:conn} The purpose of the {activity} is to {aim}.\", zh:\"【活动】的目的是【目的】。\"},\r\n  {grp:\"② 活动主题与目的\", name:\"08 aims to facilitate（深入讨论）\", text:\"{sub:conn} This {activity} aims to facilitate an in-depth discussion on {topic}.\", zh:\"本次【活动】旨在促进关于【主题】的深入讨论。\"},\r\n  {grp:\"② 活动主题与目的\", name:\"09 under the theme of（带引号主题）\", text:\"{sub:conn} This {activity} is held under the theme of \\u201c{themeName}\\u201d.\", zh:\"本次活动在“【主题名】”的主题下举行。\"},\r\n  {grp:\"② 活动主题与目的\", name:\"10 Centered on（分词状语升级）\", text:\"{sub:conn} Centered on the theme of {themeName}, the {activity} aims to {aim}.\", zh:\"以“【主题名】”为主题，【活动】旨在【目的】。\"},\r\n\r\n  /* ③ 参与范围 */\r\n  {grp:\"③ 参与范围\", name:\"11 吸引广泛参与\", text:\"{sub:conn} The event is anticipated to attract wide participation from {audience}.\", zh:\"预计该活动将吸引【参与对象】的广泛参与。\"},\r\n  {grp:\"③ 参与范围\", name:\"12 各年级均可参加\", text:\"{sub:conn} Students of all grades are eligible to enter the {activity}, including both domestic and international students.\", zh:\"所有年级的学生都有资格参加【活动】，包括国内和国际学生。\"},\r\n  {grp:\"③ 参与范围\", name:\"13 邀请各行业领军人物\", text:\"{sub:conn} We have invited leading figures from various sectors, including eminent scholars, renowned entrepreneurs, and senior media representatives.\", zh:\"我们邀请了各行业领军人物，包括杰出学者、知名企业家和资深媒体代表。\"},\r\n  {grp:\"③ 参与范围\", name:\"14 汇聚众多贵宾\", text:\"{sub:conn} This event is expected to bring together a host of distinguished guests, including leading experts and scholars in the field, who have both profound knowledge and remarkable achievements in their respective areas.\", zh:\"本次活动预计将汇聚众多贵宾，包括业内顶尖专家学者，他们既有深厚学识又有卓越成就。\"},\r\n\r\n  /* ④ 流程环节 */\r\n  {grp:\"④ 活动流程与环节\", name:\"15 such as（激发热情）\", text:\"{sub:conn} Interesting activities such as {seg1} and {seg2} will be held to arouse students' enthusiasm for {topic}.\", zh:\"将举办【环节①】和【环节②】等有趣活动，以激发学生对【主题】的热情。\"},\r\n  {grp:\"④ 活动流程与环节\", name:\"16 分组协作挑战\", text:\"{sub:conn} Participants will be divided into teams for a collaborative challenge, designed to foster teamwork and creative problem-solving.\", zh:\"参与者将分组进行团队协作挑战，旨在培养团队精神与创造性解决问题的能力。\"},\r\n  {grp:\"④ 活动流程与环节\", name:\"17 commence…conclude（完整流程）\", text:\"{sub:conn} The event will commence with an opening ceremony, followed by a series of workshops and a keynote speech, and will conclude with a discussion session where participants can exchange ideas.\", zh:\"活动以开幕式开始，随后是系列工作坊和主题演讲，最后以讨论环节收尾。\"},\r\n  {grp:\"④ 活动流程与环节\", name:\"18 Following the opening ceremony（精简）\", text:\"{sub:conn} Following the opening ceremony, the event will feature a keynote speech, workshops, and a concluding discussion session for participant interaction.\", zh:\"开幕式后，活动将包含主题演讲、工作坊以及最终的互动讨论环节。\"},\r\n\r\n  /* ⑤ 奖品收获 */\r\n  {grp:\"⑤ 奖品与收获（画饼）\", name:\"19 难忘且有益的体验\", text:\"{sub:conn} This will be a memorable and rewarding experience and the prizes and souvenirs will be very valuable.\", zh:\"这将是一次难忘且有益的体验，奖品与纪念品都非常珍贵。\"},\r\n  {grp:\"⑤ 奖品与收获（画饼）\", name:\"20 前三名获奖杯证书\", text:\"{sub:conn} To encourage more students to join, the top three winners will receive trophies and certificates, and all shortlisted participants will be awarded bonus points.\", zh:\"为鼓励更多学生参加，前三名将获得奖杯和证书，所有入围者都将获得加分。\"},\r\n  {grp:\"⑤ 奖品与收获（画饼）\", name:\"21 结识志同道合的人\", text:\"{sub:conn} During the event, you will have the opportunity to meet like-minded individuals, engage in interesting activities, and enjoy a great time together.\", zh:\"活动期间你将有机会结识志同道合的人、参与有趣活动并共度美好时光。\"},\r\n  {grp:\"⑤ 奖品与收获（画饼）\", name:\"22 为学校做贡献+获得经验\", text:\"{sub:conn} This event will allow you to contribute to the development of our university while gaining valuable experience in {field}.\", zh:\"本次活动将使你为学校发展做出贡献，同时在【领域】获得宝贵经验。\"},\r\n  {grp:\"⑤ 奖品与收获（画饼）\", name:\"23 开阔视野（六大方面）\", text:\"{sub:conn} This activity offers a precious opportunity to broaden your horizons and enrich your campus life.\", zh:\"这次活动提供了开阔视野、丰富校园生活的宝贵机会。\"},\r\n\r\n  /* ⑥ 推荐对象 */\r\n  {grp:\"⑥ 推荐对象\", name:\"24 介绍景点（Located in）\", text:\"{sub:conn} Located in {spotLocation}, {spot} is one of the most popular scenic spots in the world.\", zh:\"【景点】坐落于【所在地】，是世界上最受欢迎的景点之一。\"},\r\n  {grp:\"⑥ 推荐对象\", name:\"25 介绍书籍电影（Written by）\", text:\"{sub:conn} Written by {author}, {bookName} is one of the most popular books in the world.\", zh:\"《【书名】》由【作者】主笔，是世界上最受欢迎的书之一。\"},\r\n  {grp:\"⑥ 推荐对象\", name:\"26 介绍名人（沈括）\", text:\"{sub:conn} Shen Kuo was an outstanding scientist during the Northern Song Dynasty, who made remarkable achievements in many fields.\", zh:\"沈括是北宋杰出的科学家，在许多领域都取得了卓越成就。\"},\r\n  {grp:\"⑥ 推荐对象\", name:\"27 介绍活动（Planned by）\", text:\"{sub:conn} Planned by the Student Union, the {activity} is one of the most popular events in our university.\", zh:\"【活动】由学生会策划，是我校最受欢迎的活动之一。\"},\r\n  {grp:\"⑥ 推荐对象\", name:\"28 对比后推荐（While I understand）\", text:\"{sub:conn} While I understand that {otherChoice} has advantages in this respect, I believe {target} will provide you with a more profound and thought-provoking experience.\", zh:\"虽然我知道【对比项】在这方面有优势，但我相信【推荐对象】会带给你更深刻、更发人深省的体验。\"},\r\n  {grp:\"⑥ 推荐对象\", name:\"29 强烈推荐（两个特点）\", text:\"{sub:conn} I would highly recommend {target} for its exceptional {feat1} and remarkable {feat2}.\", zh:\"我强烈推荐【推荐对象】，因为它拥有卓越的【特点①】和非凡的【特点②】。\"},\r\n  {grp:\"⑥ 推荐对象\", name:\"30 值得推荐之处（which includes）\", text:\"{sub:conn} What makes {target} highly recommendable is the unique experience it offers, which includes {segmentSingle}.\", zh:\"【推荐对象】之所以值得高度推荐，在于它提供的独特体验，其中包括【单个环节】。\"},\r\n  {grp:\"⑥ 推荐对象\", name:\"31 给你好机会（简化补充）\", text:\"{sub:conn} It offers you a good chance to {goal}, and it will also help you {benefit}.\", zh:\"它给你【目标动作】的好机会，也能帮你【好处】。\"},\r\n\r\n  /* ⑦ 能力展示与要求 */\r\n  {grp:\"⑦ 能力展示与要求\", name:\"32 一直表现出色（自荐）\", text:\"{sub:conn} Over the past few years, I have consistently excelled in my role, which is evidenced by the awards and recognition I have received.\", zh:\"过去几年我表现一直出色，所获奖项与认可就是证明。\"},\r\n  {grp:\"⑦ 能力展示与要求\", name:\"33 自律且有韧性\", text:\"{sub:conn} I am a highly self-motivated and resilient individual, capable of maintaining focus and productivity in fast-paced environments. Not only am I eager to take on challenges, but I am also always ready to learn new things.\", zh:\"我高度自律且富有韧性，能在快节奏环境中保持专注与高效；不仅乐于迎接挑战，也始终愿意学习新事物。\"},\r\n  {grp:\"⑦ 能力展示与要求\", name:\"34 擅长协作\", text:\"{sub:conn} I thrive in collaborative settings and have often been the one to facilitate communication and integrate diverse viewpoints in the team.\", zh:\"我在协作环境中能充分发挥，并常在团队中促进沟通、整合不同观点。\"},\r\n  {grp:\"⑦ 能力展示与要求\", name:\"35 候选人职责+要求（招聘）\", text:\"{sub:conn} The selected {personGroup} will assist in conducting surveys, collecting and analyzing data on {topic}. Moreover, the {personGroup} should be enthusiastic about {topic} and have sound organization and communication skills.\", zh:\"入选的【人员对象】将协助开展调查、收集分析【主题】数据；并应热爱【主题】，具备良好的组织与沟通能力。\"},\r\n  {grp:\"⑦ 能力展示与要求\", name:\"36 岗位所需能力\", text:\"{sub:conn} The role requires the ability to analyze complex problems, develop practical solutions, and execute them effectively.\", zh:\"该职位要求具备分析复杂问题、制定可行方案并有效执行的能力。\"},\r\n  {grp:\"⑦ 能力展示与要求\", name:\"37 应热爱并具备技能\", text:\"{sub:conn} The {personGroup} should be enthusiastic about {topic} and have sound {ability} skills.\", zh:\"【人员对象】应对【主题】充满热情，并具备良好的【能力】能力。\"},\r\n  {grp:\"⑦ 能力展示与要求\", name:\"38 无需经验（万能）\", text:\"{sub:conn} No previous experience is required, for we will provide full training and guidance.\", zh:\"无需经验，我们将提供完整培训与指导。\"},\r\n\r\n  /* ⑧ 感谢与道歉 */\r\n  {grp:\"⑧ 感谢与道歉\", name:\"39 非常感谢你的无私帮助\", text:\"{sub:conn} I am extremely grateful to you for your unselfish assistance during the period of {period}.\", zh:\"非常感谢你在【时期】给我的无私帮助。\"},\r\n  {grp:\"⑧ 感谢与道歉\", name:\"40 正是你的…使我能够\", text:\"{sub:conn} It is your {quality} that enabled me to {achievement}.\", zh:\"正是你的【品质】使我能够【成就】。\"},\r\n  {grp:\"⑧ 感谢与道歉\", name:\"41 没有你帮助就没有进步\", text:\"{sub:conn} Without your generous help, I would not have made such great progress in {field}.\", zh:\"没有你的慷慨帮助，我就不会在【领域】取得如此大的进步。\"},\r\n  {grp:\"⑧ 感谢与道歉\", name:\"42 没有你帮助就没有这段经历\", text:\"{sub:conn} Without your generous help, I would not have had such a wonderful experience.\", zh:\"没有你的慷慨帮助，我就不会有如此美妙的经历。\"},\r\n  {grp:\"⑧ 感谢与道歉\", name:\"43 没有及时帮助后果严重（道歉）\", text:\"{sub:conn} Without your timely help, I am afraid the consequences would have been truly serious.\", zh:\"没有你的及时帮助，后果恐怕会非常严重。\"},\r\n  {grp:\"⑧ 感谢与道歉\", name:\"44 望在你的指导下提升\", text:\"{sub:conn} All of us desire to improve our ability of {abilityNoun} under your professional guidance.\", zh:\"我们都希望在您的专业指导下提升【能力】。\"},\r\n  {grp:\"⑧ 感谢与道歉\", name:\"45 为弥补我可立即纠正（道歉）\", text:\"{sub:conn} To make up for it, I am ready to immediately correct the mistake and offer my full assistance to resolve the matter.\", zh:\"为弥补过失，我准备立即纠正错误并全力协助解决此事。\"},\r\n  {grp:\"⑧ 感谢与道歉\", name:\"46 我保证不再发生（道歉）\", text:\"{sub:conn} I assure you that I have learned a valuable lesson from this and will take concrete steps to ensure it does not happen again.\", zh:\"我向你保证已从中吸取教训，并将采取具体措施确保不再发生。\"},\r\n\r\n  /* ⑨ 通用型 */\r\n  {grp:\"⑨ 通用型（最万能）\", name:\"47 我们急需…（badly in need）\", text:\"{sub:conn} We are badly in need of {thing}, which can help us {goal}.\", zh:\"我们急需【所需事物】，它能帮我们【目标动作】。\"},\r\n  {grp:\"⑨ 通用型（最万能）\", name:\"48 由于…我们不便…\", text:\"{sub:conn} Due to {reason}, it is inconvenient for us to {goal}.\", zh:\"由于【缘由】，我们不便【目标动作】。\"},\r\n  {grp:\"⑨ 通用型（最万能）\", name:\"49 不知你能否…（I wonder if）\", text:\"{sub:conn} I wonder if you can {ask} so that I can {result}.\", zh:\"不知你能否【请求】，这样我就能【结果】。\"},\r\n  {grp:\"⑨ 通用型（最万能）\", name:\"50 如果你改进…我们就能…\", text:\"{sub:conn} We could have more opportunities to {goal} if you improve {thing}.\", zh:\"如果你改进【所需事物】，我们就能有更多机会【目标动作】。\"},\r\n  {grp:\"⑨ 通用型（最万能）\", name:\"51 建议…（It is advisable）\", text:\"{sub:conn} It is advisable to {action}, which can really help you {benefit}.\", zh:\"建议【建议动作】，这确实能帮你【好处】。\"},\r\n  {grp:\"⑨ 通用型（最万能）\", name:\"52 鉴于事实…（Given the fact）\", text:\"{sub:conn} Given the fact that {fact}, it would be wise for us to {action}.\", zh:\"鉴于【事实】，我们【建议动作】才是明智的。\"},\r\n  {grp:\"⑨ 通用型（最万能）\", name:\"53 提供探索创造力的机会\", text:\"{sub:conn} {thing} provides a unique opportunity to let you explore your creativity.\", zh:\"【所需事物】提供了一个让你探索创造力的独特机会。\"},\r\n  {grp:\"⑨ 通用型（最万能）\", name:\"54 你的…是成功的关键\", text:\"{sub:conn} Everyone agrees that your {thing2} is the key to the satisfactory outcome.\", zh:\"大家都认为你的【关键因素】是取得满意结果的关键。\"},\r\n  {grp:\"⑨ 通用型（最万能）\", name:\"55 让你体验不同文化\", text:\"{sub:conn} {thing} allows you to experience different cultures and social customs.\", zh:\"【所需事物】让你体验不同的文化和社会习俗。\"},\r\n  {grp:\"⑨ 通用型（最万能）\", name:\"56 学生将从你的榜样中获益\", text:\"{sub:conn} I am confident that the students will not only have the opportunity to learn from you, but also to draw inspiration from your example.\", zh:\"我相信学生们不仅有机会向你学习，还能从你的榜样中汲取灵感。\"}\r\n];\r\n\r\nvar CONN_A = [\r\n  {name:\"Firstly,\", text:\"Firstly,\"}, {name:\"To begin with,\", text:\"To begin with,\"},\r\n  {name:\"First and foremost,\", text:\"First and foremost,\"}, {name:\"（不写连接词）\", text:\"\"}\r\n];\r\nvar CONN_B = [\r\n  {name:\"Moreover,\", text:\"Moreover,\"}, {name:\"What's more,\", text:\"What's more,\"},\r\n  {name:\"Secondly,\", text:\"Secondly,\"}, {name:\"In addition,\", text:\"In addition,\"},\r\n  {name:\"（不写连接词）\", text:\"\"}\r\n];\r\nvar CONN_C = [\r\n  {name:\"In the end,\", text:\"In the end,\"}, {name:\"Finally,\", text:\"Finally,\"},\r\n  {name:\"Last but not least,\", text:\"Last but not least,\"}, {name:\"（不写连接词）\", text:\"\"}\r\n];\r\n\r\nvar P2_CONN_DEF = [\r\n  {key:\"conn\", label:\"连接词\", options:CONN_A}\r\n];\r\n\r\nCARDS.push(\r\n\r\n/* ---------- 第二段 · 过渡句 ---------- */\r\n{\r\n  id:\"p2_trans\", p:2, no:\"2.1\", title:\"过渡句\", hint:\"第二段第一句：下面分几点说\",\r\n  subs:[{key:\"n\", label:\"分几点\", options:[{name:\"two\", text:\"two\"},{name:\"three\", text:\"three\"}]}],\r\n  variants:[\r\n    {name:\"01 at least two/three factors\", text:\"There are at least {sub:n} factors accounting for my {intentNoun}.\", zh:\"至少有【数量】个因素可以解释我的【意图名词】。\", note:\"讲义原句；n 可切 two/three，后面分点数量要跟上\"},\r\n    {name:\"02 primary reasons are as follows\", text:\"The primary reasons for my {intentNoun} are as follows.\", zh:\"我【意图名词】的主要理由如下。\", note:\"讲义原句\"},\r\n    {name:\"03 reasons are outlined below\", text:\"The reasons for my {intentNoun} are outlined below.\", zh:\"我【意图名词】的理由列示如下。\", note:\"讲义原句，最正式\"},\r\n    {name:\"04 details can be listed as follows\", text:\"The details can be listed as follows.\", zh:\"具体细节列示如下。\", note:\"信息型（介绍展览、计划）首选\"},\r\n    {name:\"05 as for the questions you raised\", text:\"As for the questions you raised, here are my answers.\", zh:\"关于你提出的问题，以下是我的回答。\", note:\"答复咨询信专用（2024英一）\"},\r\n    {name:\"06 let me answer one by one\", text:\"Let me answer your questions one by one.\", zh:\"让我逐一回答你的问题。\", note:\"与 05 等价，更口语\"},\r\n    {name:\"07 here are my…about…\", text:\"Here are my {intentNoun} about {topic}.\", zh:\"以下是我关于【主题】的【意图名词】。\", note:\"讲义原句；带主题词，针对性强\"}\r\n  ]\r\n},\r\n\r\n/* ---------- 第二段 · 分点①②③（共享 56 句功能句库） ---------- */\r\n{\r\n  id:\"p2_a\", p:2, no:\"2.2\", title:\"分点①\", hint:\"56 句功能句库，按下拉里的组选，写 1 句即可\",\r\n  subs:P2_CONN_DEF,\r\n  variants:FUNC\r\n},\r\n{\r\n  id:\"p2_b\", p:2, no:\"2.3\", title:\"分点②\", hint:\"第二点：换个角度（时间地点 → 内容 → 好处 → 要求）\",\r\n  subs:[{key:\"conn\", label:\"连接词\", options:CONN_B}],\r\n  variants:FUNC\r\n},\r\n{\r\n  id:\"p2_c\", p:2, no:\"2.4\", title:\"分点③\", hint:\"第三点（可选）：讲清楚就够，别堆到 5 句\", optional:true,\r\n  subs:[{key:\"conn\", label:\"连接词\", options:CONN_C}],\r\n  variants:FUNC\r\n},\r\n\r\n/* ---------- 通知 · 万能提醒句 ---------- */\r\n{\r\n  id:\"p2_remind\", p:2, no:\"2.5\", title:\"提醒句（字数不够时用）\", hint:\"讲义给的 3 个万能句，放第二段尾\", optional:true,\r\n  variants:[\r\n    {name:\"01 请提前安排准时参加\", text:\"Please arrange your time in advance and attend the activity on time.\", zh:\"请提前安排好时间，准时参加活动。\"},\r\n    {name:\"02 遵守现场秩序\", text:\"During the activity, please observe the on-site order and follow the arrangements of the staff.\", zh:\"活动期间请遵守现场秩序，听从工作人员安排。\"},\r\n    {name:\"03 积极配合营造氛围\", text:\"In order to ensure the smooth progress of the activity, please actively cooperate and jointly create a good activity atmosphere.\", zh:\"为确保活动顺利进行，请大家积极配合，共同营造良好的活动氛围。\"}\r\n  ]\r\n},\r\n\r\n/* ---------- 纪要 · 大佬发言 ---------- */\r\n{\r\n  id:\"p2_min_3\", p:2, no:\"2.2\", title:\"大佬发言\", hint:\"纪要第三句：谁说、说了什么\",\r\n  variants:[\r\n    {name:\"01 The chairman expressed…\", text:\"The chairman expressed the opinion that {opinion}.\", zh:\"董事长认为【观点】。\", note:\"讲义原句\"},\r\n    {name:\"02 Experts believe that…\", text:\"Experts believe that {opinion}.\", zh:\"专家认为【观点】。\", note:\"讲义原句，学术场景\"},\r\n    {name:\"03 The majority of workers think…\", text:\"The majority of workers think that {opinion}.\", zh:\"大多数员工认为【观点】。\", note:\"讲义原句，公司场景\"},\r\n    {name:\"04 A detailed presentation（带使命愿景）\", text:\"A detailed presentation was delivered by {host}, highlighting the mission, vision, and achievements of {objective}.\", zh:\"【主持人】作了详细汇报，强调了【会议主题】的使命、愿景与成就。\", note:\"讲义原句，最正式\"},\r\n    {name:\"05 自定义发言人\", text:\"{speakerTitle} expressed the opinion that {opinion}.\", zh:\"【发言人】认为【观点】。\", note:\"不确定是谁就用 the speaker\"}\r\n  ]\r\n},\r\n{\r\n  id:\"p2_min_4\", p:2, no:\"2.3\", title:\"手下赞同\", hint:\"纪要第四句：其他人怎么看\",\r\n  variants:[\r\n    {name:\"01 in favour of the statement\", text:\"The majority of those attendees were in favour of the statement.\", zh:\"大多数参会者赞成这一表述。\", note:\"讲义原句（statement 可换 plan / decision）\"},\r\n    {name:\"02 in favour of the plan\", text:\"The majority of those attendees were in favour of the plan.\", zh:\"大多数参会者赞成该计划。\", note:\"讲义同款，换名词\"},\r\n    {name:\"03 engaged in an interactive discussion\", text:\"Participants engaged in an interactive discussion to address the challenges they faced during the activity.\", zh:\"参会者进行了互动讨论，以解决活动中面临的挑战。\", note:\"讲义原句，比 01/02 更有内容\"}\r\n  ]\r\n}\r\n);\r\n\n/* ==== data_cards_p3.js ==== */\n/* ================= 句型卡片 · 第三段 ================= */\nCARDS.push(\n\n/* ---------- 书信 · 表示情感 ---------- */\n{\n  id:\"p3_emotion\", p:3, no:\"3.1\", title:\"表示情感\", hint:\"感谢 / 歉意 / 期待，按信件类型选一句\",\n  variants:[\n    {name:\"01 感谢你考虑我的建议/申请\", text:\"I would like to express my gratitude for your kind consideration of my {intentNoun}.\", zh:\"感谢你考虑我的【意图名词】。\", note:\"建议信 / 申请信收尾首选\"},\n    {name:\"02 请接受我的歉意\", text:\"Please accept my sincere apology for any inconvenience that I have caused.\", zh:\"给你带来的不便，请接受我诚挚的歉意。\", note:\"道歉信 / 答复投诉信专用\"},\n    {name:\"03 希望大家享受这段旅程\", text:\"I hope all the members will enjoy the journey.\", zh:\"希望所有成员都能享受这段旅程。\", note:\"活动类（参观、夏令营）收尾\"},\n    {name:\"04 如需更多信息请联系我\", text:\"For more information about the activity, please do not hesitate to contact me.\", zh:\"如需了解活动的更多信息，请随时与我联系。\", note:\"介绍型书信（通知式）通用\"},\n    {name:\"05 如能接受邀请不胜感激\", text:\"We would appreciate it very much if you could accept our invitation.\", zh:\"如果你能接受我们的邀请，我们将不胜感激。\", note:\"邀请信专用\"},\n    {name:\"06 期待积极参与并圆满成功\", text:\"We hope for your active participation and make this event a grand success.\", zh:\"我们期待你的积极参与，共同使本次活动圆满成功。\", note:\"通知 / 公开活动收尾\"},\n    {name:\"07 如能莅临倍感荣幸\", text:\"It would be our great honor if you could grace the occasion with your presence.\", zh:\"如你能莅临，我们将倍感荣幸。\", note:\"邀请贵宾（教授、领导）时用，规格最高\"}\n  ]\n},\n\n/* ---------- 书信 · 问候家人（可选） ---------- */\n{\n  id:\"p3_family\", p:3, no:\"3.2\", title:\"问候家人\", hint:\"写给熟人时加一句，可通用\", optional:true,\n  variants:[\n    {name:\"01 Please give my best regards…\", text:\"Please give my best regards to your family.\", zh:\"请代我向你的家人问好。\"},\n    {name:\"02 Please send my best wishes…\", text:\"Please send my best wishes to your family.\", zh:\"请向你的家人转达我最美好的祝愿。\"},\n    {name:\"03 Kindly send my sincere regards…\", text:\"Kindly send my sincere regards to your family.\", zh:\"请向你的家人转达我诚挚的问候。\"}\n  ]\n},\n\n/* ---------- 书信 · 期待回信 ---------- */\n{\n  id:\"p3_reply\", p:3, no:\"3.3\", title:\"期待回信\", hint:\"书信最后一句：等你回复\",\n  variants:[\n    {name:\"01 reply at your earliest convenience\", text:\"I would be grateful if you could reply at your earliest convenience.\", zh:\"如你能在方便时尽快回复，我将不胜感激。\", note:\"最正式，写给机构 / 教授\"},\n    {name:\"02 Your prompt reply will be appreciated\", text:\"Your prompt reply will be highly appreciated.\", zh:\"非常感谢你的及时回复。\", note:\"讲义原句，简洁\"},\n    {name:\"03 looking forward to hearing from you\", text:\"I am looking forward to hearing from you soon.\", zh:\"期待很快收到你的来信。\", note:\"最通用，几乎任何信都能用\"},\n    {name:\"04 looking forward to your early reply\", text:\"I am looking forward to your early reply.\", zh:\"期待你早日回复。\", note:\"比 03 更简短\"}\n  ]\n},\n\n/* ---------- 通知 · 发出邀请 + 报名方式 ---------- */\n{\n  id:\"p3_notice_invite\", p:3, no:\"3.1\", title:\"发出邀请 + 报名方式\", hint:\"通知第三段：快来、怎么报名\",\n  variants:[\n    {name:\"01 Put it into practice!（讲义原句）\", text:\"Put it into practice! If you are interested in {topic}, this will be a memorable experience for you. We are looking forward to your enthusiastic participation. Please email us at {email} to sign up.\", zh:\"快行动起来！如果你对【主题】感兴趣，这将是难忘的体验。期待你的热情参与。请发邮件至【报名邮箱】报名。\", note:\"2020英一改编，四句一气呵成\"},\n    {name:\"02 You are welcome to join us\", text:\"You are welcome to join us. If you are interested in this activity and are willing to have quite a different experience these days, please do not hesitate to email us at {email}.\", zh:\"欢迎加入我们。如果你对这项活动感兴趣，并愿意这些天有一次完全不同的体验，请不要犹豫，发邮件至【报名邮箱】。\"},\n    {name:\"03 If you are passionate about…\", text:\"If you are passionate about {topic}, this is an ideal opportunity for you! To apply, please email us at {email}. Join us today, and make a difference in {field}.\", zh:\"如果你对【主题】充满热情，这是你的理想机会！报名请发邮件至【报名邮箱】。今天就加入我们，在【领域】有所作为。\"},\n    {name:\"04 扫码报名（最短）\", text:\"We look forward to your active participation and believe this activity will bring you an unforgettable experience! Please scan the QR code below to sign up!\", zh:\"期待大家的积极参与，相信本次活动将带来难忘的体验！请扫描下方二维码报名！\", note:\"题干允许扫码时用；没有二维码就换成 01/02\"}\n  ]\n},\n\n/* ---------- 纪要 · 最终决定 ---------- */\n{\n  id:\"p3_min_5\", p:3, no:\"3.1\", title:\"最终决定\", hint:\"纪要第五句：会议定了什么\",\n  variants:[\n    {name:\"01 The meeting agreed to…\", text:\"The meeting agreed to {decision}.\", zh:\"会议同意【决定】。\", note:\"讲义原句\"},\n    {name:\"02 As a concrete measure…\", text:\"As a concrete measure, the meeting decided to {decision}.\", zh:\"作为一项具体措施，会议决定【决定】。\", note:\"讲义原句，更具体\"},\n    {name:\"03 vote of thanks（收尾）\", text:\"The meeting concluded with a vote of thanks extended to all participants for their active involvement and commitment.\", zh:\"会议最后向所有参会者表示感谢，感谢他们的积极参与与投入。\", note:\"讲义原句，仪式性收尾\"}\n  ]\n},\n\n/* ---------- 纪要 · 下次会议（可选） ---------- */\n{\n  id:\"p3_min_6\", p:3, no:\"3.2\", title:\"下次会议\", hint:\"仅周期性会议可写；一次性会议关掉\", optional:true,\n  variants:[\n    {name:\"01 将邮件通知（讲义原句）\", text:\"The date and location of the next meeting will be announced via email to all participants.\", zh:\"下次会议的日期与地点将通过邮件通知所有参会者。\", note:\"周期性会议（例会、年度活动）才写\"},\n    {name:\"02 下周五同一地点\", text:\"The next meeting is scheduled for next Friday at the same place.\", zh:\"下次会议定于下周五同一地点。\", note:\"已确定时间时用\"},\n    {name:\"03 自定义\", text:\"{nextMeeting}\", zh:\"【下次会议安排】\", note:\"从词库选或手输\"}\n  ]\n}\n);\n\n/* ==== data_cards_nt.js ==== */\n/* ================= 句型卡片 · 通知 / 纪要抬头 ================= */\r\nCARDS.push(\r\n\r\n/* ---------- 通知 · 日期 ---------- */\r\n{\r\n  id:\"f_notice_date\", p:4, no:\"日期\", title:\"日期\", hint:\"通知落款：署名下方写日期\", noDot:true,\r\n  variants:[\r\n    {name:\"日期（署名下方）\", text:\"{dateLong}\", zh:  + 六句正文（导入 / 目的 / 发言 / 赞同 / 决定 / 下次会议）+ 记录人\",\n    cards:MODE_CARDS.minutes, all:idsOf(MODE_CARDS.minutes)\n  }\n];\n\n/* ==== data_types.js ==== */\n/* ================= 两层题型：type（格式）× scene（具体场合） ================= */\nvar TYPES = [\n  { id:\"letter\", name:\"书信作文\",\n    desc:\"书信分两类：被动（按来信回复，不写自我介绍）／主动（从无到有，必须自我介绍）\",\n    scenes:[\n      [\"reply_pos\",\"答复 · 积极\"],\n      [\"reply_neg\",\"答复 · 消极\"],\n      [\"formal\",\"公务 · 主动\"],\n      [\"personal\",\"熟人 · 感谢邀请\"]\n    ]},\n  { id:\"notice\", name:\"通知 · 告示\",\n    desc:\"Notice 是换了格式的书信：标题 + 日期 + 三段 + 机构署名，不写 Yours sincerely\",\n    scenes:[\n      [\"notice\",\"活动通知 / 告示\"]\n    ]},\n  { id:\"minutes\", name:\"会议纪要\",\n    desc:\"23 年新增题型：五字段抬头 + 六句正文 + 记录人，本质与备忘录相同\",\n    scenes:[\n      [\"minutes\",\"Minutes of Meeting\"]\n    ]}\n];\n\nfunction typeOfMode(modeId){\n  for(var i=0;i<TYPES.length;i++){\n    for(var j=0;j<TYPES[i].scenes.length;j++){\n      if(TYPES[i].scenes[j][0]===modeId) return TYPES[i];\n    }\n  }\n  return TYPES[0];\n}\n\n/* 段落标题：三段正文固定，首尾随格式变化 */\nvar PARA_TITLES = {\n  letter:[\n    [\"称呼\",\"Dear + 收信人，后接逗号；四种情况见「讲义要点」\"],\n    [\"第一段\",\"背景提要（被动，不自我介绍）或自我介绍（主动）+ 写信目的\"],\n    [\"第二段\",\"过渡句 + 2~3 个分点（50 句功能句库，按组编号）\"],\n    [\"第三段\",\"表示情感 + 期待回信 / 邀请报名\"],\n    [\"落款\",\"Yours sincerely, + Li Ming（右下角，不写地址、不签真名）\"]\n  ],\n  notice:[\n    [\"标题\",\"Notice 居中；也可用 Notice of … 说明事由\"],\n    [\"第一段\",\"活动概况 + 目的（什么活动、为什么办）\"],\n    [\"第二段\",\"具体内容：时间、地点、参与范围、流程环节\"],\n    [\"第三段\",\"奖品收获 / 报名方式 + 欢迎参加\"],\n    [\"落款\",\"机构署名 + 日期\"]\n  ],\n  minutes:[\n    [\"抬头五字段\",\"Date / Time / Location / Objective / Attendees，各占一行\"],\n    [\"导入\",\"主持人宣布会议开始、说明议题\"],\n    [\"讨论\",\"大佬发言 + 手下赞同（2~3 句）\"],\n    [\"决定\",\"最终决定 +（下次会议时间）\"],\n    [\"记录人\",\"Recorded by + 日期\"]\n  ]\n};\n\n/* ==== data_zh.js ==== */\n/* ================= 中文对照：修正 + 预设专用译法 ================= */\r\n/* 优先于词库的修正（词库里有些 zh 写的是“用法注释”，不能直接当译文） */\r\nvar ZH_FIX = {\r\n  \"December 20, 2025\":\"2025年12月20日\",\r\n  \"Decemb (state.mode === modeId) return;\r\n  pushSnap();\r\n  state.mode = modeId;\r\n  state.cards = {};\r\n  state.preset = '';\r\n  ensureState(modeId);\r\n  syncControls(); save(); renderAll();\r\n}\r\nfunction switchType(typeId){\r\n  var t = null;\r\n  TYPES.forEach(function(x){ if(x.id===typeId) t=x; });\r\n  if(!t) return;\r\n  if(t.scenes.length && t.scenes[0][0] === state.mode) return;\r\n  switchScene(t.scenes[0][0]);\r\n}\r\n\r\n/* ================= 控件 ================= */\r\nfunction syncControls(){\r\n  var tid = typeOfMode(state.mode).id;\r\n  $$('#typeSeg button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-type')===tid); });\r\n  buildSceneSeg();\r\n  $$('#sceneSeg button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-scene')===state.mode); });\r\n  el('tgBi').classList.toggle('on', !!state.flags.zh);\r\n  el('tgExam').classList.toggle('on', !!state.flags.exam);\r\n  el('tgAnno').classList.toggle('on', !!state.flags.note);\r\n  el('tgTag').classList.toggle('on', !!state.flags.tag);\r\n  el('presetSel').value = state.preset || '';\r\n  el('undoBtn').disabled = snapshots.length === 0;\r\n}\r\nfunction buildTypeSeg(){\r\n  var html = \"\";\r\n  TYPES.forEach(function(t){ html += '<button type=\"button\" data-type=\"'+t.id+'\">'+esc(t.name)+'</button>'; });\r\n  el('typeSeg').innerHTML = html;\r\n}\r\nfunction buildSceneSeg(){\r\n  var t = typeOfMode(state.mode);\r\n  var html = \"\";\r\n  t.scenes.forEach(function(s){ html += '<button type=\"button\" data-scene=\"'+s[0]+'\">'+esc(s[1])+'</button>'; });\r\n  if(t.scenes.length === 1) html += '<span class=\"hint\" style=\"align-self:center;margin-left:6px\">'+esc(t.desc)+'</span>';\r\n  el('sceneSeg').innerHTML = html;\r\n}\r\nfunction buildPresets(){\r\n  var html = '<option value=\"\">载入真题预设（'+PRESETS.length+' 篇）…</option>';\r\n  PRESETS.forEach(function(p){ html += '<option value=\"'+p.id+'\">'+esc(p.name)+'</option>'; });\r\n  el('presetSel').innerHTML = html;\r\n}\r\n\r\n/* ================= 复制 ================= */\r\nfunction buildText(withHeadTail){\r\n  var rows = collect(), out = \"\";\r\n  if(withHeadTail){\r\n    rows.filter(function(r){ return r.p===0; }).forEach(function(r){ out += sentencePlain(r.card, r.st) + \"\\n\"; });\r\n    if(out) out += \"\\n\";\r\n  }\r\n  [1,2,3].forEach(function(p){\r\n    var rs = rows.filter(function(r){ return r.p===p; });\r\n    if(!rs.length) return;\r\n    out += rs.map(function(r){ return sentencePlain(r.card, r.st); }).join(\" \") + \"\\n\\n\";\r\n  });\r\n  if(withHeadTail){\r\n    rows.filter(function(r){ return r.p===4; }).forEach(function(r){ out += sentencePlain(r.card, r.st) + \"\\n\"; });\r\n  }\r\n  return out.replace(/\\n{3,}/g,\"\\n\\n\").replace(/[ \\t]+\\n/g,\"\\n\").trim();\r\n}\r\nfunction copyText(txt, msg){\r\n  if(!txt){ toast('还没有内容可复制'); return; }\r\n  window.__LASTCOPY__ = txt;\r\n  var done = function(){ toast(msg); };\r\n  if(navigator.clipboard && navigator.clipboard.writeText){\r\n    navigator.clipboard.writeText(txt).then(done, function(){ fallback(txt); done(); });\r\n  } else { fallback(txt); done(); }\r\n  function fallback(t){\r\n    var ta = document.createElement('textarea');\r\n    ta.value = t; ta.style.position='fixed'; ta.style.left='-9999px';\r\n    document.body.appendChild(ta); ta.select();\r\n    try{ document.execCommand('copy'); }catch(e){}\r\n    document.body.removeChild(ta);\r\n  }\r\n}\r\n\r\n/* ================= 讲义要点 ================= */\r\nvar HELP_HTML = ''\r\n+ '<div class=\"h-sec\"><h3>一、大纲与题型</h3>'\r\n+ '<p>A 节：根据规定情景写 <b>约 100 词</b> 的应用文（标点不计），10 分。类型：<b>书信、通知、告示、纪要</b>。英一英二<b>大纲要求完全相同</b>，只是英二把提示分点列出，因此本模板通用。</p>'\r\n+ '<p>书信细分：表扬、投诉、求职、推荐、建议、辞职、道歉、询问、咨询、回复等；通知＝告示（notice），是换了格式的书信；纪要（23 年新增，未考过）本质与备忘录相同。</p></div>'\r\n+ '<div class=\"h-sec\"><h3>二、核心策略：不打类型战</h3>'\r\n+ '<p>所有书信打回原形只分两类：<b>被动写信</b>（按来信回复，收件人认识你，<b>不写自我介绍</b>）与 <b>主动写信</b>（从无到有发起邀请/投诉/建议，收件人不一定认识你，<b>必须自我介绍</b>）。二者只在称呼和第一段是否自我介绍上有区别。</p>'\r\n+ '<p>做法：<b>分类背第一、三段套话，合并学第二段核心内容</b>。同一件事换个身份就是另一种信——邀请一个人＝邀请信，邀请全体＝通知，作为选手问安排＝咨询信，提方案＝建议信，总结比赛＝纪要。<b>核心永远是时间、地点、人物、事件。</b></p></div>'\r\n+ '<div class=\"h-sec\"><h3>三、称呼四种情况</h3>'\r\n+ '<table><tr><th>题干给的线索</th><th>称呼</th></tr>'\r\n+ '<tr><td>只知道姓</td><td>Dear Mr. Lee / Dear Ms. Lee</td></tr>'\r\n+ '<tr><td>只知道名</td><td>Dear Paul / Dear John</td></tr>'\r\n+ '<tr><td>只知道职位</td><td>Dear Manager / President / Editor / Professor</td></tr>'\r\n+ '<tr><td>啥也不知道</td><td>Dear Sir or Madam / Dear Friends</td></tr></table>'\r\n+ '<p>注意：<b>Dear</b> 首字母大写、称呼后用逗号、Mr./Ms. 后面有缩写点。</p></div>'\r\n+ '<div class=\"h-sec\"><h3>四、第二段：功能句库，按 9 组记</h3>'\r\n+ '<p>①活动基本信息（时间地点事件）②活动主题目的 ③参与范围（选 2 句）④流程环节（选 2 句）⑤奖品收获·画饼（选 2 句，放段尾）⑥推荐对象（前 4 条全背，其余选 1）⑦能力展示与要求（自荐/推荐/求职 + 提要求）⑧感谢与道歉（只用于对应语境）⑨通用型（用途最广，全背）。</p>'\r\n+ '<p>本工具收录 <b>56 句</b>（讲义 50 句 + 补齐）。考场上<b>只需挑 2~3 句</b>（够讲清楚即可），建议全库先套用，找出自己高频使用的 20 句再背。<b>弱化题型区分，强化功能表达。</b></p></div>'\r\n+ '<div class=\"h-sec\"><h3>五、三套格式（最容易丢分的地方）</h3>'\r\n+ '<p><b>书信</b>：Dear X, → 正文三段 → Yours sincerely, → Li Ming（右下角）。不写地址、不签真名。</p>'\r\n+ '<p><b>通知</b>：Notice（居中）→ 日期 → 正文三段（概况+目的 / 具体内容 / 邀请报名方式）→ 署名 + 日期。</p>'\r\n+ '<p><b>纪要</b>：Minutes of Meeting → Date / Time / Location / Objective / Attendees → Meeting content：导入 → 目的 → 大佬发言 → 手下赞同 → 最终决定 →（下次会议）→ Recorded by + 日期。</p></div>'\r\n+ '<div class=\"h-sec\"><h3>六、考场节奏</h3>'\r\n+ '<p>小作文 <b>12~15 分钟</b>写完（100 词、8 句左右）：2 分钟读题定「谁写给谁、为什么写、写哪三件事」，其余时间默写。先在本工具里把 8 句定下来，考场只做「换词」。</p>'\r\n+ '<p>练习：每周 2~3 篇，考前一个月每天 1 篇；真题可反复练，英一英二小作文可互练。</p></div>'\r\n+ '<div class=\"h-sec\"><h3>七、常见失分点</h3>'\r\n+ '<p>① 忘写称呼或署名；② 通知/纪要错用 Yours sincerely；③ 主动写信漏自我介绍；④ 第一段没有点明「我写这封信是为了……」；'\r\n+ '⑤ 第二段堆 5 句以上（超字数、冲淡重点）；⑥ 把大作文的长难句搬进 100 词的小作文；⑦ 时间地点人物写错（题干给了就照抄，别自己编）。</p></div>';\r\n\r\n/* ================= 事件 ================= */\r\nfunction bind(){\r\n  el('typeSeg').addEventListener('click', function(e){\r\n    var b = e.target.closest('button[data-type]');\r\n    if(b) switchType(b.getAttribute('data-type'));\r\n  });\r\n  el('sceneSeg').addEventListener('click', function(e){\r\n    var b = e.target.closest('button[data-scene]');\r\n    if(b) switchScene(b.getAttribute('data-scene'));\r\n  });\r\n  el('presetSel').addEventListener('change', function(e){\r\n    if(e.target.value) applyPreset(e.target.value);\r\n  });\r\n  el('builder').addEventListener('change', function(e){\r\n    var node = e.target.closest('.card'); if(!node) return;\r\n    var cid = node.getAttribute('data-cid');\r\n    var card = cardById(cid), st = state.cards[cid];\r\n    if(!card || !st) return;\r\n    if(e.target.getAttribute('data-sel') === 'v'){\r\n      pushSnap(); st.v = parseInt(e.target.value,10)||0; st.touched = true;\r\n      state.preset = ''; save(); syncControls(); renderAll();\r\n    } else if(e.target.getAttribute('data-sub')){\r\n      pushSnap(); st.subs[e.target.getAttribute('data-sub')] = parseInt(e.target.value,10)||0;\r\n      st.touched = true; state.preset = ''; save(); syncControls(); renderAll();\r\n    }\r\n  });\r\n  el('builder').addEventListener('click', function(e){\r\n    var slot = e.target.closest('.slot');\r\n    if(slot){ e.preventDefault(); openPanel(slot.getAttribute('data-slot')); return; }\r\n    var tg = e.target.closest('[data-act=\"toggle\"]');\r\n    if(tg){\r\n      var node = tg.closest('.card'); var cid = node.getAttribute('data-cid');\r\n      var card = cardById(cid), st = state.cards[cid]; if(!card || !st) return;\r\n      pushSnap();\r\n      st.on = !cardOff(card, st);   /* 被隐藏则显式打开，反之关闭 */\r\n      st.touched = true;\r\n      state.preset = '';\r\n      save(); syncControls(); renderAll();\r\n      return;\r\n    }\r\n  });\r\n  el('panel').addEventListener('click', function(e){\r\n    var op = e.target.closest('.op');\r\n    if(!op || !panelKey) return;\r\n    var o = panelList[parseInt(op.getAttribute('data-i'),10)];\r\n    if(!o) return;\r\n    setSlot(panelKey, o.en);\r\n    closePanel(); renderAll();\r\n    toast('已填入：' + o.en);\r\n  });\r\n  el('pnInput').addEventListener('input', function(e){ drawPanel(e.target.value.trim()); });\r\n  el('pnInput').addEventListener('keydown', function(e){\r\n    if(e.key === 'Enter'){\r\n      e.preventDefault();\r\n      var v = e.target.value.trim();\r\n      if(v){ setSlot(panelKey, v); closePanel(); renderAll(); toast('已填入自定义内容'); }\r\n    }\r\n  });\r\n  el('pnSet').addEventListener('click', function(){\r\n    if(!panelKey) return;\r\n    var v = el('pnInput').value.trim();\r\n    setSlot(panelKey, v); closePanel(); renderAll(); toast(v?'已填入':'已清空该槽位');\r\n  });\r\n  el('pnClr').addEventListener('click', function(){\r\n    if(!panelKey) return;\r\n    setSlot(panelKey, ''); closePanel(); renderAll(); toast('已清空该槽位');\r\n  });\r\n  el('pnClose').addEventListener('click', closePanel);\r\n\r\n  el('helpBtn').addEventListener('click', function(){\r\n    el('helpBody').innerHTML = HELP_HTML;\r\n    el('helpPop').classList.add('on'); el('mask').classList.add('on');\r\n  });\r\n  el('helpX').addEventListener('click', function(){ el('helpPop').classList.remove('on'); el('mask').classList.remove('on'); });\r\n  el('mask').addEventListener('click', function(){ el('helpPop').classList.remove('on'); el('mask').classList.remove('on'); closePanel(); });\r\n\r\n  document.addEventListener('keydown', function(e){\r\n    if(e.key === 'Escape'){ closePanel(); el('helpPop').classList.remove('on'); el('mask').classList.remove('on'); }\r\n    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); undo(); }\r\n  });\r\n\r\n  [['tgBi','zh'],['tgExam','exam'],['tgAnno','note'],['tgTag','tag']].forEach(function(m){\r\n    el(m[0]).addEventListener('click', function(){\r\n      state.flags[m[1]] = !state.flags[m[1]];\r\n      syncControls(); save(); renderAll();\r\n    });\r\n  });\r\n\r\n  el('undoBtn').addEventListener('click', undo);\r\n  el('clearBtn').addEventListener('click', function(){\r\n    pushSnap();\r\n    state.slots = {};\r\n    state.preset = '';\r\n    save(); syncControls(); renderAll();\r\n    toast('已清空全部槽位（可撤销）');\r\n  });\r\n  el('copyBtn').addEventListener('click', function(){\r\n    copyText(buildText(true), '已复制全文（称呼 / 落款逐行，正文分段）');\r\n  });\r\n  el('copyEnBtn').addEventListener('click', function(){\r\n    copyText(buildText(false), '已复制正文三段');\r\n  });\r\n}\r\n\r\n/* ================= 启动 ================= */\r\nfunction syncOffset(){\r\n  var h = document.querySelector('.top');\r\n  if(h && h.offsetHeight > 0) document.documentElement.style.setProperty('--topH', h.offsetHeight + 'px');\r\n}\r\nfunction init(){\r\n  buildTypeSeg(); buildPresets();\r\n  var lsOK = true;\r\n  try{ localStorage.setItem('__probe__','1'); localStorage.removeItem('__probe__'); }catch(e){ lsOK = false; }\r\n  var ok = load();\r\n  if(!ok){\r\n    state = freshState('reply_pos');\r\n    applyPreset('x2025y1');\r\n    snapshots.length = 0;\r\n  }\r\n  ensureState(state.mode);\r\n  buildSceneSeg();\r\n  syncControls();\r\n  renderAll();\r\n  bind();\r\n  syncOffset();\r\n  window.addEventListener('resize', function(){ syncOffset(); });\r\n  if(!lsOK){\r\n    var f = document.querySelector('.pv-foot');\r\n    if(f){\r\n      var sp = document.createElement('span');\r\n      sp.textContent = '· 当前环境不支持本机保存，改动仅本次有效';\r\n      f.appendChild(sp);\r\n    }\r\n  }\r\n}\r\nif(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);\r\nelse init();\r\n\r\nwindow.__SZW__ = {\r\n  getState:function(){ return state; },\r\n  setMode:function(id){ switchScene(id); },\r\n  setType:function(id){ switchType(id); },\r\n  applyPreset:function(id){ applyPreset(id); },\r\n  cards:function(){ return activeCardIds(); },\r\n  setSlot:function(id,v){ state.slots[id]=v; renderAll(); },\r\n  undo:undo,\r\n  snapCount:function(){ return snapshots.length; },\r\n  text:function(full){ return buildText(!!full); },\r\n  words:function(){ return countWords(collect()); },\r\n  types:TYPES,\r\n  presets:PRESETS,\r\n  cards_:CARDS,\r\n  slots_:SLOTS,\r\n  banks:BANKS,\r\n  zhValue:zhValue,\r\n  zhSentence:zhSentence,\r\n  zhMap:function(){ buildZhMap(); return ZH_MAP; }\r\n};\r\n})();\r\n\r\n<\/script>\r\n</body>\r\n</html>\r\n"
};

theme=\"dark\"] .h-sec{border-bottom-color:#232833}\nhtml[data-theme=\"dark\"] .h-sec p,\nhtml[data-theme=\"dark\"] .h-sec li,\nhtml[data-theme=\"dark\"] .h-sec td{color:#a9b3c2}\nhtml[data-theme=\"dark\"] .h-sec h3{color:#e7eaf0}\nhtml[data-theme=\"dark\"] .h-sec th{background:#1b1f27;color:#e7eaf0}\nhtml[data-theme=\"dark\"] .h-sec th,\nhtml[data-theme=\"dark\"] .h-sec td{border-color:#2a303c}\nhtml[data-theme=\"dark\"] .toast{background:#e7eaf0;color:#0f1115}\nhtml[data-theme=\"dark\"] kbd{background:#1d2129;border-color:#2a303c;color:#c3cad6}\nhtml[data-theme=\"dark\"] .wordbar .bar{background:#2a303c}\nhtml[data-theme=\"dark\"] .mask{background:rgba(0,0,0,.55)}\nhtml[data-theme=\"dark\"] ::-webkit-scrollbar-thumb{background:#2f3a4a;border-color:#171a21}\nhtml[data-theme=\"dark\"] ::-webkit-scrollbar-thumb:hover{background:#3a4759}\nhtml[data-theme=\"dark\"] .foot-note{color:#6d7889}\n\nhtml[data-theme=\"dark\"] .card:hover{border-color:#3a4759}\nhtml[data-theme=\"dark\"] .switch i{background:#3a4759}\nhtml[data-theme=\"dark\"] .panel-h{border-bottom-color:#2a303c}\nhtml[data-theme=\"dark\"] .card-h{border-bottom-color:#2a303c}\nhtml[data-theme=\"dark\"] .ctl .lab,\nhtml[data-theme=\"dark\"] .toolbar,\nhtml[data-theme=\"dark\"] .brand .sub,\nhtml[data-theme=\"dark\"] .panel-h .meta,\nhtml[data-theme=\"dark\"] .card-h .hint,\nhtml[data-theme=\"dark\"] .card-h .count,\nhtml[data-theme=\"dark\"] .tb-group>label,\nhtml[data-theme=\"dark\"] .note,\nhtml[data-theme=\"dark\"] .zh-line{color:#8d97a8}\nhtml[data-theme=\"dark\"] .brand h1{color:#e7eaf0}\nhtml[data-theme=\"dark\"] .switch span{color:#c3cad6}\nhtml[data-theme=\"dark\"] .switch input:checked~span{color:#7bbcff}\nhtml[data-theme=\"dark\"] .gtitle{color:#e7eaf0}\nhtml[data-theme=\"dark\"] .gdot{box-shadow:0 0 0 4px rgba(90,169,255,.16)}\nhtml[data-theme=\"dark\"] .pop-in,\nhtml[data-theme=\"dark\"] .pop-h,\nhtml[data-theme=\"dark\"] .pop-f{border-color:#2a303c}\nhtml[data-theme=\"dark\"] .opt{background:transparent}\nhtml[data-theme=\"dark\"] .sent{color:#dfe5ee}\nhtml[data-theme=\"dark\"] .para-t .spacer{color:#2a303c}\nhtml[data-theme=\"dark\"] .h-sec b{color:#7bbcff}\nhtml[data-theme=\"dark\"] .empty-tip{color:#6d7889}\nhtml[data-theme=\"dark\"] .mini{color:#a9b3c2}\nhtml[data-theme=\"dark\"] .brand .dot{box-shadow:0 0 0 4px rgba(90,169,255,.16)}\n\r\n\n\n/* 深色：句子编号徽章（原为 var(--ink) 底 + #fff 字，深色下会白底白字） */\nhtml[data-theme=\"dark\"] .card-h .no{background:#2f3a4a;color:#dfe5ee;box-shadow:inset 0 0 0 1px #3d4a5e}\nhtml[data-theme=\"dark\"] .card-h .no{font-weight:600}\n";

/* ===== 四版外壳：切页 + 深浅色（注入优先，失败则烘焙到 srcdoc） ===== */
(function(){
"use strict";

var PAGES = {
  bigA:   { design:"A", native:"light", label:"大作文 · 版式一" },
  bigB:   { design:"B", native:"dark",  label:"大作文 · 版式二" },
  smallA: { design:"A", native:"light", label:"小作文 · 版式一" },
  smallB: { design:"B", native:"dark",  label:"小作文 · 版式二" }
};

/* 版式二（拼装台）深色 → 浅色 的色板映射 */
var D2L = {
  "#0f1115":"#fbf9f5", "#171a21":"#ffffff", "#1d2129":"#fcfbf8", "#232833":"#f3f0e9",
  "#2a303c":"#e3ddd2", "#e7eaf0":"#1b2a41", "#95a0b3":"#6b7a8d", "#6d7889":"#8a97a6",
  "#5aa9ff":"#1668b8", "#22405f":"#e8f1fb", "#a9d1ff":"#0f4c81",
  "#f0b90b":"#a8730f", "#3a2f0a":"#fdf3dc", "#3ddc97":"#128a76", "#ff7ba8":"#b4342b",
  "#2b323f":"#d7dee6", "#12151a":"#f7f4ed", "#2b3442":"#f0ece3", "#2a313d":"#eeeae1",
  "#333b49":"#ddd6c9", "#3a4351":"#d3ccbf", "#3a4352":"#ded8cb", "#3d4655":"#d9d2c5",
  "#3f4a5c":"#d5cec1", "#4d5a6d":"#9a9488", "#2c3442":"#efece4",
  "#2f5680":"#bcd6f0", "#3c5a7d":"#8fb6dd", "#274c73":"#cfe0f2", "#3a5c80":"#b7d2ec",
  "#39557a":"#a8c8e6", "#5a3346":"#ecc9d5", "#8a7b52":"#6b5a2e", "#5a6478":"#d9d3c8",
  "#8b95a7":"#6b7a8d", "#7f8fa6":"#7b8794",
  "#e9eef7":"#1f2b3a", "#dde3ee":"#22303f", "#dfe6f2":"#24313f",
  "#252b36":"#f1ede5", "#5a86b8":"#4a7fb5", "#6f7d92":"#7b8794"
};
var RGB2L = {
  "15,17,21":   [251,249,245],
  "90,169,255": [22,104,184],
  "240,185,11": [168,115,15],
  "0,0,0":      [0,0,0]
};
function swapCSS(txt){
  var out = String(txt).replace(/#[0-9a-fA-F]{3,8}\b/g, function(m){
    return D2L[m.toLowerCase()] || m;
  });
  out = out.replace(/rgba?\(\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})\s*(,\s*[\d.]+\s*)?\)/g, function(m, r, g, b, a){
    var key = r + "," + g + "," + b;
    var v = RGB2L[key];
    if(!v) return m;
    var body = v[0] + "," + v[1] + "," + v[2];
    return a ? ("rgba(" + body + a + ")") : ("rgb(" + body + ")");
  });
  return out;
}

var fr = document.getElementById("fr");
var tabs = document.getElementById("stabs");
var themeSeg = document.getElementById("themeSeg");
var current = "bigB", theme = "dark";
var bakedPage = null, bakedTheme = null;

function themed(html, t, pageId){
  var pg = PAGES[pageId || current];
  if(t === pg.native) return html;
  if(pg.design === "A"){
    var h = html.replace(/<html(\s|>)/i, '<html data-theme="dark"$1');
    return h.replace(/<\/head>/i, '<style id="__zw4_theme__">' + THEME_A_DARK + '</style></head>');
  }
  return swapCSS(html);
}
function canInject(doc){ return !!(doc && doc.body && doc.body.innerHTML && doc.body.innerHTML.length > 50); }

function applyToFrame(t){
  var doc = null;
  try{ doc = fr.contentDocument; }catch(e){ doc = null; }
  if(!canInject(doc)) return false;
  var pg = PAGES[current];
  var head = doc.head || doc.documentElement;
  var st = doc.getElementById("__zw4_theme__");
  var style = doc.querySelector("style");

  if(t === pg.native){
    if(st && st.parentNode) st.parentNode.removeChild(st);
    doc.documentElement.removeAttribute("data-theme");
    if(pg.design === "B" && style && style.__orig != null){ style.textContent = style.__orig; style.__orig = null; }
    return true;
  }
  if(pg.design === "A"){
    doc.documentElement.setAttribute("data-theme", "dark");
    if(!st){ st = doc.createElement("style"); st.id = "__zw4_theme__"; head.appendChild(st); }
    st.textContent = THEME_A_DARK;
  } else {
    if(!style) return false;
    if(style.__orig == null) style.__orig = style.textContent;
    style.textContent = (t === "light") ? swapCSS(style.__orig) : style.__orig;
    if(st && st.parentNode) st.parentNode.removeChild(st);
  }
  return true;
}

function ensureTheme(){
  if(theme === PAGES[current].native){
    if(bakedPage === current){ bakedPage = null; bakedTheme = null; fr.srcdoc = HP[current]; return; }
    applyToFrame(theme);
    return;
  }
  if(bakedPage === current && bakedTheme === theme) return;
  var tries = 0;
  (function attempt(){
    if(bakedPage === current && bakedTheme === theme) return;
    if(applyToFrame(theme)){ bakedPage = null; bakedTheme = null; return; }
    if(++tries > 6){
      bakedPage = current; bakedTheme = theme;
      fr.srcdoc = themed(HP[current], theme, current);
      return;
    }
    setTimeout(attempt, 70 * tries);
  })();
}

function setFrame(id){
  if(!PAGES[id]) return;
  current = id;
  bakedPage = null; bakedTheme = null;
  Array.prototype.forEach.call(tabs.querySelectorAll("button"), function(b){
    b.classList.toggle("on", b.getAttribute("data-page") === id);
  });
  fr.srcdoc = HP[id];
  try{ localStorage.setItem("zw4_page", id); }catch(e){}
  try{ history.replaceState(null, "", "#" + id); }catch(e){}
  ensureTheme();
}

function applyTheme(t){
  theme = t;
  document.documentElement.setAttribute("data-theme", t);
  var dark = (t === "dark");
  Array.prototype.forEach.call(themeSeg.querySelectorAll("button"), function(b){
    b.classList.toggle("on", b.getAttribute("data-theme") === t);
  });
  var meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", dark ? "#0f1115" : "#fbf9f5");
  try{ localStorage.setItem("zw4_theme", t); }catch(e){}
  ensureTheme();
}

tabs.addEventListener("click", function(e){
  var b = e.target.closest("button[data-page]");
  if(b) setFrame(b.getAttribute("data-page"));
});
themeSeg.addEventListener("click", function(e){
  var b = e.target.closest("button[data-theme]");
  if(b) applyTheme(b.getAttribute("data-theme"));
});
fr.addEventListener("load", function(){ ensureTheme(); });
document.addEventListener("keydown", function(e){
  var t = e.target;
  if(t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT")) return;
  if((e.key === "t" || e.key === "T") && !e.ctrlKey && !e.metaKey) applyTheme(theme === "dark" ? "light" : "dark");
});

var savedT = null, savedP = null;
try{ savedT = localStorage.getItem("zw4_theme"); savedP = localStorage.getItem("zw4_page"); }catch(e){}
var hashPage = (location.hash || "").replace("#","");
if(PAGES[hashPage]) savedP = hashPage;
window.addEventListener("hashchange", function(){
  var p = (location.hash || "").replace("#","");
  if(PAGES[p] && p !== current) setFrame(p);
});
if(!savedT && window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) savedT = "light";
theme = (savedT === "light") ? "light" : "dark";
applyTheme(theme);
setFrame(PAGES[savedP] ? savedP : "bigB");

window.__SHELL__ = {
  pages: PAGES,
  current: function(){ return current; },
  setPage: setFrame,
  theme: function(){ return theme; },
  setTheme: applyTheme,
  frame: function(){ return fr; },
  apply: function(){ ensureTheme(); return applyToFrame(theme); },
  themed: function(t, id){ return themed(HP[id || current], t || theme, id || current); },
  swap: swapCSS
};
})();

</script>
