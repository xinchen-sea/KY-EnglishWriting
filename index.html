ed\", hint:\"Thank you for sharing ___\"},\n  shareFeel: {label:\"感受\", bank:\"shareFeel\", hint:\"I truly enjoyed it —— 可拉长一句\"},\n  major:     {label:\"专业\", bank:\"major\", hint:\"Art / English……\"},\n  name:      {label:\"署名\", bank:\"name\", hint:\"英一 Li Ming，英二 Zhang Wei\"},\n  email:     {label:\"邮箱\", bank:\"email\", hint:\"报名邮箱\"},\n  host:      {label:\"主持人\", bank:\"host\", hint:\"纪要：the chairman / the host\"},\n  attendees: {label:\"参会人\", bank:\"attendees\", hint:\"All freshmen……\"},\n  meetingTopic:{label:\"会议议题\", bank:\"meetingTopic\", hint:\"纪要 Objective\"},\n  decision:  {label:\"决定\", bank:\"decision\", hint:\"The meeting agreed to ___\"},\n  opinion:   {label:\"观点\", bank:\"opinion\", hint:\"大佬发言的内容\"},\n  leadIn:    {label:\"寒暄补充\", bank:\"leadIn\", hint:\"I hope this letter finds you well and ___\"},\n  numWord:   {label:\"数量词\", bank:\"numWord\", hint:\"two / three factors\"},\n  contest:   {label:\"比赛（泛称）\", bank:\"contest\", hint:\"enter the competition\"},\n  meeting:   {label:\"会议\", bank:\"meeting\", hint:\"a departmental meeting……\"},\n  kindness:  {label:\"对方的情谊\", bank:\"kindness\", hint:\"hospitality / enthusiasm / assistance\"},\n  yourThing: {label:\"你的贡献\", bank:\"yourThing\", hint:\"effort / contribution / support\"},\n  optionA:   {label:\"对比项A\", bank:\"optionA\", hint:\"While I understand that A has advantages…\"}\n};\n\n/* ==== data_points.js ==== */\n/* ================= 第二段：50 个功能句 ================= */\nvar POINTS = [\n{g:\"① 活动的基本信息\", items:[\n {n:\"1 · 时间地点（陈述式）\", t:\"The {event} will be held in {place} at {clock} on {date}.\", zh:\"活动将于某日某时在某地举行。\", note:\"最通用的一句，交代时间+地点+事件；注 1~4 句选一句背住即可。\"},\n {n:\"2 · 我校主办\", t:\"Our university will host the {event} in {place} on {date}.\", zh:\"我校将于某日在某地主办该活动。\", note:\"强调主办方时用；host 比 hold 更主动。\"},\n {n:\"3 · 计划举行（起止时间）\", t:\"The {event} is scheduled to take place in {place} on {weekday} from {clock} to {clock2}.\", zh:\"活动定于周五晚 7 点到 8 点在某地举行。\", note:\"有明确起止时间时最准确（2022英二美食节）。\"},\n {n:\"4 · 正式会议式\", t:\"On {date}, a {meeting} will be held in {place}, commencing at {clock}.\", zh:\"某日，一场会议将在某地举行，于某时开始。\", note:\"commencing at 比 starting at 正式，适合会议/纪要。\"}\n]},\n{g:\"② 活动的主题与目的\", items:[\n {n:\"5 · 主题是\", t:\"The subject of the {event} is {topic}.\", zh:\"本次活动的主题是某事。\", note:\"subject / theme 均可；短平快。\"},\n {n:\"6 · 目的是\", t:\"The purpose of the {event} is to {purpose} {topic}.\", zh:\"本次活动的目的是讨论某事。\", note:\"最常用的目的句，purpose 后接动词原形。\"},\n {n:\"7 · 旨在深入讨论\", t:\"This {event} aims to facilitate an in-depth discussion on {topic}.\", zh:\"本次活动旨在促进关于某事的深入讨论。\", note:\"facilitate an in-depth discussion on 是加分搭配。\"},\n {n:\"8 · 在主题下举行\", t:\"This event is held under the theme of \\\"{theme}\\\".\", zh:\"本次活动在“某主题”下举行。\", note:\"引号里是口号式主题，题干给了就用。\"},\n {n:\"8b · 以…为主题（分词状语升级）\", t:\"Centered on the theme of \\\"{theme}\\\", the event aims to {purpose} {topic}.\", zh:\"以某主题为中心，本次活动旨在……。\", note:\"过去分词作状语，比 5~8 更高级，适合开头第二句。\"}\n]},\n{g:\"③ 活动的参与范围\", items:[\n {n:\"9 · 师生广泛参与\", t:\"The event is anticipated to attract wide participation from both students and faculty members.\", zh:\"预计该活动将吸引学生和教职工的广泛参与。\", note:\"只写参与面、不点具体人时用。\"},\n {n:\"10 · 各年级均可参加\", t:\"Students of all grades are eligible to enter the {contest}, including both domestic and international students.\", zh:\"所有年级学生都有资格参加，包括国内外学生。\", note:\"be eligible to 是“有资格”，比 can 正式。\"},\n {n:\"11 · 邀请各界领军人物\", t:\"We have invited leading figures from various sectors, including eminent scholars, renowned entrepreneurs, and senior media representatives.\", zh:\"我们邀请了各行业领军人物，包括杰出学者、知名企业家和资深媒体代表。\", note:\"活动规格高时用；三个并列名词要背熟。\"},\n {n:\"12 · 汇聚众多贵宾\", t:\"This event is expected to bring together a host of distinguished guests, including leading experts and scholars in the field, who have both profound knowledge and remarkable achievements in their respective areas.\", zh:\"本次活动预计汇聚众多贵宾，包括业内顶尖专家学者。\", note:\"最长、最“唬人”的一句，适合字数不够时补。\"}\n]},\n{g:\"④ 活动的流程环节\", items:[\n {n:\"13 · 有趣的活动\", t:\"Interesting activities such as {item1} and {item2} will be held to arouse students' enthusiasm for {topic}.\", zh:\"将举办歌唱比赛、辩论赛等有趣活动，以激发学生对该主题的热情。\", note:\"arouse one's enthusiasm for 是固定搭配。\"},\n {n:\"14 · 分组协作挑战\", t:\"Participants will be divided into teams for a collaborative challenge, designed to foster teamwork and creative problem-solving.\", zh:\"参与者将分组进行协作挑战，旨在培养团队精神与创造性解决问题能力。\", note:\"foster teamwork 适合团队类活动。\"},\n {n:\"15 · 三段式流程\", t:\"The event will commence with an opening ceremony, followed by a series of workshops and a keynote speech, and will conclude with a discussion session where participants can exchange ideas.\", zh:\"活动以开幕式开始，随后是工作坊和主题演讲，最后以讨论环节收尾。\", note:\"commence with / be followed by / conclude with 三连，背这一句顶三句。\"},\n {n:\"16 · 简版流程\", t:\"Following the opening ceremony, the event will feature a keynote speech, workshops, and a concluding discussion session for participant interaction.\", zh:\"开幕式后，活动包含主题演讲、工作坊和互动讨论环节。\", note:\"比 15 短，字数紧张时用。\"}\n]},\n{g:\"⑤ 活动的奖品与收获（画饼）\", items:[\n {n:\"17 · 难忘且有回报\", t:\"This will be a memorable and rewarding experience and the prizes and souvenirs will be very valuable.\", zh:\"这将是一次难忘且有回报的经历，奖品和纪念品都很丰厚。\", note:\"万能画饼句，几乎任何活动都能接。\"},\n {n:\"18 · 具体奖励\", t:\"To encourage more students to join, the top three winners will receive trophies and certificates, and all shortlisted participants will be awarded bonus points.\", zh:\"前三名获证书奖杯，所有入围者获加分。\", note:\"有比赛/评选时用，比 17 具体。\"},\n {n:\"19 · 结识同好\", t:\"During the event, you will have the opportunity to meet like-minded individuals, engage in interesting activities, and enjoy a great time together.\", zh:\"活动期间你将结识志同道合的人，参与有趣的活动。\", note:\"面向个人邀请时最自然。\"},\n {n:\"20 · 贡献+收获\", t:\"This {event} will allow you to contribute to the development of our university while gaining valuable experience in {aspect}.\", zh:\"此次活动将使你为学校发展做贡献，同时获得某方面的宝贵经验。\", note:\"while doing 结构；结尾画饼首选。\"},\n {n:\"20b · 开阔视野\", t:\"This activity offers a precious opportunity to broaden your horizons and enrich your campus life.\", zh:\"本次活动提供了开阔视野、丰富校园生活的宝贵机会。\", note:\"可直接接大作文六大方面，最短的一句饼。\"}\n]},\n{g:\"⑥ 推荐地方 / 书籍 / 名人 / 活动\", items:[\n {n:\"21 · 推荐景点\", t:\"Located in {scenePlace}, {scene} is one of the most popular scenic spots in the world.\", zh:\"位于某地的某景点是世界上最受欢迎的景点之一。\", note:\"推荐信第一点，全背（2024英二宏村）。\"},\n {n:\"22 · 推荐书籍/电影\", t:\"Written by {author}, {book} is one of the most popular books in the world.\", zh:\"由某人主笔，某书是世界上最受欢迎的书之一。\", note:\"电影改为 Directed by；书改 film 即可。\"},\n {n:\"23 · 介绍名人\", t:\"{figure} was an outstanding scientist during the {dynasty}, who made remarkable achievements in many fields.\", zh:\"某人是某朝代杰出的科学家，在许多领域取得卓越成就。\", note:\"2024英一写科学家的现成句。\"},\n {n:\"24 · 介绍活动\", t:\"Planned by the Student Union, the {event} is one of the most popular events in our university.\", zh:\"该活动由学生会策划，是我校最受欢迎的活动之一。\", note:\"活动类推荐的起手式。\"},\n {n:\"25 · 二选一对比\", t:\"While I understand that {optionA} has advantages in {aspect}, I believe {recommend} will provide you with a more profound and thought-provoking experience.\", zh:\"虽然我知道 A 在某方面有优势，但我相信 B 会带给你更深刻的体验。\", note:\"题目让你在两者间做选择时用（2023英二）。\"},\n {n:\"26 · 强烈推荐\", t:\"I would highly recommend {recommend} for its exceptional {feature1} and remarkable {feature2}.\", zh:\"我强烈推荐某物，因其卓越的……和非凡的……。\", note:\"需要两个特点词，考验词汇量。\"},\n {n:\"27 · 值得推荐之处\", t:\"What makes {recommend} highly recommendable is the unique experience it offers, which includes {segment}.\", zh:\"它之所以值得推荐，在于其独特体验，其中包括某环节。\", note:\"主语从句 + what makes，句式漂亮（2023英二范文）。\"}\n]},\n{g:\"⑦ 能力展示与岗位要求\", items:[\n {n:\"28 · 业绩证明\", t:\"Over the past few years, I have consistently excelled in my role, which is evidenced by the awards and recognition I have received.\", zh:\"过去几年我一直表现出色，所获奖项就是证明。\", note:\"自荐/求职用；excelled in my role 比 did well 高级。\"},\n {n:\"29 · 自我评价\", t:\"I am a highly self-motivated and resilient individual, capable of maintaining focus and productivity in fast-paced environments.\", zh:\"我高度自律且富有韧性，能在快节奏环境中保持专注和高效。\", note:\"两个形容词 + capable of，自荐第二句。\"},\n {n:\"30 · 协作能力\", t:\"I thrive in collaborative settings and have often been the one to facilitate communication and integrate diverse viewpoints in the team.\", zh:\"我在协作环境中能充分发挥，常充当促进沟通、整合观点的角色。\", note:\"强调 teamwork，适合团队类岗位。\"},\n {n:\"31 · 职责+要求\", t:\"The selected candidates will assist in conducting surveys, collecting and analyzing data on {topic}. Moreover, the candidates should be enthusiastic about {topic} and have sound organization and communication skills.\", zh:\"入选者将协助调查、收集分析数据；并应对该主题有热情、具备组织沟通能力。\", note:\"招募/找队友的“职责+要求”二合一句（2023英一）。\"},\n {n:\"32 · 岗位能力要求\", t:\"The role requires the ability to analyze complex problems, develop practical solutions, and execute them effectively.\", zh:\"该职位要求具备分析问题、制定方案并有效执行的能力。\", note:\"三个动词并列，招聘类通用。\"},\n {n:\"33 · 候选人条件\", t:\"The candidates should be enthusiastic about {topic} and have sound {ability} skills.\", zh:\"候选人应对某主题有热情，并具备良好的某能力。\", note:\"最短的要求句，改两个词即可复用。\"},\n {n:\"33b · 无需经验\", t:\"No previous experience is required, for we will provide full training and guidance.\", zh:\"无需经验，我们将提供完整培训与指导。\", note:\"万能补充句，招募志愿者时特别有用。\"}\n]},\n{g:\"⑧ 感谢与道歉\", items:[\n {n:\"34 · 感谢帮助\", t:\"I am extremely grateful to you for your unselfish assistance during the period of {project}.\", zh:\"非常感谢你在某项目期间给予的无私帮助。\", note:\"感谢信核心句（2010英二）。\"},\n {n:\"35 · 正是你使我…\", t:\"It is your {kindness} that enabled me to {doSth}.\", zh:\"正是你的款待/热情/帮助使我能够……。\", note:\"强调句 It is … that，情感更重。\"},\n {n:\"36 · 假设没你（进步）\", t:\"Without your generous help, I would not have made such great progress in {aspect}.\", zh:\"没有你的慷慨帮助，我不会在某方面取得如此大的进步。\", note:\"虚拟语气，感谢信第二句。\"},\n {n:\"37 · 假设没你（经历）\", t:\"Without your generous help, I would not have had such a wonderful experience.\", zh:\"没有你的帮助，我就不会有如此美妙的经历。\", note:\"比 36 更好背，2010英二原句。\"},\n {n:\"38 · 期待指导\", t:\"All of us desire to improve our ability of {ability} under your professional guidance.\", zh:\"我们都希望在您的专业指导下提升某能力。\", note:\"邀请信也能用（拍马屁），讲义注 38 句。\"},\n {n:\"39 · 立即补救\", t:\"To make up for it, I am ready to immediately correct the mistake and offer my full assistance to resolve the matter.\", zh:\"为弥补，我准备立即纠正错误并全力协助解决。\", note:\"仅用于道歉信；可任选 1 句背。\"},\n {n:\"40 · 保证不再犯\", t:\"I assure you that I have learned a valuable lesson from this and will take concrete steps to ensure it does not happen again.\", zh:\"我保证已吸取教训，并将采取具体措施确保不再发生。\", note:\"道歉信收尾，态度分。\"}\n]},\n{g:\"⑨ 通用型（讲义要求全背）\", items:[\n {n:\"41 · 急需某物\", t:\"We are badly in need of {need}, which can help us {helpDo}.\", zh:\"我们急需某物，它能帮我们做某事。\", note:\"in need of 后接名词或动名词，最万能的一句。\"},\n {n:\"42 · 由于某原因\", t:\"Due to {causeWhy}, it is {convenient} for us to {doSth2}.\", zh:\"由于某原因，我们做某事是（不）方便的。\", note:\"投诉/建议信的主力句（2007图书馆）。\"},\n {n:\"43 · 我想知道能否\", t:\"I wonder if you can {doSth} so that {soThat}.\", zh:\"不知你能否做某事，这样我就能……。\", note:\"提请求最礼貌的句式，几乎每篇都能用。\"},\n {n:\"44 · 如果改进就有机会\", t:\"We could have more opportunities to {chance} if you improve {improve}.\", zh:\"如果你改进某事，我们就有更多机会……。\", note:\"建议信的条件句，语气柔和。\"},\n {n:\"45 · 做某事是明智的\", t:\"It is advisable to {advice}, which can really help you {effect}.\", zh:\"做某事是明智的，它能真正帮到你。\", note:\"建议信 / 回复建议都可以。\"},\n {n:\"46 · 鉴于事实\", t:\"Given the fact that {fact}, it would be wise for us to {advice}.\", zh:\"鉴于某事实，我们做某事才是明智的。\", note:\"Given the fact that 比 because 高级。\"},\n {n:\"47 · 探索创造力\", t:\"{objectX} provides a unique opportunity to let you explore your creativity.\", zh:\"某物提供了探索创造力的独特机会。\", note:\"创意类活动/展览专用。\"},\n {n:\"48 · 你的贡献是关键\", t:\"Everyone agrees that your {yourThing} is the key to the satisfactory outcome.\", zh:\"大家都认为你的努力是取得满意结果的关键。\", note:\"给对方戴高帽，邀请/感谢皆可用。\"},\n {n:\"49 · 体验不同文化\", t:\"{objectX} allows you to experience different cultures and social customs.\", zh:\"某物能让你体验不同的文化和社会习俗。\", note:\"美食节/展览/旅行类；也可换 encyclopedic knowledge of nature。\"},\n {n:\"50 · 向你学习\", t:\"I am confident that the students will not only have the opportunity to learn from you, but also to draw inspiration from your example.\", zh:\"我相信学生们不仅能向您学习，还能从您的榜样中汲取灵感。\", note:\"邀请教授/专家时收尾，not only…but also。\"}\n]}\n];\n\n/* 展开成变体（保留分组，供 optgroup 使用） */\nvar POINT_VARIANTS = [];\nPOINTS.forEach(function(g){\n  g.items.forEach(function(it){\n    POINT_VARIANTS.push({name:it.n, text:it.t, zh:it.zh, note:it.note, g:g.g});\n  });\n});\n\nvar ORD = [\n  {name:\"Firstly,\", text:\"Firstly,\", zh:\"首先（并列三连）\"},\n  {name:\"Moreover,\", text:\"Moreover,\", zh:\"此外（递进）\"},\n  {name:\"In the end,\", text:\"In the end,\", zh:\"最后（收尾）\"},\n  {name:\"First and foremost,\", text:\"First and foremost,\", zh:\"首要的是\"},\n  {name:\"In addition,\", text:\"In addition,\", zh:\"此外\"},\n  {name:\"Last but not least,\", text:\"Last but not least,\", zh:\"最后同样重要的是\"},\n  {name:\"To begin with,\", text:\"To begin with,\", zh:\"首先\"},\n  {name:\"Secondly,\", text:\"Secondly,\", zh:\"其次\"},\n  {name:\"Thirdly,\", text:\"Thirdly,\", zh:\"再次\"},\n  {name:\"In the first place,\", text:\"In the first place,\", zh:\"第一（2007 范文）\"},\n  {name:\"In the second place,\", text:\"In the second place,\", zh:\"第二\"},\n  {name:\"In the third place,\", text:\"In the third place,\", zh:\"第三\"},\n  {name:\"Finally,\", text:\"Finally,\", zh:\"最后\"},\n  {name:\"（不写序号）\", text:\"\", zh:\"不用序号，直接写句子\"}\n];\n\n/* ==== data_cards.js ==== */\n/* ================= 句型卡片（小作文） ================= */\nvar CARDS = [\n/* ---------- 称呼 ---------- */\n{\n  id:\"salute\", p:0, no:\"称呼\", title:\"称呼\", hint:\"先读题，看收信人是谁\", raw:true,\n  variants:[\n    {name:\"只知道姓（男）· Dear Mr. Lee,\", text:\"Dear Mr. {surname},\", zh:\"尊敬的李先生：\", note:\"情况 1：只知道姓，男性用 Mr.，女性用 Ms.。\"},\n    {name:\"只知道姓（女）· Dear Ms. Lee,\", text:\"Dear Ms. {surname},\", zh:\"尊敬的李女士：\", note:\"情况 1：女性用 Ms.（不必区分婚否）。\"},\n    {name:\"只知道名 · Dear David,\", text:\"Dear {givenname},\", zh:\"亲爱的大卫：\", note:\"情况 2：只知道名，直接 Dear + 名（2023英二 Dear David,）。\"},\n    {name:\"只知道职位 · Dear Professor,\", text:\"Dear {titleJob},\", zh:\"尊敬的教授：\", note:\"情况 3：只知道职位——Manager / President / Editor / Professor（2022英一 Dear Professor,）。\"},\n    {name:\"职位+姓 · Dear Professor Smith,\", text:\"Dear {titleJob} {surname},\", zh:\"尊敬的史密斯教授：\", note:\"情况 3 的升级版，知道姓时更具体。\"},\n    {name:\"啥也不知道 · Dear Sir or Madam,\", text:\"Dear Sir or Madam,\", zh:\"尊敬的先生/女士：\", note:\"情况 4：兜底写法，写给机构/不知姓名的人。\"},\n    {name:\"写给群体 · Dear Friends,\", text:\"Dear Friends,\", zh:\"亲爱的朋友们：\", note:\"告示/群体邀请可用；正式通知一般不加称呼。\"}\n  ]\n},\n/* ---------- 第一段（被动回复） ---------- */\n{\n  id:\"p1_bg\", p:1, no:\"1a\", title:\"背景提要\", hint:\"被动写信·第一句\",\n  variants:[\n    {name:\"积极 · Thanks for your email\", text:\"Thanks for your email. I am very glad to hear that {matter}.\", zh:\"谢谢你的来信，很高兴得知……。\", note:\"回复信最常用：先谢来信，再点出对方来信内容（2025英一、2026英一原句）。注意 that 后要接完整句子。\"},\n    {name:\"积极 · interested in\", text:\"Thanks for your email. I am very glad to hear that you are interested in {matter}.\", zh:\"谢谢你的来信，很高兴得知你对……感兴趣。\", note:\"对方表达兴趣时用，比上一句更贴题。\"},\n    {name:\"积极 · Thank you for sharing\", text:\"Thank you for sharing {shared} with me. I truly enjoyed it.\", zh:\"感谢你与我分享……，我真的很喜欢。\", note:\"对方分享照片/视频时用（2026英二原句）。\"},\n    {name:\"积极 · 分享+拉长\", text:\"Thank you for sharing {shared} with me. I truly enjoyed it — {shareFeel}.\", zh:\"感谢分享……，我真的很喜欢——……。\", note:\"讲义“拉长”写法：破折号后补一句感受，字数不够时用。\"},\n    {name:\"积极 · I was delighted\", text:\"I was delighted to receive your email about {matter}.\", zh:\"很高兴收到你关于……的来信。\", note:\"比 Thanks for your email 更书面。\"},\n    {name:\"消极 · I am sorry to hear\", text:\"I am sorry to hear that {matter}.\", zh:\"很抱歉得知……。\", note:\"消极场景（投诉/坏消息）用；matter 填坏消息内容。\"},\n    {name:\"消极 · I must apologize\", text:\"I must apologize for {matter}.\", zh:\"我必须为……道歉。\", note:\"自己的过错时用；后接名词或动名词。\"},\n    {name:\"情绪 · express my …\", text:\"I want to express my {mood} through this letter regarding {matter}.\", zh:\"我想通过这封信表达我对……的（不满/歉意/遗憾）。\", note:\"心情词：disappointment / displeasure / apology / regret。\"},\n    {name:\"寒暄 · finds you well\", text:\"I hope this letter finds you well and {leadIn}.\", zh:\"展信佳，……。\", note:\"讲义例句：I hope this email finds you well and it is difficult to decide between the two shows.（2023英二）\"},\n    {name:\"寒暄 · great pleasure\", text:\"It was a great pleasure to receive your email.\", zh:\"收到您的来信，我深感愉快。\", note:\"通用寒暄，题干信息不足时用它。\"},\n    {name:\"寒暄 · give me great pleasure\", text:\"It gives me great pleasure to write to you.\", zh:\"能给您写这封信，我倍感荣幸。\", note:\"正式场合的寒暄。\"},\n    {name:\"寒暄 · warmest greetings\", text:\"Allow me to extend my warmest greetings to you.\", zh:\"请允许我向您致以最诚挚的问候。\", note:\"最正式的一句寒暄，适合写给机构/教授。\"}\n  ]\n},\n/* ---------- 第一段（公务/主动） ---------- */\n{\n  id:\"p1_self\", p:1, no:\"1a\", title:\"自我介绍\", hint:\"公务信函·不可省略\",\n  variants:[\n    {name:\"学生（系别）\", text:\"I am a student from the department of {major} at a university.\", zh:\"我是某大学某系的学生。\", note:\"题干没给身份时默认自己是学生。\"},\n    {name:\"本科生（专业）\", text:\"I am an undergraduate at a university, majoring in {major}.\", zh:\"我是一名大学生，专业是……。\", note:\"majoring in 比 my major is 更自然。\"},\n    {name:\"在读学位\", text:\"I am currently pursuing a degree in {major} at a university.\", zh:\"我目前在某大学攻读……学位。\", note:\"最正式的一种自我介绍。\"},\n    {name:\"身份短语 · As a member of the Student Union,\", text:\"As a member of the Student Union,\", zh:\"作为学生会的一员，\", note:\"短语式，不单独成句，直接接下一句（2022英一题干提示）。\"},\n    {name:\"代表学生会\", text:\"I am writing on behalf of the Student Union.\", zh:\"我代表学生会写这封信。\", note:\"以组织名义发信时用。\"}\n  ]\n},\n{\n  id:\"p1_intent\", p:1, no:\"1b\", title:\"来信意图\", hint:\"主动/被动都要写\",\n  variants:[\n    {name:\"I am writing to …\", text:\"I am writing to {intention}.\", zh:\"我写信是为了……。\", note:\"最通用的意图句，30 个意图短语在词库里按信件类型分组。\"},\n    {name:\"in order to …\", text:\"I am writing this letter in order to {intention}.\", zh:\"我写这封信是为了……。\", note:\"比上一句长一点，适合字数不够时。\"},\n    {name:\"The purpose of this letter\", text:\"The purpose of this letter is to {intention}.\", zh:\"本信旨在……。\", note:\"场景较严肃时用（正式开头）。\"},\n    {name:\"with the intention of\", text:\"I am writing with the intention of {intention}.\", zh:\"我写此信意在……。\", note:\"讲义给的第二个正式开头。\"},\n    {name:\"邀请专用 · my honor\", text:\"It is my honor to invite you to {event}.\", zh:\"我很荣幸地邀请您参加……。\", note:\"邀请信用；It is my honor 可换 It gives me immense pleasure to。\"},\n    {name:\"通知专用 · my honor\", text:\"It is my honor to inform you that {event} will be held in our university.\", zh:\"我很荣幸地通知您，我校将举办……。\", note:\"2022英一原句的骨架。\"},\n    {name:\"融入式 · 公务\", text:\"As a student in the {major} Department, I am writing to {intention}.\", zh:\"作为某系的学生，我写信是为了……。\", note:\"自我介绍与意图合二为一，省一句话。\"},\n    {name:\"融入式 · 英一原句\", text:\"As a student in the {major} Department, it is my honor to inform you that our university will be hosting {event}.\", zh:\"作为某系学生，我很荣幸地通知您，我校将举办……。\", note:\"2022英一范文第一段原句，背下来直接用。\"}\n  ]\n},\n/* ---------- 第二段 ---------- */\n{\n  id:\"p2_trans\", p:2, no:\"2\", title:\"过渡句\", hint:\"第二段第一句\",\n  variants:[\n    {name:\"因素 · factors accounting for\", text:\"There are at least {numWord} factors accounting for my {intentNoun}.\", zh:\"至少有两个/三个因素可以解释我的（建议/投诉/邀请）。\", note:\"英一写三点、英二两点；省略号处是意图的名词形式。\"},\n    {name:\"原因 · are as follows\", text:\"The primary reasons for my {intentNoun} are as follows.\", zh:\"我（建议/邀请）的主要理由如下。\", note:\"最稳的一句，后面直接分点。\"},\n    {name:\"原因 · outlined below\", text:\"The reasons for my {intentNoun} are outlined below.\", zh:\"我的理由列述如下。\", note:\"outlined below 更书面。\"},\n    {name:\"细节 · can be listed\", text:\"The details can be listed as follows.\", zh:\"具体细节列举如下。\", note:\"活动类/介绍类首选，不需要名词化。\"},\n    {name:\"细节 · Here are the details\", text:\"Here are the details of the {event}.\", zh:\"以下是本次活动的细节。\", note:\"通知/介绍信常用，最省事。\"},\n    {name:\"答复 · questions you raised\", text:\"As for the questions you raised, here are my answers.\", zh:\"关于你提出的问题，以下是我的回答。\", note:\"答复信专用。\"},\n    {name:\"答复 · one by one\", text:\"Let me answer your questions one by one.\", zh:\"让我逐一回答你的问题。\", note:\"答复信的口语化版本。\"},\n    {name:\"关于 · about\", text:\"There are my {intentNoun} about {topic}.\", zh:\"以下是我关于……的（建议/看法）。\", note:\"讲义原句；about 后接主题词。\"}\n  ]\n},\n{\n  id:\"p2_p1\", p:2, no:\"3\", title:\"分点①\", hint:\"50 个功能句任选\",\n  variants:POINT_VARIANTS, defOrd:\"Firstly,\",\n  subs:[{key:\"ord\", label:\"序号\", options:ORD}]\n},\n{\n  id:\"p2_p2\", p:2, no:\"4\", title:\"分点②\", hint:\"50 个功能句任选\",\n  variants:POINT_VARIANTS, defOrd:\"Moreover,\",\n  subs:[{key:\"ord\", label:\"序号\", options:ORD}]\n},\n{\n  id:\"p2_p3\", p:2, no:\"5\", title:\"分点③\", hint:\"可写可不写\",\n  variants:POINT_VARIANTS, defOrd:\"In the end,\",\n  subs:[{key:\"ord\", label:\"序号\", options:ORD}]\n},\n{\n  id:\"p2_p4\", p:2, no:\"6\", title:\"分点④（备用）\", hint:\"字数不够时补一句\",\n  variants:POINT_VARIANTS, optional:true, defOrd:\"In addition,\",\n  subs:[{key:\"ord\", label:\"序号\", options:ORD}]\n},\n{\n  id:\"p2_tail\", p:2, no:\"7\", title:\"秩序提醒（通知专用）\", hint:\"可放第二段末尾\",\n  optional:true,\n  variants:[\n    {name:\"提前安排时间\", text:\"Please arrange your time in advance and attend the activity on time.\", zh:\"请提前安排好时间，准时参加活动。\", note:\"通知第二段末尾，字数不够时补。\"},\n    {name:\"遵守现场秩序\", text:\"During the activity, please observe the on-site order and follow the arrangements of the staff.\", zh:\"活动期间请遵守现场秩序，听从工作人员安排。\", note:\"大型活动的礼貌提醒。\"},\n    {name:\"积极配合\", text:\"In order to ensure the smooth progress of the activity, please actively cooperate and jointly create a good activity atmosphere.\", zh:\"为确保活动顺利进行，请积极配合，共同营造良好氛围。\", note:\"通知结尾的“官方腔”。\"}\n  ]\n},\n/* ---------- 第三段 ---------- */\n{\n  id:\"p3_emotion\", p:3, no:\"8\", title:\"表示情感\", hint:\"感谢/歉意/期待\",\n  variants:[\n    {name:\"感谢考虑\", text:\"I would like to express my gratitude for your kind consideration of my {intentNoun}.\", zh:\"感谢您考虑我的建议/申请。\", note:\"建议信、申请信收尾。\"},\n    {name:\"致歉\", text:\"Please accept my sincere apology for any inconvenience that I have caused.\", zh:\"对造成的不便致以诚挚歉意。\", note:\"道歉信专用。\"},\n    {name:\"祝旅途愉快\", text:\"I hope all the members will enjoy the journey.\", zh:\"希望所有成员都能享受这段旅程。\", note:\"与旅行/参观相关时用。\"},\n    {name:\"联系方式\", text:\"For more information about the activity, please do not hesitate to contact me.\", zh:\"如需了解更多信息，请随时与我联系。\", note:\"最万能的一句，任何活动通知都能接。\"},\n    {name:\"感谢接受邀请\", text:\"We would appreciate it very much if you could accept our invitation.\", zh:\"如果您能接受邀请，我们将不胜感激。\", note:\"邀请信收尾（2022英一可接）。\"},\n    {name:\"期待参与\", text:\"We hope for your active participation and make this {eventS} a grand success.\", zh:\"期待您的积极参与，共同使本次活动圆满成功。\", note:\"通知/告示收尾。\"},\n    {name:\"莅临倍感荣幸\", text:\"It would be our great honor if you could grace the occasion with your presence.\", zh:\"如若您能莅临，我们将倍感荣幸。\", note:\"邀请重要嘉宾（教授、领导）时用，最正式。\"},\n    {name:\"问候家人 · give my best regards\", text:\"Please give my best regards to your family.\", zh:\"请代我向你的家人问好。\", note:\"写给个人时通用；以下三句同义，任选。\"},\n    {name:\"问候家人 · send my best wishes\", text:\"Please send my best wishes to your family.\", zh:\"请代我向你的家人致以最美好的祝愿。\", note:\"同上。\"},\n    {name:\"问候家人 · kind regards\", text:\"Kindly send my sincere regards to your family.\", zh:\"请代我向你的家人致以诚挚问候。\", note:\"同上，最正式。\"},\n    {name:\"再次感谢\", text:\"Thank you again for your generous help and I hope to see you soon.\", zh:\"再次感谢你的慷慨帮助，希望很快见到你。\", note:\"感谢信收尾的保险句。\"}\n  ]\n},\n{\n  id:\"p3_reply\", p:3, no:\"9\", title:\"期待回信\", hint:\"最后一句\",\n  variants:[\n    {name:\"at your earliest convenience\", text:\"I would be grateful if you could reply at your earliest convenience.\", zh:\"如您能在方便时尽快回复，我将不胜感激。\", note:\"最正式的一句。\"},\n    {name:\"prompt reply\", text:\"Your prompt reply will be highly appreciated.\", zh:\"非常感谢您的及时回复。\", note:\"最短，适合字数已够时。\"},\n    {name:\"looking forward to hearing\", text:\"I am looking forward to hearing from you soon.\", zh:\"期待很快收到您的来信。\", note:\"最常用、最自然的一句。\"},\n    {name:\"（不需要回信）\", text:\"I am looking forward to your coming.\", zh:\"期待您的到来。\", note:\"通知/单向告知时用，不要求回信。\"}\n  ]\n},\n/* ---------- 落款 ---------- */\n{\n  id:\"sign\", p:4, no:\"落款\", title:\"落款\", hint:\"右下角\", raw:true,\n  variants:[\n    {name:\"Yours sincerely,\", text:\"Yours sincerely,\\n{name}\", zh:\"您诚挚的，李明\", note:\"知道对方姓名时用 Yours sincerely；一般就是李明。\"},\n    {name:\"Yours faithfully,\", text:\"Yours faithfully,\\n{name}\", zh:\"您忠实的，李明\", note:\"不知道对方姓名（Dear Sir or Madam）时用 Yours faithfully。\"},\n    {name:\"Best regards,\", text:\"Best regards,\\n{name}\", zh:\"此致敬意，李明\", note:\"较亲切，写给熟人/同事。\"}\n  ]\n},\n/* ---------- 通知 / 告示 ---------- */\n{\n  id:\"n_title\", p:0, no:\"标题\", title:\"标题\", hint:\"Notice\", raw:true,\n  variants:[\n    {name:\"Notice\", text:\"Notice\", zh:\"通知\", note:\"通知=告示，英文都是 notice，居中写标题。\"},\n    {name:\"NOTICE\", text:\"NOTICE\", zh:\"通知（全大写）\", note:\"全大写更醒目，格式上更“公告”。\"}\n  ]\n},\n{\n  id:\"n_p1a\", p:1, no:\"1a\", title:\"通知概况\", hint:\"第一句\",\n  variants:[\n    {name:\"It is a pleasure to inform\", text:\"It is a pleasure to inform everyone that a {event} will be held in our university.\", zh:\"很高兴地通知大家，我校将举办一场……活动。\", note:\"通知第一句，最稳。\"},\n    {name:\"We are pleased to announce\", text:\"We are pleased to announce that a {event} will be held in our university.\", zh:\"我们很高兴地宣布，我校将举办一场……活动。\", note:\"announce 比 inform 更“公告”。\"},\n    {name:\"Attention all students\", text:\"Attention all students interested in {topic} on campus!\", zh:\"校园里所有对……感兴趣的同学请注意！\", note:\"号召式开头，适合社团招募。\"},\n    {name:\"To enrich … our club will host\", text:\"To enrich students' extracurricular life and improve communication among club members, our club will host a wonderful {eventS}.\", zh:\"为丰富学生课外生活、增进社团成员交流，我们社团将举办一场精彩的活动。\", note:\"目的前置的分词/不定式状语，句首更有分量。\"}\n  ]\n},\n{\n  id:\"n_p1b\", p:1, no:\"1b\", title:\"通知目的\", hint:\"第二句\",\n  variants:[\n    {name:\"intended to introduce\", text:\"This notice is intended to introduce some details of this {contest}.\", zh:\"本通知旨在介绍本次比赛的一些细节。\", note:\"最直白的过渡。\"},\n    {name:\"serves the purpose of\", text:\"This notice serves the purpose of introducing some of the activities.\", zh:\"这则通知的目的是介绍一些活动。\", note:\"比上一句更正式。\"},\n    {name:\"hereby notified\", text:\"The relevant matters are hereby notified as follows.\", zh:\"现将相关事宜通知如下。\", note:\"公文腔，评卷人眼中的“格式分”。\"},\n    {name:\"the following are\", text:\"The following are the notifications of the relevant matters.\", zh:\"以下是有关事项的通知。\", note:\"同上，任选一句。\"}\n  ]\n},\n{\n  id:\"n_p3\", p:3, no:\"8\", title:\"发出邀请 / 报名方式\", hint:\"第三段\",\n  variants:[\n    {name:\"Put it into practice!\", text:\"Put it into practice! If you are interested in {topic}, this will be a memorable experience for you. We are looking forward to your enthusiastic participation. Please email us at {email} to sign up.\", zh:\"快行动吧！如果你对……感兴趣，这将是一次难忘的经历。期待你的热情参与，请发邮件至……报名。\", note:\"讲义原句，三句一气呵成。\"},\n    {name:\"You are welcome to join us\", text:\"You are welcome to join us. If you are interested in this activity and are willing to have quite a different experience these days, please do not hesitate to email us at {email}.\", zh:\"欢迎加入我们。如果你对活动感兴趣、愿意体验不一样的经历，请发邮件至……。\", note:\"口语化，适合学生活动。\"},\n    {name:\"ideal opportunity\", text:\"If you are passionate about {topic}, this is an ideal opportunity for you! To apply, please email us at {email}.\", zh:\"如果你对……充满热情，这对你来说是理想的机会！报名请发邮件至……。\", note:\"最短的一句，字数紧张时用。\"},\n    {name:\"scan the QR code\", text:\"We look forward to your active participation and believe this activity will bring you an unforgettable experience! Please scan the QR code below to sign up!\", zh:\"期待大家的积极参与！请扫描下方二维码报名！\", note:\"现代校园通知常见，但考试中邮箱更保险。\"}\n  ]\n},\n{\n  id:\"n_sign\", p:4, no:\"署名\", title:\"署名+日期\", hint:\"右下角\", raw:true,\n  variants:[\n    {name:\"单位 + 日期\", text:\"{name}\\n{date}\", zh:\"署名（通常 The Student Union）+ 日期\", note:\"通知的落款是“署名 + 日期”，日期写 December 20, 2025 这种形式。\"},\n    {name:\"The Student Union\", text:\"The Student Union\\n{date}\", zh:\"学生会 + 日期\", note:\"以组织名义发布时不必写个人姓名。\"}\n  ]\n},\n/* ---------- 纪要 ---------- */\n{\n  id:\"m_title\", p:0, no:\"标题\", title:\"标题\", hint:\"Minutes of Meeting\", raw:true,\n  variants:[\n    {name:\"Minutes of Meeting\", text:\"Minutes of Meeting\", zh:\"会议纪要\", note:\"纪要标题用 Minutes of Meeting 或 Summary of Meeting。\"},\n    {name:\"Summary of Meeting\", text:\"Summary of Meeting\", zh:\"会议摘要\", note:\"两种写法都行，选一个背。\"}\n  ]\n},\n{\n  id:\"m_info\", p:5, no:\"抬头\", title:\"会议信息\", hint:\"Date / Time / Location\", raw:true,\n  variants:[\n    {name:\"标准抬头五项\", text:\"Date: {date}\\nTime: From {clock} to {clock2}\\nLocation: {place}\\nObjective: {meetingTopic}\\nAttendees: {attendees}\\nMeeting content:\", zh:\"日期 / 时间 / 地点 / 议题 / 参会人 / 会议内容：\", note:\"格式与通知类似，抬头信息来自题干，Objective 用短语即可。\"},\n    {name:\"简版抬头\", text:\"Date: {date}\\nTime: From {clock} to {clock2}\\nLocation: {place}\\nObjective: {meetingTopic}\", zh:\"日期 / 时间 / 地点 / 议题\", note:\"信息不足时只写四项，也能得分。\"}\n  ]\n},\n{\n  id:\"m_s1\", p:1, no:\"1\", title:\"导入 / 介绍\", hint:\"会议怎么开始\",\n  variants:[\n    {name:\"warm welcome\", text:\"The meeting commenced with a warm welcome from {host}, followed by an introduction to the purpose of gathering.\", zh:\"（主持人）首先对大家的到来表示热烈欢迎，随后介绍了此次会议的目的。\", note:\"纪要第一句，交代“谁开场、目的是什么”。\"},\n    {name:\"welcoming remarks\", text:\"{host} delivered welcoming remarks, and provided a brief overview of the significance of {meetingTopic}.\", zh:\"（主持人）致欢迎辞，并简要介绍了……的意义。\", note:\"比上一句更正式，突出会议主题的重要性。\"}\n  ]\n},\n{\n  id:\"m_s2\", p:1, no:\"2\", title:\"会议目的\", hint:\"这次会议为什么开\",\n  variants:[\n    {name:\"回顾上周活动\", text:\"The meeting aimed to briefly review the {meetingTopic}.\", zh:\"本次会议的目的是对上周的活动做一个简要回顾。\", note:\"复盘型会议用；后接活动名词。\"},\n    {name:\"计划下周活动\", text:\"The meeting aimed to make a plan for the {meetingTopic}.\", zh:\"这次会议的目的是为下周活动制定计划。\", note:\"筹划型会议用。\"},\n    {name:\"讨论问题并找方案\", text:\"The meeting aimed to discuss the problem of {meetingTopic} and find some suitable solutions.\", zh:\"这次会议的目的是讨论……的问题，并找到合适的解决方案。\", note:\"问题导向型会议，最通用。\"}\n  ]\n},\n{\n  id:\"m_s2b\", p:1, no:\"2b\", title:\"参与讨论（可选）\", hint:\"接在目的句后\",\n  optional:true,\n  variants:[\n    {name:\"Many students participa >'+esc(v.zh||\"\")+'</div>';\n  return h + '</div></div>';\n}\nfunction renderBuilder(){\n  var m = modeById(state.mode), html = \"\", lastP = null;\n  modeCardList(m).forEach(function(c){\n    var card = cardById(c.id), st = state.cards[c.id];\n    if(!card || !st) return;\n    if(card.p !== lastP){\n      lastP = card.p;\n      var meta = null;\n      (m.paras||[]).forEach(function(x){ if(x.p===card.p) meta=x; });\n      if(meta && meta.label) html += '<div class=\"para-h\"><span class=\"pill\">'+esc(meta.label)+'</span><span class=\"tip\">'+esc(paraTip(card.p))+'</span></div>';\n    }\n    html += cardHTML(c.id, card, st);\n  });\n  $(\"#builder\").innerHTML = html;\n  $(\"#modeDesc\").textContent = m.desc || \"\";\n}\nfunction paraTip(p){\n  if(p===0) return \"标题/称呼：先看收信人或文件类型\";\n  if(p===1) return \"第一段：背景提要 + 来信意图（被动）/ 自我介绍 + 意图（主动）\";\n  if(p===2) return \"第二段：过渡句 + 2~3 个分点（50 个功能句任选，讲清时间地点人物事件）\";\n  if(p===3) return \"第三段：表示情感 + 期待回信（通知/纪要为决定或报名方式）\";\n  if(p===4) return \"落款：右下角，一般 Li Ming\";\n  if(p===5) return \"抬头信息：Date / Time / Location / Objective / Attendees\";\n  return \"\";\n}\nfunction refreshCard(cid){\n  var card = cardById(cid), st = state.cards[cid];\n  var node = document.querySelector('.card[data-cid=\"'+cid+'\"]');\n  if(!card || !st || !node) return;\n  var v = variantOf(card, st);\n  node.classList.toggle(\"off\", !st.on);\n  var s = node.querySelector(\".sent\"); if(s) s.innerHTML = sentenceHTML(card, st, true);\n  var n = node.querySelector(\".note\"); if(n) n.textContent = v.note||\"\";\n  var z = node.querySelector(\".zh-line\"); if(z) z.textContent = v.zh||\"\";\n  var c = node.querySelector(\".count\"); if(c) c.textContent = filledCount(card,st);\n  var tg = node.querySelector('[data-act=\"toggle\"]'); if(tg) tg.textContent = st.on?\"移除\":\"加入\";\n  (card.subs||[]).forEach(function(sd){\n    var sel = node.querySelector('select[data-sub=\"'+sd.key+'\"]');\n    if(sel && sel.parentElement) sel.parentElement.style.display = hasSub( e(\"on\"); }\n    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()===\"z\"){ e.preventDefault(); undo(); }\n  });\n  [\"tZh\",\"tExam\",\"tPolish\",\"tNote\",\"tTag\"].forEach(function(id){\n    $(\"#\"+id).addEventListener(\"change\", function(e){\n      var map = {tZh:\"zh\",tExam:\"exam\",tPolish:\"polish\",tNote:\"note\",tTag:\"tag\"};\n      state.flags[map[id]] = e.target.checked;\n      document.body.classList.toggle(\"exam\", !!state.flags.exam);\n      $$(\".card .note\").forEach(function(n){ n.style.display = state.flags.note ? \"\" : \"none\"; });\n      save();\n      if(id === \"tPolish\"){ renderBuilder(); }\n      renderPreview();\n    });\n  });\n  $(\"#undo\").addEventListener(\"click\", undo);\n  $(\"#clear\").addEventListener(\"click\", function(){\n    pushSnap(); state.slots = {}; save(); renderAll(); toast(\"已清空全部槽位（可撤销）\");\n  });\n  $(\"#copy\").addEventListener(\"click\", copyAll);\n  $(\"#copy2\").addEventListener(\"click\", copyAll);\n  function copyAll(){\n    var rows = collect(), m = modeById(state.mode), txt = \"\";\n    if(!rows.length){ toast(\"还没有内容可复制\"); return; }\n    (m.paras||[]).forEach(function(meta){\n      var rs = rows.filter(function(r){ return r.p === meta.p; });\n      if(!rs.length) return;\n      rs.forEach(function(r){ txt += r.en + \"\\n\"; });\n      if(meta.p === 1) txt += \"\\n\";\n    });\n    txt = txt.replace(/\\n{3,}/g,\"\\n\\n\").trim();\n    var done = function(){ toast(\"已复制全文（\" + countWords(rows) + \" 词）\"); };\n    if(navigator.clipboard && navigator.clipboard.writeText){\n      navigator.clipboard.writeText(txt).then(done, function(){ fallback(txt); done(); });\n    } else { fallback(txt); done(); }\n  }\n  function fallback(txt){\n    var ta = document.createElement(\"textarea\");\n    ta.value = txt; ta.style.position=\"fixed\"; ta.style.opacity=\"0\";\n    document.body.appendChild(ta); ta.select();\n    try{ document.execCommand(\"copy\"); }catch(e){}\n    document.body.removeChild(ta);\n  }\n}\n\n/* ---------- 讲义要点 ---------- */\nvar HELP_HTML = ''\n+ '<div class=\"h-sec\"><h3>一、大纲要点</h3>'\n+ '<p>A 节 1 小题：约 <b>100 词</b>（标点不计），<b>10 分</b>；类型包括<b>书信、通知、告示、纪要</b>等。英一英二大纲无区别，英语二的“提示”分点列出，因此本资料通用。</p>'\n+ '<p>书信按类型可分为表扬、投诉、求职、推荐、建议、辞职、道歉、询问、咨询、回复等；通知=告示（notice），一般是公开宣布一件事或决定；纪要（23 年新增）本质同备忘录，尚未考过。</p></div>'\n+ '<div class=\"h-sec\"><h3>二、应对策略（最重要的一条）</h3>'\n+ '<p>不要为每种信准备模板。所有书信只分两类：<b>被动写信</b>（回复/答复，收件人认识你，无需自我介绍）与<b>主动写信</b>（邀请/投诉/建议/申请，对方不一定认识你，需要自我介绍）——二者只在称呼与第一段是否自我介绍上有区别。</p>'\n+ '<p>以“创新大赛”为例：邀请个人=邀请信，邀请多人=通知告示，选手询问安排=咨询信，提方案=建议信，总结比赛=纪要。<b>核心内容相同：时间、地点、人物、事件；只有一、三段套话不同。</b>所以正确做法是：分类背一、三段，合并学第二段（50 句）。</p></div>'\n+ '<div class=\"h-sec\"><h3>三、格式与字数</h3>'\n+ '<ul><li>书信：称呼（Dear … ,）→ 正文 2~3 段 → 落款（Yours sincerely, / Li Ming），落款在右下角，不写地址。</li>'\n+ '<li>通知/告示：标题 Notice → 正文 → 署名 + 日期（December 20, 2025），一般不加称呼。</li>'\n+ '<li>纪要：标题 Minutes of Meeting → Date / Time / Location / Objective / Attendees → 正文 → Recorded by + 日期。</li>'\n+ '<li>词数约 100（80–120 都可接受）；8 句左右即可成篇，考场上 10 分钟内套完。</li></ul></div>'\n+ '<div class=\"h-sec\"><h3>四、第二段 50 句怎么用</h3>'\n+ '<p>分九组：① 基本信息 ② 主题目的 ③ 参与范围 ④ 流程环节 ⑤ 奖品收获 ⑥ 推荐 ⑦ 能力与要求 ⑧ 感谢道歉 ⑨ 通用型。每组背 1~2 句，考场上挑 2~3 句即可，不必全背。</p>'\n+ '<p>讲义强调：<b>弱化题型区分，强化功能表达</b>。给一句话扣上“只能用于建议信”的帽子，使用范围就会大大受限。</p></div>'\n+ '<div class=\"h-sec\"><h3>五、学习方法</h3>'\n+ '<p>用一天（2 小时）对照视频学完，再用一天复习“灵活运用”，随后立即套真题：每周 2~3 篇，考前一个月每天一篇。真题可反复练，英一英二小作文无需区分，可互相练。</p>'\n+ '<p>练到“10 分钟内套完任意真题”即可；不再做大的变动，只做小的升级，把高频句子固定成自己的模板。</p></div>'\n+ '<div class=\"h-sec\"><h3>六、常见失分点</h3>'\n+ '<p>① 忘写称呼或落款；② 通知写成书信格式（加了 Dear，却没标题）；③ 公务信函忘自我介绍；④ 第二段只堆形容词，没交代时间地点人物事件；'\n+ '<p>⑤ 词数超 150；⑥ 落款写成自己的真名（题干要求 Li Ming / Zhang Wei）。</p></div>';\n\n/* ---------- 启动 ---------- */\nfunction init(){\n  buildModes(); buildPresets();\n  var ok = load();\n  if(!ok){ state = freshState(\"letter_reply\"); applyPreset(\"p22y1\"); snapshots.length = 0; }\n  ensureState(state.mode);\n  syncControls(); renderAll(); bind(); syncOffset();\n  window.addEventListener(\"resize\", syncOffset);\n}\nif(document.readyState === \"loading\") document.addEventListener(\"DOMContentLoaded\", init);\nelse init();\n\nwindow.__XZW__ = {\n  getState:function(){ return state; },\n  setMode:function(id){ switchMode(id); },\n  applyPreset:function(id){ applyPreset(id); },\n  cards:function(){ return allCardIds(modeById(state.mode)); },\n  setSlot:function(id,v){ state.slots[id]=v; save(); renderAll(); },\n  undo:undo,\n  snapCount:function(){ return snapshots.length; }\n};\n})();\n\n<\/script>\n</body>\n</html>\n",
  "smallB": "<!DOCTYPE html>\r\n<html lang=\"zh-CN\">\r\n<head>\r\n<meta charset=\"utf-8\">\r\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\r\n<title>小作文拼装台 · AI归来模板（27版）</title>\r\n<style>\r\n:root{\n  --bg:#0f1115; --panel:#171a21; --panel2:#1d2129; --panel3:#232833;\n  --line:#2a303c; --txt:#e7eaf0; --dim:#95a0b3; --dim2:#6d7889;\n  --acc:#5aa9ff; --acc-d:#22405f; --acc-t:#a9d1ff;\n  --warn:#f0b90b; --warn-d:#3a2f0a;\n  --ok:#3ddc97; --pink:#ff7ba8;\n  --r:10px; --topH:96px;\n}\n*{box-sizing:border-box}\nhtml,body{margin:0;padding:0}\nbody{\n  background:var(--bg); color:var(--txt);\n  font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",\"PingFang SC\",\"Hiragino Sans GB\",\"Microsoft YaHei\",sans-serif;\n  font-size:13.5px; line-height:1.65; -webkit-font-smoothing:antialiased;\n}\nbutton,select,input,textarea{font-family:inherit;font-size:inherit;color:inherit}\n::-webkit-scrollbar{width:10px;height:10px}\n::-webkit-scrollbar-thumb{background:#2b323f;border-radius:6px;border:2px solid var(--bg)}\n::-webkit-scrollbar-track{background:transparent}\n\n/* ---------- 顶栏 ---------- */\n.top{\n  position:sticky; top:0; z-index:60;\n  background:rgba(15,17,21,.92); backdrop-filter:blur(10px);\n  border-bottom:1px solid var(--line);\n  padding:10px 18px 9px;\n}\n.top .r1{display:flex;align-items:center;gap:14px;flex-wrap:wrap}\n.brand{font-weight:700;letter-spacing:.4px;font-size:14.5px;display:flex;align-items:baseline;gap:8px}\n.brand em{font-style:normal;color:var(--dim2);font-weight:400;font-size:11.5px}\n.spacer{flex:1}\n.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}\n.seg button{\n  background:none;border:0;padding:5px 11px;border-radius:6px;cursor:pointer;\n  color:var(--dim);font-size:12.5px;transition:.15s;white-space:nowrap;\n}\n.seg button:hover{color:var(--txt);background:#252b36}\n.seg button.on{background:var(--acc-d);color:var(--acc-t);box-shadow:inset 0 0 0 1px #2f5680}\n.sel{\n  background:var(--panel2);border:1px solid var(--line);border-radius:8px;\n  padding:6px 9px;color:var(--txt);cursor:pointer;max-width:300px;\n}\n.sel:focus{outline:none;border-color:#3c5a7d}\n.btn{\n  background:var(--panel2);border:1px solid var(--line);border-radius:8px;\n  padding:6px 11px;cursor:pointer;color:var(--dim);transition:.15s;white-space:nowrap;\n}\n.btn:hover{color:var(--txt);border-color:#3a4351}\n.btn:disabled{opacity:.38;cursor:not-allowed}\n.btn.pri{background:var(--acc-d);border-color:#2f5680;color:var(--acc-t)}\n.btn.pri:hover{background:#274c73}\n.r2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}\n.tg{\n  display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;\n  background:var(--panel2);border:1px solid var(--line);border-radius:20px;\n  padding:4px 11px 4px 8px;font-size:12px;color:var(--dim);transition:.15s;\n}\n.tg:hover{border-color:#3a4351;color:var(--txt)}\n.tg.on{background:rgba(90,169,255,.12);border-color:#3a5c80;color:var(--acc-t)}\n.tg i{width:8px;height:8px;border-radius:50%;background:#3d4655;display:block;transition:.2s}\n.tg.on i{background:var(--acc);box-shadow:0 0 8px rgba(90,169,255,.65)}\n.hint{font-size:11.5px;color:var(--dim2)}\n.hint b{color:var(--dim);font-weight:600}\n\n/* ---------- 主区 ---------- */\n.cols{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:0;align-items:start}\n.builder{padding:16px 16px 90px 18px;min-width:0}\n.preview{\n  position:sticky;top:var(--topH);height:calc(100vh - var(--topH));\n  border-left:1px solid var(--line);background:#12151a;\n  display:flex;flex-direction:column;min-width:0;\n}\n.pv-head{\n  display:flex;align-items:center;gap:8px;padding:10px 14px;\n  border-bottom:1px solid var(--line);flex-wrap:wrap;\n}\n.pv-head .t{font-weight:600;font-size:12.5px;color:var(--dim)}\n.pv-body{overflow:auto;padding:14px 16px 40px;flex:1}\n.pv-foot{border-top:1px solid var(--line);padding:8px 14px;display:flex;gap:12px;align-items:center;font-size:11.5px;color:var(--dim2);flex-wrap:wrap}\n\n/* 段落标题 */\n.para-h{display:flex;align-items:center;gap:8px;margin:14px 0 7px}\n.para-h:first-child{margin-top:2px}\n.para-h .pill{\n  background:var(--acc-d);color:var(--acc-t);border:1px solid #2f5680;\n  border-radius:20px;padding:1px 10px;font-size:11.5px;font-weight:700;white-space:nowrap;\n}\n.para-h .tip{font-size:11px;color:var(--dim2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n\n/* 卡片 */\n.card{\n  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);\n  padding:9px 12px 11px;margin-bottom:9px;transition:border-color .15s;\n}\n.card:hover{border-color:#333b49}\n.card.off{opacity:.5}\n.card-h{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}\n.card-t{font-size:11.5px;color:var(--acc);font-weight:700;letter-spacing:.3px;white-space:nowrap}\n.card-n{font-size:11px;color:var(--dim2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.mini{\n  background:none;border:1px solid var(--line);border-radius:6px;padding:1px 7px;\n  font-size:11px;color:var(--dim2);cursor:pointer\n}\n.mini:hover{color:var(--pink);border-color:#5a3346}\n.mini.on{color:var(--warn);border-color:var(--warn-d);background:var(--warn-d)}\n.card select.sel{font-size:12px;padding:3px 6px;max-width:100%}\n.ctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 7px}\n.ctl .lab{font-size:11px;color:var(--dim2);display:inline-flex;align-items:center;gap:4px}\n.ctl .lab select{\n  background:var(--panel2);border:1px solid var(--line);border-radius:6px;\n  padding:2px 5px;font-size:11.5px;color:var(--dim);cursor:pointer;\n}\n.sent{\n  font-family:Georgia,\"Times New Roman\",\"Songti SC\",serif;\n  font-size:15px;line-height:1.85;color:#dde3ee;\n}\n.sent .punc{color:var(--dim2)}\n.zh{\n  font-size:12px;color:var(--dim2);margin-top:5px;line-height:1.7;\n  border-left:2px solid #2c3442;padding-left:8px;\n}\n.zh-line{font-size:12px;color:var(--dim2);margin-top:5px;line-height:1.7;border-left:2px solid #2c3442;padding-left:8px}\n.note{font-size:11.5px;color:#8a7b52;margin-top:5px}\n.note b{color:var(--warn);font-weight:600}\n\n/* 槽位 */\n.slot{\n  background:none;border:0;\n  border-bottom:1.5px dashed #5a6478;color:var(--acc-t);\n  padding:0 2px;margin:0 1px;cursor:pointer;border-radius:3px 3px 0 0;\n  transition:.12s;font:inherit;\n}\n.slot:hover{background:rgba(90,169,255,.16)}\n.slot.on{color:var(--acc-t);border-bottom-color:#5a86b8;background:rgba(90,169,255,.07)}\n.slot.empty{color:var(--warn);border-bottom-color:var(--warn);background:rgba(240,185,11,.09)}\n.slot.empty:hover{background:rgba(240,185,11,.2)}\n.slot.act{background:rgba(90,169,255,.28);box-shadow:0 0 0 2px rgba(90,169,255,.28)}\n\n/* 预览 */\n.pv-p{margin-bottom:15px}\n.pv-p h4{\n  margin:0 0 6px;font-size:11px;color:var(--dim2);font-weight:600;\n  letter-spacing:1.2px;\n  display:flex;align-items:center;gap:8px;\n}\n.pv-p h4 .n{color:var(--dim2);font-weight:400;letter-spacing:0;font-size:10.5px;margin-left:6px}\n.pv-en{\n  font-family:Georgia,\"Times New Roman\",\"Songti SC\",serif;\n  font-size:15.5px;line-height:1.95;color:#e9eef7;white-space:pre-wrap;word-break:break-word;\n}\n.pv-en .ph{color:var(--warn)}\n.pv-zh{font-size:12.5px;color:#8b95a7;line-height:1.8;margin-top:6px;white-space:pre-wrap}\n.pv-empty{color:var(--dim2);font-size:12.5px}\n.pv-p .note{margin-top:6px}\n\n/* 槽位面板 */\n.panel{\n  position:fixed;right:22px;bottom:22px;width:430px;max-height:64vh;\n  background:var(--panel3);border:1px solid #3a4352;\n  border-radius:14px;box-shadow:0 18px 60px rgba(0,0,0,.62);\n  display:flex;flex-direction:column;z-index:200;overflow:hidden;\n}\n.panel[hidden]{display:none}\n.pn-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}\n.pn-h .tt{font-weight:700;font-size:13px}\n.pn-h .lab{font-size:11px;color:var(--acc);background:var(--acc-d);padding:1px 7px;border-radius:20px}\n.pn-x{margin-left:auto;background:none;border:0;color:var(--dim2);cursor:pointer;font-size:17px;line-height:1;padding:2px 4px}\n.pn-x:hover{color:var(--pink)}\n.pn-s{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;gap:6px}\n.pn-s input{\n  flex:1;background:var(--bg);border:1px solid var(--line);border-radius:7px;\n  padding:6px 9px;outline:none;min-width:0;\n}\n.pn-s input:focus{border-color:#3c5a7d}\n.pn-list{overflow:auto;padding:6px}\n.op{\n  display:block;width:100%;text-align:left;background:none;border:1px solid transparent;\n  border-radius:8px;padding:6px 9px;cursor:pointer;margin-bottom:2px;\n}\n.op:hover{background:#2a313d;border-color:#3a4352}\n.op.on{background:rgba(90,169,255,.13);border-color:#39557a}\n.op .e{font-family:Georgia,\"Times New Roman\",serif;font-size:13.5px;color:#dfe6f2;line-height:1.5}\n.op .z{font-size:11px;color:var(--dim2);margin-top:1px}\n.op .g{font-size:10.5px;color:#7f8fa6;margin-top:2px}\n.pn-f{padding:7px 12px;border-top:1px solid var(--line);font-size:11px;color:var(--dim2);display:flex;gap:8px;align-items:center}\n.pn-g{padding:7px 9px 3px;font-size:10.5px;color:#6f7d92;letter-spacing:.4px}\n\n/* 讲义要点弹层 */\n.modal{\n  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.98);\n  width:min(860px,92vw);max-height:82vh;background:var(--panel3);\n  border:1px solid #3a4352;border-radius:14px;box-shadow:0 24px 80px rgba(0,0,0,.7);\n  display:none;flex-direction:column;z-index:210;overflow:hidden;\n}\n.modal.on{display:flex}\n.mask{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(2px);display:none;z-index:205}\n.mask.on{display:block}\n.h-sec{padding:10px 16px;border-bottom:1px solid var(--line)}\n.h-sec:last-child{border-bottom:0}\n.h-sec h3{margin:0 0 6px;font-size:12.5px;color:var(--acc)}\n.h-sec p{margin:0 0 6px;font-size:12.5px;color:var(--dim);line-height:1.75}\n.h-sec p:last-child{margin-bottom:0}\n.h-sec b{color:var(--txt);font-weight:600} {en:\"our university\", zh:\"我校（最保险）\", g:\"学校\"},\n    {en:\"Zhejiang University\", zh:\"浙江大学\", g:\"学校\"},\n    {en:\"Peking University\", zh:\"北京大学\", g:\"学校\"},\n    {en:\"a university in Beijing\", zh:\"北京的一所大学\", g:\"学校\"}\n  ],\n\n  /* ---------- 意图：名词（第二段过渡句用） ---------- */\n  intentNoun: [\n    {en:\"suggestion\", zh:\"建议（建议信）\", g:\"意图名词\"},\n    {en:\"advice\", zh:\"意见（建议信，不可数）\", g:\"意图名词\"},\n    {en:\"complaint\", zh:\"投诉（投诉信）\", g:\"意图名词\"},\n    {en:\"invitation\", zh:\"邀请（邀请信）\", g:\"意图名词\"},\n    {en:\"gratitude\", zh:\"感激（感谢信）\", g:\"意图名词\"},\n    {en:\"apology\", zh:\"歉意（道歉信）\", g:\"意图名词\"},\n    {en:\"application\", zh:\"申请（申请信）\", g:\"意图名词\"},\n    {en:\"resignation\", zh:\"辞呈（辞职信）\", g:\"意图名词\"},\n    {en:\"recommendation\", zh:\"推荐（推荐信）\", g:\"意图名词\"},\n    {en:\"request\", zh:\"请求（请求信）\", g:\"意图名词\"},\n    {en:\"inquiry\", zh:\"询问（咨询信）\", g:\"意图名词\"},\n    {en:\"congratulation\", zh:\"祝贺（祝贺信）\", g:\"意图名词\"},\n    {en:\"explanation\", zh:\"解释（答复信）\", g:\"意图名词\"}\n  ],\n\n  /* ---------- 意图：动词短语（第一段“我写信是为了……”） ---------- */\n  intentVerb: [\n    {en:\"express my sincere gratitude for your generous help\", zh:\"感谢你的慷慨帮助\", g:\"感谢\"},\n    {en:\"convey my heartfelt thanks to you\", zh:\"向你表达衷心感谢\", g:\"感谢\"},\n    {en:\"apologize for the inconvenience I have caused\", zh:\"为造成的不便致歉\", g:\"道歉\"},\n    {en:\"express my deep regret for my mistake\", zh:\"为我的过失深表歉意\", g:\"道歉\"},\n    {en:\"make several suggestions about the library service\", zh:\"就图书馆服务提几点建议\", g:\"建议\"},\n    {en:\"offer some advice on how to prepare for the contest\", zh:\"就如何备赛提些建议\", g:\"建议\"},\n    {en:\"recommend a wonderful book to you\", zh:\"向你推荐一本好书\", g:\"推荐\"},\n    {en:\"introduce the art exhibition to you\", zh:\"向你介绍这个艺术展\", g:\"介绍\"},\n    {en:\"provide further details about the plan\", zh:\"提供计划的具体细节\", g:\"介绍\"},\n    {en:\"share my feelings about the video\", zh:\"分享我对视频的感受\", g:\"分享\"},\n    {en:\"invite you to participate in the international innovation contest ,\n    {name:\"NOTICE（全大写）\", text:\"NOTICE\", zh:\"通知（全大写更醒目）\", note:\"与 Notice 等价，按习惯选一个\"}\n  ]\n},\n{\n  id:\"h_min_title\", p:0, no:\"标题\", title:\"Minutes of Meeting\", hint:\"纪要标题\", noDot:true,\n  variants:[\n    {name:\"Minutes of Meeting\", text:\"Minutes of Meeting\", zh:\"会议纪要\", note:\"也可写 Summary of Meeting，二者等价\"},\n    {name:\"Summary of Meeting\", text:\"Summary of Meeting\", zh:\"会议摘要\", note:\"与 Minutes of Meeting 等价\"}\n  ]\n},\n\n/* =========================================================\n   落款（p:4）\n   ========================================================= */\n{\n  id:\"f_close\", p:4, no:\"落款\", title:\"结束语\", hint:\"书信专用，右下角\", noDot:true,\n  variants:[\n    {name:\"Yours sincerely,\", text:\"Yours sincerely,\", zh:\"您诚挚的，\", note:\"最通用；通知/纪要不能用\"},\n    {name:\"Sincerely yours,\", text:\"Sincerely yours,\", zh:\"您诚挚的（变体）\", note:\"与 Yours sincerely 等价\"},\n    {name:\"Yours faithfully,\", text:\"Yours faithfully,\", zh:\"您忠实的，\", note:\"写给 Dear Sir or Madam 时更规范（不知姓名）\"}\n  ]\n},\n{\n  id:\"f_sign\", p:4, no:\"署名\", title:\"署名\", hint:\"考场上固定写 Li Ming\", noDot:true,\n  variants:[\n    {name:\"Li Ming（英一默认）\", text:\"{sign}\", zh:\"【署名】\", note:\"英一题干几乎都指定 Li Ming；不要签真名\"},\n    {name:\"不写署名（仅预览）\", text:\"\", zh:\"（不写署名）\", note:\"正式考试必须署名，此项仅用于对比\"}\n  ]\n},\n{\n  id:\"f_notice_sign\", p:4, no:\"署名\", title:\"署名（机构）\", hint:\"通知落款写机构，不写个人\", noDot:true,\n  variants:[\n    {name:\"机构署名\", text:\"{orgSign}\", zh:\"【机构署名】\", note:\"通知一般以组织名义发出：the Student Union\"},\n    {name:\"个人署名 Li Ming\", text:\"{sign}\", zh:\"【署名】\", note:\"若题干要求个人名义发布，则写 Li Ming\"}\n  ]\n},\n{\n  id:\"f_min_recorder\", p:4, no:\"落款\", title:\"记录人\", hint:\"Recorded by + 署名\", noDot:true,\n  variants:[\n    {name:\"Recorded by: Li Ming\", text:\"Recorded by: {sign}\", zh:\"记录人：【署名】\", note:\"纪要末尾写明记录人\"},\n    {name:\"不写记录人\", text:\"\", zh:\"（不写记录人）\", note:\"格式不完整，仅用于对比\"}\n  ]\n}\n];\n\n/* ==== data_cards_p1.js ==== */\n/* ================= 句型卡片 · 第一段 ================= */\r\nCARDS.push(\r\n\r\n/* ---------- 答复信（被动）· 积极 ---------- */\r\n{\r\n  id:\"p1_pos\", p:1, no:\"1.1\", title:\"背景提要\", hint:\"答复信·积极：对方来信是赞美 / 分享 / 询问\",\r\n  variants:[\r\n    {name:\"01 谢谢你来信 · 很高兴得知\", text:\"Thanks for your email. I am very glad to hear that {news}.\", zh:\"谢谢你的来信。很高兴得知【来信内容】。\", note:\"讲义原句（2025英一/英二、2026英一）。news 摘抄或改编自题干\"},\r\n    {name:\"02 谢谢你来信 · so pleased\", text:\"Thanks for your email. I am so pleased to hear that {news}.\", zh:\"谢谢你的来信。非常高兴得知【来信内容】。\", note:\"glad 的同义替换，语气更热络\"},\r\n    {name:\"03 谢谢你分享 · 我真的很喜欢\", text:\"Thank you for sharing {shareItem} with me. I truly enjoyed it.\", zh:\"感谢你与我分享【分享物】，我真的很喜欢。\", note:\"对方分享的是视频/照片/文章时用（2026英二原句）\"},\r\n    {name:\"04 谢谢你分享 · 加一句拉长\", text:\"Thank you for sharing {shareItem} with me. I truly enjoyed it—{whyStretch}.\", zh:\"感谢你与我分享【分享物】，我真的很喜欢——【拉长补充】。\", note:\"字数不够时用破折号补一句，讲义给的三种拉长说法都在词库里\"},\r\n    {name:\"05 很高兴收到你关于…的来信\", text:\"I was delighted to receive your email about {shareItem}.\", zh:\"很高兴收到你关于【分享物】的来信。\", note:\"比 thanks for your email 更正式一点\"},\r\n    {name:\"06 展信佳 · 顺带接题干\", text:\"I hope this letter finds you well and {clauseWell}.\", zh:\"展信佳，【接题干的一句】。\", note:\"2023英二原句：…and it is difficult to decide between the two shows。无法改写就用 07/08 的纯寒暄\"},\r\n    {name:\"07 收到来信深感愉快\", text:\"It was a great pleasure to receive your email.\", zh:\"收到你的来信，我深感愉快。\", note:\"通用寒暄，题干信息不够时的安全牌\"},\r\n    {name:\"08 能给你写信倍感荣幸\", text:\"It gives me great pleasure to write to you.\", zh:\"能给你写这封信，我倍感荣幸。\", note:\"通用寒暄，适合正式一点的场合\"},\r\n    {name:\"09 致以最诚挚的问候\", text:\"Allow me to extend my warmest greetings to you.\", zh:\"请允许我向你致以最诚挚的问候。\", note:\"最正式的寒暄，适合写给教授/机构\"}\r\n  ]\r\n},\r\n\r\n/* ---------- 答复信（被动）· 消极 ---------- */\r\n{\r\n  id:\"p1_neg\", p:1, no:\"1.1\", title:\"背景提要\", hint:\"答复信·消极：对方投诉 / 坏消息 / 我的过错\",\r\n  variants:[\r\n    {name:\"01 很抱歉得知\", text:\"I am sorry to hear that {badNews}.\", zh:\"很抱歉得知【坏消息】。\", note:\"对方来信是坏消息时用\"},\r\n    {name:\"02 我必须为…道歉\", text:\"I must apologize for {fault}.\", zh:\"我必须为【我的过失】道歉。\", note:\"自己的过错（忘还CD、改期、回复迟）\"},\r\n    {name:\"03 我理解你对…的担忧\", text:\"I understand your concern about {concern}.\", zh:\"我理解你对【对方关切】的担忧。\", note:\"先共情再解释，投诉类答复信首选\"},\r\n    {name:\"04 表达我的不满（主动投诉）\", text:\"I want to express my {emotion} through this letter regarding {topicWord}.\", zh:\"我想通过这封信表达我对【事由】的【心情】。\", note:\"讲义原句；主动投诉时把 emotion 选 disappointment，答复投诉时选 apology\"},\r\n    {name:\"05 为我的过失深表遗憾\", text:\"I am writing to express my deep regret for {fault}.\", zh:\"我写信是为【我的过失】深表歉意。\", note:\"比 02 更书面\"},\r\n    {name:\"06 展信佳 · 先寒暄再转入\", text:\"I hope this letter finds you well. I am writing to express my {emotion} regarding {topicWord}.\", zh:\"展信佳。我写信是想就【事由】表达我的【心情】。\", note:\"不想一上来就说坏消息时用\"}\r\n  ]\r\n},\r\n\r\n/* ---------- 主动写信 · 自我介绍 ---------- */\r\n{\r\n  id:\"p1_self\", p:1, no:\"1.1\", title:\"自我介绍\", hint:\"公务信函必写，不可省略\",\r\n  variants:[\r\n    {name:\"01 我是…系的学生\", text:\"I am a student from {dept} at {university}.\", zh:\"我是【学校】【院系】的学生。\", note:\"讲义原句（2022英一：a student from the department of Art at a university）\"},\r\n    {name:\"02 我是本科生 · 专业是…\", text:\"I am an undergraduate at a university, majoring in {major}.\", zh:\"我是一名本科生，专业是【专业】。\", note:\"题干没给身份时默认学生\"},\r\n    {name:\"03 我正在攻读…学位\", text:\"I am currently pursuing a degree in {major} at a university.\", zh:\"我目前在一所大学攻读【专业】学位。\", note:\"比 02 更正式\"},\r\n    {name:\"04 作为…（融入开头，自带目的）\", text:\"As {roleIdentity}, I am writing to {intentVerb}.\", zh:\"作为【身份】，我写信是想【写信目的】。\", note:\"与下一张「来信意图」卡重复，选此项时请把意图卡关掉\"},\r\n    {name:\"05 我是…的成员\", text:\"I am {roleIdentity} at {university}.\", zh:\"我是【学校】的【身份】。\", note:\"身份是学生会成员/社长/志愿者时用\"}\r\n  ]\r\n},\r\n\r\n/* ---------- 来信意图 ---------- */\r\n{\r\n  id:\"p1_intent\", p:1, no:\"1.2\", title:\"来信意图\", hint:\"我写这封信是为了……（所有信共用，只换动词）\",\r\n  variants:[\r\n    {name:\"01 I am writing to…\", text:\"I am writing to {intentVerb}.\", zh:\"我写信是想【写信目的】。\", note:\"最通用；intentVerb 词库按信的类型分组（感谢/道歉/建议/邀请/
