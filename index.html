<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0f1115">
<title>AI归来 · 大作文 / 小作文 模板（四版 · 双主题）</title>
<style>
/* ===== 外层：四版导航 + 深浅色（版式二 的视觉语言） ===== */
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1d2129; --line:#2a303c;
  --txt:#e7eaf0; --dim:#95a0b3; --dim2:#6d7889;
  --acc:#5aa9ff; --acc-d:#22405f; --acc-t:#a9d1ff;
  --bh:54px;
}
html[data-theme="light"]{
  --bg:#fbf9f5; --panel:#ffffff; --panel2:#fcfbf8; --line:#e3ddd2;
  --txt:#1b2a41; --dim:#6b7a8d; --dim2:#8a97a6;
  --acc:#1668b8; --acc-d:#e8f1fb; --acc-t:#0f4c81;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);
  font:13.5px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden}

.sbar{position:fixed;top:0;left:0;right:0;height:var(--bh);z-index:20;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  background:var(--panel);border-bottom:1px solid var(--line)}
.sbar-in{max-width:1600px;height:100%;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:14px}
.slogo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;letter-spacing:.3px;white-space:nowrap}
.slogo i{width:9px;height:9px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 18%,transparent);display:inline-block}
.stabs{display:flex;gap:4px;background:var(--panel2);border-radius:999px;padding:4px;overflow:auto;scrollbar-width:none}
.stabs::-webkit-scrollbar{display:none}
.stabs button{border:none;background:transparent;color:var(--dim);font:inherit;font-size:12.5px;
  padding:5px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:.15s}
.stabs button:hover{color:var(--txt)}
.stabs button.on{background:var(--acc-d);color:var(--acc-t);font-weight:600}
.sspacer{flex:1}
.sbtn{border:1px solid var(--line);background:var(--panel2);color:var(--txt);
  border-radius:999px;padding:6px 13px;font:inherit;font-size:12.5px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sbtn:hover{border-color:var(--acc);color:var(--acc)}
.sbtn .ico{font-size:13px;line-height:1}

.swrap{position:fixed;top:var(--bh);left:0;right:0;bottom:0}
.swrap iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}

/* 窄屏：品牌字收起，标签可横滑 */
@media (max-width:760px){
  .sbar-in{gap:8px;padding:0 10px}
  .slogo{font-size:0;gap:0}
  .slogo i{width:10px;height:10px}
  .stabs button{padding:5px 10px;font-size:12px}
  .sbtn .txt{display:none}
}

.sthemes{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.sthemes button{border:0;background:transparent;color:var(--dim);font:inherit;font-size:12px;
  padding:4px 11px;border-radius:999px;cursor:pointer;transition:.15s;white-space:nowrap}
.sthemes button:hover{color:var(--txt)}
.sthemes button.on{background:var(--acc-d);color:var(--acc-t);font-weight:600}


</style>
</head>
<body>

<header class="sbar">
  <div class="sbar-in">
    <span class="slogo"><i></i>AI归来 · 模板</span>
    <nav class="stabs" id="stabs">
      <button data-page="bigA">大作文 · 版式一</button>
      <button data-page="bigB">大作文 · 版式二</button>
      <button data-page="smallA">小作文 · 版式一</button>
      <button data-page="smallB">小作文 · 版式二</button>
    </nav>
    <span class="sspacer"></span>
    <div class="sthemes" id="themeSeg" title="切换深色 / 浅色（快捷键 T）">
      <button data-theme="dark" class="on">☾ 深色</button>
      <button data-theme="light">☀ 浅色</button>
    </div>
  </div>
</header>

<main class="swrap">
  <iframe id="fr" title="作文模板"></iframe>
</main>

<script>
var HP = {
  "bigA": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>考研英语大作文 · 逐句拼装模板（AI归来 27版）</title>\n<style>\n\n/* ===== 大作文模板 · 单文件交互版 ===== */\n*{box-sizing:border-box}\nhtml,body{margin:0;padding:0}\n:root{\n  --ink:#1b2a41; --ink2:#33475f; --paper:#fbf9f5; --line:#e3ddd2;\n  --accent:#0f6b5c; --accent2:#128a76; --gold:#b7791f; --red:#b4342b;\n  --slot:#eef6f4; --slotb:#9ccdc2; --filled:#e7f3ef;\n  --shadow:0 1px 2px rgba(27,42,65,.06),0 8px 24px rgba(27,42,65,.08);\n  --mono:\"Cascadia Mono\",Consolas,monospace;\n  --serif:Georgia,\"Times New Roman\",serif;\n}\nbody{\n  font:14px/1.65 -apple-system,\"Segoe UI\",\"PingFang SC\",\"Microsoft YaHei\",sans-serif;\n  color:var(--ink); background:\n    radial-gradient(1200px 600px at 10% -10%,#f2efe6 0%,transparent 60%),\n    radial-gradient(900px 500px at 100% 0%,#eaf2ef 0%,transparent 55%),\n    var(--paper);\n  -webkit-font-smoothing:antialiased;\n}\n/* ---------- 顶栏 ---------- */\n.top{position:sticky;top:0;z-index:40;background:rgba(251,249,245,.92);\n  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}\n.top-in{max-width:1480px;margin:0 auto;padding:10px 18px 8px}\n.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}\n.brand h1{font-size:16px;margin:0;letter-spacing:.4px}\n.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(15,107,92,.12)}\n.brand .sub{font-size:12px;color:#6b7a8d;letter-spacing:.2px}\n.brand .spacer{flex:1}\n.modes{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}\n.mode-btn{border:1px solid var(--line);background:#fff;color:var(--ink2);\n  padding:5px 11px;border-radius:999px;font-size:12.5px;cursor:pointer;\n  display:inline-flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap}\n.mode-btn:hover{border-color:var(--accent);color:var(--accent)}\n.mode-btn .tag{font-size:10px;color:#8a97a6;border:1px solid var(--line);border-radius:4px;padding:0 4px}\n.mode-btn.on{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 4px 12px rgba(27,42,65,.22)}\n.mode-btn.on .tag{color:#c9d4e0;border-color:#4a5b70}\n.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px;\n  font-size:12.5px;color:var(--ink2)}\n.tb-group{display:flex;align-items:center;gap:6px}\n.tb-group>label{color:#7b8794;font-size:12px}\nselect,input[type=text],input[type=search]{\n  font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);\n  border-radius:7px;padding:5px 8px;outline:none}\nselect:focus,input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(18,138,118,.12)}\n.btn{border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:7px;\n  padding:5px 10px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}\n.btn:hover{border-color:var(--accent);color:var(--accent)}\n.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}\n.btn.primary:hover{background:var(--accent2);color:#fff}\n.btn:disabled{opacity:.42;cursor:not-allowed}\n.switch{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;\n  border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px 4px 6px}\n.switch input{display:none}\n.switch i{width:14px;height:14px;border-radius:50%;background:#cbd3dd;position:relative;transition:.18s;display:inline-block}\n.switch input:checked+i{background:var(--accent2);box-shadow:inset 0 0 0 3px #fff}\n.switch span{font-size:12px}\n.switch input:checked~span{color:var(--accent)}\n/* ---------- 布局 ---------- */\n.layout{max-width:1480px;margin:0 auto;padding:16px 18px 80px;\n  display:grid;grid-template-columns:minmax(0,1.15fr) minmax(360px,.85fr);gap:18px;align-items:start}\n@media (max-width:1080px){.layout{grid-template-columns:1fr}}\n.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}\n.panel-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);\n  background:#fff;border-radius:14px 14px 0 0;z-index:12}\n.panel-h h2{margin:0;font-size:13.5px;letter-spacing:.5px}\n.panel-h .meta{font-size:12px;color:#7b8794}\n.panel-h .spacer{flex:1}\n/* ---------- 建造区 ---------- */\n.builder{padding:6px 0 14px}\n.para-h{display:flex;align-items:center;gap:8px;padding:12px 16px 4px}\n.para-h .pill{font-size:11.5px;background:var(--ink);color:#fff;border-radius:999px;padding:2px 9px;letter-spacing:.5px}\n.para-h .tip{font-size:12px;color:#7b8794}\n.card{margin:10px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;\n  transition:.15s;overflow:hidden}\n.card:hover{border-color:#cfd8e3}\n.card.off{opacity:.5}\n.card-h{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#fcfbf8;border-bottom:1px solid transparent;cursor:default}\n.card.open .card-h{border-bottom-color:var(--line)}\n.card-h .no{width:22px;height:22px;border-radius:7px;background:var(--ink);color:#fff;font-size:11.5px;\n  display:grid;place-items:center;flex:none;font-family:var(--mono)}\n.card-h .ttl{font-size:13px;font-weight:600;letter-spacing:.3px}\n.card-h .hint{font-size:11.5px;color:#8a97a6;font-weight:400}\n.card-h .spacer{flex:1}\n.card-h .count{font-size:11px;color:#8a97a6;font-family:var(--mono)}\n.mini{border:1px solid var(--line);background:#fff;border-radius:6px;font-size:11.5px;\n  color:#6b7a8d;padding:2px 7px;cursor:pointer}\n.mini:hover{color:var(--accent);border-color:var(--accent)}\n.card-b{padding:10px 12px 12px}\n.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}\n.ctl select{font-size:12.5px;max-width:100%}\n.ctl .lab{font-size:11.5px;color:#7b8794}\n.sent{font-family:var(--serif);font-size:16.5px;line-height:1.95;color:#1c2836;\n  background:#fffdf8;border:1px dashed #e6dfd2;border-radius:9px;padding:10px 12px;word-break:break-word}\n.slot{font-family:-apple-system,\"PingFang SC\",\"Microsoft YaHei\",sans-serif;font-size:12.5px;\n  border-radius:6px;padding:1px 6px;margin:0 1px;cursor:pointer;border:1px dashed var(--slotb);\n  background:var(--slot);color:#2a6b60;transition:.12s;display:inline;white-space:normal}\n.slot:hover{background:#dcefe9;border-color:var(--accent2)}\n.slot.empty{color:#8b6d3a;border-color:#d8c294;background:#fdf6e6}\n.slot.empty:hover{background:#fbeecf}\n.slot.on{background:var(--filled);border-style:solid;border-color:#8bc7b8;color:#0f5a4d;font-weight:600}\n.note{font-size:12px;color:#7b8794;margin-top:8px;line-height:1.6;border-left:2px solid #e6dfd2;padding-left:8px}\n.zh-line{font-size:12.5px;color:#6b7a8d;margin-top:6px;line-height:1.6}\n/* ---------- 预览 ---------- */\n.preview{position:sticky;top:calc(var(--topH,120px) + 12px);max-height:calc(100vh - var(--topH,120px) - 28px);\n  display:flex;flex-direction:column}\n@media (max-width:1080px){.preview{position:static;max-height:none}}\n.preview .panel-b{overflow:auto;padding:4px 0 10px}\n.paper{padding:14px 16px 6px}\n.para{margin-bottom:6px;padding-bottom:10px;border-bottom:1px dashed #ece6da}\n.para:last-child{border-bottom:none}\n.para-t{font-size:11px;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase;margin-bottom:4px;\n  display:flex;align-items:center;gap:8px}\n.para-t .spacer{flex:1}\n.para-t .wc{color:#9aa5b1;letter-spacing:0;text-transform:none;font-size:11px}\n.en{font-family:var(--serif);font-size:16px;line-height:1.9;color:#16202c;text-align:justify;white-space:pre-wrap}\n.en .ph{color:#b4342b;background:#fbeeec;border-radius:4px;padding:0 4px;font-size:12.5px;\n  font-family:-apple-system,\"PingFang SC\",sans-serif}\n.zh{font-size:12.5px;color:#7b8794;line-height:1.7;margin-top:5px;padding-left:2px}\n.zh .ph{color:#b4342b}\n.empty-tip{color:#a6b0bb;font-size:13px;padding:20px 6px;text-align:center}\n.tagline{font-size:11px;color:#9aa5b1;padding:0 16px 10px}\n/* ---------- 槽位面板 ---------- */\n.mask{position:fixed;inset:0;background:rgba(20,28,40,.28);z-index:60;display:none}\n.mask.on{display:block}\n.pop{position:fixed;z-index:70;width:420px;max-width:calc(100vw - 24px);max-height:min(70vh,560px);\n  background:#fff;border:1px solid #d8e0ea;border-radius:14px;box-shadow:0 20px 50px rgba(20,28,40,.24);\n  display:none;flex-direction:column;overflow:hidden}\n.pop.on{display:flex}\n.pop.wide{width:680px;max-height:min(82vh,660px);left:50%!important;top:50%!important;transform:translate(-50%,-50%)}\n.h-sec{padding:10px 14px;border-bottom:1px dashed #ece6da}\n.h-sec:last-child{border-bottom:none}\n.h-sec h3{margin:0 0 6px;font-size:13px;color:var(--ink);letter-spacing:.5px}\n.h-sec p,.h-sec li{font-size:12.5px;color:#5c6b7a;line-height:1.75;margin:3px 0}\n.h-sec ul{margin:4px 0;padding-left:18px}\n.h-sec table{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}\n.h-sec th,.h-sec td{border:1px solid #ece6da;padding:3px 6px;text-align:center;color:#5c6b7a}\n.h-sec th{background:#faf8f3;color:var(--ink2)}\n.h-sec b{color:var(--accent)}\n.pop-h{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}\n.pop-h .t{font-size:13px;font-weight:600}\n.pop-h .l{font-size:11.5px;color:#8a97a6}\n.pop-h .x{margin-left:auto;border:none;background:transparent;font-size:18px;color:#9aa5b1;cursor:pointer;line-height:1}\n.pop-in{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;gap:6px}\n.pop-in input{flex:1;font-size:13px}\n.pop-list{overflow:auto;padding:6px 6px 10px}\n.pop-g{font-size:11px;color:var(--gold);letter-spacing:1px;padding:8px 8px 3px}\n.opt{display:block;width:100%;text-align:left;border:1px solid transparent;background:transparent;\n  border-radius:8px;padding:6px 8px;cursor:pointer;font-size:13px}\n.opt:hover{background:#f2f8f6;border-color:#d5e9e3}\n.opt.sel{background:#e7f3ef;border-color:#8bc7b8}\n.opt .e{font-family:var(--serif);font-size:14.5px;color:#16202c;display:block}\n.opt .z{font-size:11.5px;color:#7b8794;display:block;margin \",\n     text:\"The {chart} above illustrates the changes in {topic} from {year1} to {year2}, during which it {trendV}.\",\n     zh:\"上方图表展示了年份至年份间主题词的变化，其在这一时期稳步上升。\",\n     note:\"最通用骨架：主句 + during which 从句。任何动态图都能套，优先背这一句。\"},\n    {name:\"待选2 · 趋势作宾语\",\n     text:\"{topic} saw a {trendN} from {year1} to {year2}, as illustrated in the {chart}.\",\n     zh:\"如该图表所示，主题词在年份至年份间稳步上升。\",\n     note:\"主题词须为实体（快递业/城市/国家/品牌）。若主题词是数据（水平/率/比例/数量），改用待选 2b。\"},\n    {name:\"待选2b · 时间作主语\",\n     text:\"The period from {year1} to {year2} saw a {trendN} in {topic}, as illustrated in the {chart}.\",\n     zh:\"年份至年份这一时期见证了主题词的稳步上升。\",\n     note:\"讲义注：主题词是抽象数据时，改由时间作主语，避免 The level saw a rise 这类别扭表达。\"},\n    {name:\"待选3 · 状语式\",\n     text:\"According to the data given in the {chart}, the {metric} of {topic} {trendV} from {year1} to {year2}.\",\n     zh:\"根据图中数据，主题词的（数量/比例/水平）在年份至年份间稳步攀升。\",\n     note:\"the number of 视情况换为 the level/rate/proportion of；状语前置最像外刊笔法。\"}\n  ]\n},\n{\n  id:\"dynn_s1\", p:1, no:\"1\", title:\"总体描述\", hint:\"动态·多方向\",\n  variants:[\n    {name:\"待选1 · Among which 从句\",\n     text:\"The {chart} above illustrates the changes in {topic} from {year1} to {year2}, among which the rise in {itemTop} was the most striking.\",\n     zh:\"上方图表展示了年份至年份间主题词的变化，其中单项的上升最为显著。\",\n     note:\"多变量、走向不一时首选；只点出最醒目的那一支。\"},\n    {name:\"待选2 · Divergent + with\",\n     text:\"{topic} experienced divergent trends from {year1} to {year2}, with {itemTop} rising most sharply.\",\n     zh:\"主题词在年份至年份间经历了分化性的趋势，其中……上升最为剧烈。\",\n     note:\"divergent trends 概括“走向不一”；with + 宾语 + 现在分词作伴随。\"},\n    {name:\"待选3 · 状语式 + 对比\",\n     text:\"As reflected in the {chart}, {topic} moved in opposite directions from {year1} to {year2}, {item1} rising while {item2} falling.\",\n     zh:\"如图中数据所示，主题词朝不同方向变化，……上升而……下降。\",\n     note:\"moved in opposite directions 可换为 diverged。三个变量只写对比最鲜明的两个，第三个留给细节句。\"},\n    {name:\"待选4 · 单方向多变量\",\n     text:\"The {chart} above illustrates the changes in {topic} and {topicB} from {year1} to {year2}, during which both of them {trendV}.\",\n     zh:\"上方图表展示了……与……两者在年份至年份间的变化，期间二者同步上升。\",\n     note:\"讲义注：多个变量走向相同时，把动态·单方向待选句的主题词加 and 即可。\"}\n  ]\n},\n{\n  id:\"stat_s1\", p:1, no:\"1\", title:\"总体描述\", hint:\"静态图（占比/格局）\",\n  variants:[\n    {name:\"待选1 · Distribution + with\",\n     text:\"The {chart} above presents the distribution of {topic} in {year1}, with {item1} accounting for the largest share.\",\n     zh:\"上方图表呈现了年份主题词的分布，其中……占比最高。\",\n     note:\"3D 之一 distribution 分布；静态图无年份趋势，用 in 年份而不是 from…to…\"},\n    {name:\"待选2 · Dominance + with\",\n     text:\"The {chart} above highlights the dominance of {item1} in {topic}, with it overshadowing all other components.\",\n     zh:\"上方图表突出了……在主题词中的主导地位，其远超其他各项。\",\n     note:\"3D 之一 dominance 主导。仅当第一项远高于其他项（断崖式领先）时使用，否则夸张失真。\"},\n    {name:\"待选3 · Disparity + with\",\n     text:\"The {chart} above reveals a striking disparity in {topic}, with the proportions ranging from {minV} to {maxV}.\",\n     zh:\"上方图表揭示了主题词中显著的差距，各项占比从最低值到最高值不等。\",\n     note:\"3D 之一 disparity 差距。with + 宾语 + 宾补（现在分词/介词短语），最适合“多项差距大”的表。\"}\n  ]\n},\n{\n  id:\"dual_s1\", p:1, no:\"1\", title:\"总体描述\", hint:\"双图表（静静/动静/动动）\",\n  variants:[\n    {name:\"待选1 · While 并列\",\n     text:\"The {chartL} on the left illustrates {topicL}, while the {chartR} on the right presents {topicR}.\",\n     zh:\"左侧的图展示了……，而右侧的图呈现了……。\",\n     note:\"双图表首选：一句话交代两幅图，while 天然表对比。\"},\n    {name:\"待选2 · As for 另起一句\",\n     text:\"The {chartL} above presents {topicL}. As for the {chartR} on the right, it lists {topicR}.\",\n     zh:\"上面的图呈现了……。至于右侧的图，它展示了……。\",\n     note:\"两幅图内容差异大、分句更清楚时用；注意第二句首字母大写。\"},\n    {name:\"待选3 · 总分结构\",\n     text:\"The two charts present {topic}: the {chartL} shows {topicL}, while the {chartR} on the right lists {topicR}.\",\n     zh:\"两幅图呈现了……：左图显示了……，而右侧的图列出了……。\",\n     note:\"先总后分，最像高分范文；冒号后两个分句要平行。\"}\n  ]\n},\n{\n  id:\"any_s1\", p:1, no:\"1\", title:\"总体描述\", hint:\"万能场景（没把握/看不懂/时间紧）\",\n  variants:[\n    {name:\"待选1 · 有变化 ①\",\n     text:\"Some remarkable changes in {topic} have taken place in the past few years.\",\n     zh:\"在过去的几年中，主题词发生了一些显著的变化。\",\n     note:\"万能场景 1-3 用于“有变化”，无需精确读图。\"},\n    {name:\"待选2 · 有变化 ②\",\n     text:\"The {chart} above shows the variation in {topic} from {year1} to {year2}.\",\n     zh:\"上述图表展示了年份至年份间主题词的变化。\",\n     note:\"万能场景 1-3 用于“有变化”。\"},\n    {name:\"待选3 · 有变化 ③\",\n     text:\"The {metric} of {topic} had visible changes during the period from {year1} to {year2}.\",\n     zh:\"主题词的占比/份额/数量在年份至年份间发生明显变化。\",\n     note:\"万能场景 1-3 用于“有变化”；抽象、安全、不跑题。\"},\n    {name:\"待选4 · 有占比 ①\",\n     text:\"The {chart} shows the distribution of {topic} at a glance, revealing a striking disparity among the options.\",\n     zh:\"该图一目了然地展示了主题词的分布，揭示了各项之间的巨大差异。\",\n     note:\"万能场景 4-6 用于“有占比/分布”。\"},\n    {name:\"待选5 · 有占比 ②\",\n     text:\"The {chart} above presents {topic}, offering a clear picture of the overall situation.\",\n     zh:\"上方图表呈现了主题词，清晰地展示了整体情况。\",\n     note:\"万能场景 4-6 用于“有占比/分布”。\"},\n    {name:\"待选6 · 有占比 ③\",\n     text:\"The {chart} above provides information about {topic} from {year1} to {year2}.\",\n     zh:\"上述图表提供了年份至年份间关于主题词的信息。\",\n     note:\"25 英一表格可用；也可写 the situation of …。\"}\n  ]\n},\n\n/* =========================================================\n   第一段 · 图表：细节描述\n   ========================================================= */\n{\n  id:\"chart_s2\", p:1, no:\"2\", title:\"细节描述\", hint:\"动态图公式 1 / 2 / 3\",\n  variants:[\n    {name:\"公式1 · 双变量对比\",\n     text:\"To be specific, the {metric} of {item1} {verb1} {speed1} from {num1} to {num2}. Meanwhile, the {metric} of {item2} {verb2} {speed2} from {num3} to {num4} during the same period.\",\n     zh:\"具体而言，……的占比从……上升至……。与此同时，……的占比从……下降至……。\",\n     note:\"最常用的动态细节句。三个数据用三种动词和副词（decreased remarkably / climbed significantly / rose slightly）避免句式单调；during the same period 视篇幅可省。\"},\n    {name:\"公式1b · 三变量对比\",\n     text:\"To be specific, the {metric} of {item1} {verb1} {speed1} from {num1} to {num2}. However, the {metric} of {item2} {verb2} {speed2} from {num3} to {num4}. Meanwhile, the {metric} of {item3} {verb3} {speed3} from {num5} to {num6}.\",\n     zh:\"具体而言，……从……降至……。然而，……从……显著攀升至……。与此同时，……从……小幅升至……。\",\n     note:\"2019 英二三变量写法：However 表反向、Meanwhile 表并行，第三个变量常为小幅变化。\"},\n    {name:\"公式2 · 首尾对比+增量\",\n     text:\"To be specific, the {metric} of {item1} was {num1} in {year1}, compared with {num2} in {year2}, showing an increase of {num3} {unit}.\",\n     zh:\"年份主题词的……为……，而年份为……，增长了……。\",\n     note:\"句式短、数据感强；增量务必带单位（percentage points / units），这是阅卷人眼里的“会写数据”。\"},\n    {name:\"公式3 · 倍数关系\",\n     text:\"To be specific, the {metric} of {item1} in {year2} was {multiple} that in {year1}.\",\n     zh:\"年份的……是年份的……倍。\",\n     note:\"2 倍 twice、3 倍 triple、以上 four times；倍数表达三选一：twice that in / twice as high as that in / twice the {year1} figure。\"},\n    {name:\"公式3b · 同年跨变量\",\n     text:\"To be specific, the {metric} of {item1} was about {multiple} that of {item2} in {year2}.\",\n     zh:\"年份……的比例约为……的……倍。\",\n     note:\"公式 3 稍作改变：同一变量不同年份 → 公式 3；不同变量同一年份 → 本句。\"},\n    {name:\"分段描述 · 折线图\",\n     text:\"To be specific, the {metric} of {item1} increased gradually from {num1} in {year1} to {num2} in {year3}. In the next {nYears} years, it climbed remarkably, from {num2} to {num3}.\",\n     zh:\"……从年份的……逐渐增长到年份的……。在接下来的……年中，它显著攀升，从……升至……。\",\n     note:\"2023 英二两段式折线写法：先慢后快，用两组动词副词区分速度。\"},\n    {name:\"峰值/谷值 · 极值句\",\n     text:\"To be specific, the {metric} of {item1} {peakV} in {year1}, before falling to {num1} in {year2}.\",\n     zh:\"具体而言，……在年份达到峰值，随后在年份回落至……。\",\n     note:\"峰值 peak at / reach a peak of / hit a record high / reach an all-time high；谷值 bottom out at / hit a trough / fall to a low。适合“先冲高后回落”的曲线。\"},\n    {name:\"约数描写 · just over\",\n     text:\"To be specific, the {metric} of {item1} stood at {approxV} {num1} in {year1}.\",\n     zh:\"具体而言，……在年份处于……（约）的水平。\",\n     note:\"约数与修饰：approximately / roughly / nearly / just over / just under。数据读不准时用它，比硬写精确数字安全。\"},\n    {name:\"对比衔接 · whereas/while\",\n     text:\"To be specific, the {metric} of {item1} {verb1} {speed1} from {num1} to {num2}, {link} the {metric} of {item2} {verb2} {speed2} from {num3} to {num4}.\",\n     zh:\"具体而言，……从……变化到……，而……从……变化到……。\",\n     note:\"对比衔接词：whereas / while / in contrast / by contrast / meanwhile / on the contrary。一句话写完两条线，比分两句更紧凑。\"},\n    {name:\"持平/波动 · 组合矩阵\",\n     text:\"To be specific, the {metric} of {item1} remained largely stable at {num1} between {year1} and {year2}.\",\n     zh:\"该比例在年份至年份间基本持平于……。\",\n     note:\"动态四方向（增/减/持/波）× 快慢两档 = 8 组合：把 remained largely stable 换为 fluctuated between A and B 即“波动”。\"}\n  ]\n},\n{\n  id:\"stat_s2\", p:1, no:\"2\", title:\"细节描述\", hint:\"静态图公式（占比并列）\",\n  variants:[\n    {name:\"公式1 · 占比并列+排名\",\n     text:\"To be specific, the {metric} of {item1}, {item2}, {item3} and {item4} account for {num1}, {num2}, {num3} and {num4} respectively. Notably, {item1} tops the list, at {num1}, followed by {item2} at {num2}.\",\n     zh:\"……的比例分别为……。值得注意的是，……居首位，占……；其次是……，占……。\",\n     note:\"主语是 percentages/proportions，谓语动词用复数 account；A, B, C and D 并列也用复数。排名写两项即可，否则篇幅过大、头重脚轻。\"},\n    {name:\"公式1简 · 只列占比\",\n     text:\"To be specific, the {metric} of {item1}, {item2}, {item3} and {item4} account for {num1}, {num2}, {num3} and {num4} respectively.\",\n     zh:\"……的比例分别为……。\",\n     note:\"与总体描述句功能重复、或字数过多时，删掉后半句（2026 英二就是这么处理的）。\"},\n    {name:\"排名式 · 只写两项\",\n     text:\"To be specific, {item1} tops the list, at {num1}, followed by {item2} at {num2}.\",\n     zh:\"具体而言，……居首位，占……；其次是……，占……。\",\n     note:\"总体描述已用 Distribution + with 时，细节只补排名，避免重复。\"},\n    {name:\"公式2 · 静态倍数\",\n     text:\"To be specific, the {metric} of {item1} was about {multiple} that of {item2}.\",\n     zh:\"……的比例约为……的……倍。\",\n     note:\"静态图倍数 = 同一年份不同变量的对比；与动态公式 3 区分开。\"},\n    {name:\"例外 · 无趋势表格（2012）\",\n     text:\"To be specific, half of the employees under 40 and half of those over 50 were uncertain about their satisfaction, while {num1} of those aged 41-50 were dissatisfied.\",\n     zh:\"40 岁以下员工中有一半、50 岁以上员工中有一半不清楚自己是否满意；而 41 至 50 岁员工中，……表示不满意。\",\n     note:\"有且仅有 2012 英二不适用上述公式：毫无趋势可言且成分太多，只能选取最具代表性的两个数据。把 num1 改为 64%。\"}\n  ]\n},\n{\n  id:\"dual_s2\", p:1, no:\"2\", title:\"细节描述\", hint:\"双图表：两幅图各补一句\",\n  variants:[\n    {name:\"静静 · 占比 + 排名\",\n     text:\"To be specific, the proportions of {item1}, {item2} and {item3} account for {num1}, {num2} and {num3} respectively. Notably, {item4} tops the list of {topicR}, at {num4}, followed by {item5} at {num5}.\",\n     zh:\"具体而言，……的受访者比例分别为……。值得注意的是，……在……中居首位，占……；其次是……，占……。\",\n     note:\"2026 英一静静结合：左图占比并列，右图排名结构，两套公式拼在一句里。\"},\n    {name:\"动静 · 变化 + 占比\",\n     text:\"To be specific, the {metric} of {topicL} {verb1} {speed1} from {num1} to {num2}, while the {metric} of {item1} reached {num3}.\",\n     zh:\"具体而言，左图……从……变化至……，而右图中……达到……。\",\n     note:\"2022 英二改编（快递量 + 包装处理方式）：左图用动态动词，右图用 reach/account for。\"},\n    {name:\"动静 · 无指标版\",\n     text:\"To be specific, {topicL} {verb1} {speed1} from {num1} to {num2}, while the {metric} of {item1} reached {num3}.\",\n     zh:\"具体而言，左图……从……变化至……，而右图中……的占比达到……。\",\n     note:\"左图主题已是“the changes in …”这类完整名词短语时用本句，避免 the volume of the changes 这种叠床架屋。\"},\n    {name:\"两句分述 · 最短\",\n     text:\"To be specific, the {metric} of {item1} accounts for {num1}. As for the second chart, {item2} tops the list, at {num2}.\",\n     zh:\"具体而言，……占……。至于第二幅图，……居首位，占……。\",\n     note:\"时间紧、字数紧时用：每幅图一句，互不纠缠。\"}\n  ]\n},\n{\n  id:\"social\", p:1, no:\"3\", title:\"社会现象\", hint:\"过渡句 + 现象方案\",\n  variants:[\n    {name:\"方案1 · 某事变化（发展迅速）\",\n     text:\"{sub:lead} {topic2} has been developing rapidly in recent years.\",\n     zh:\"……近年来迅速发展。\",\n     note:\"实体主题词（industry / economy / cultural tourism industry）搭配 develop；水平/率/数量等抽象主题词改用方案 1b 的 improve/rise/climb。\"},\n    {name:\"方案1b · 某事变化（水平提升）\",\n     text:\"{sub:lead} {topic2} has been improving rapidly in recent years.\",\n     zh:\"……近年来迅速提高。\",\n     note:\"专治 2023 英二这类“水平/率”主题词：improve / rise / climb，不要用 develop。\"},\n    {name:\"方案2 · 越来越多人做某事\",\n     text:\"{sub:lead} the majority of {group} would choose to {act} when {cond}.\",\n     zh:\"大多数（人群）在（条件）时会选择做某事。\",\n     note:\"people 是泛指，按题目换 residents / undergraduates / consumers；也可换机构、企业、品牌、国家。25 英二例句即此方案。\"},\n    {name:\"方案3 · 某事变得普遍\",\n     text:\"{sub:lead} {doing} is becoming common among {group} nowadays.\",\n     zh:\"如今……在（人群）中正变得常见。\",\n     note:\"动名词作主语，最省事；2019 英二“升学越来越流行”即此方案。\"},\n    {name:\"方案4 · 某事获认同/关注\",\n     text:\"{sub:lead} {topic2} has drawn growing attention from the public, with {concern} as their top concern.\",\n     zh:\"……日益受到公众关注，……是他们的首要关切。\",\n     note:\"态度型图表专用（26 英一养老机器人、26 英二户外活动均考态度），27 考研可能延续。\"},\n    {name:\"方案5 · 万能（场景/现象）\",\n     text:\"{sub:lead} this is a common scene in modern society.\",\n     zh:\"在当今社会，这是一个很常见的场景。\",\n     note:\"不需要补任何成分的万能方案；也可换 this phenomenon reflects a broader social trend。\"}\n  ],\n  subs:[\n    {key:\"lead\", label:\"过渡句\", options:[\n      {name:\"待选1 · These data lead us to\", text:\"These data lead us to the conclusion that\", zh:\"这些数据使我们得出这样的结论\"},\n      {name:\"待选2 · It is apparent from the statistics\", text:\"It is apparent from the statistics that\", zh:\"从统计数据可以明显看出（最稳，写得最多）\"},\n      {name:\"待选3 · Despite its apparent simplicity\", text:\"Despite its apparent simplicity, the chart highlights the core information that\", zh:\"尽管它看似简单，这幅图却突出了核心信息\"},\n      {name:\"待选4 · clearly communicates\", text:\"The chart clearly communicates its intended meaning:\", zh:\"这幅图清楚地传达了它的意图\"},\n      {name:\"待选5 · a message to the younger generation\", text:\"The chart appears to convey a message to the younger generation, reminding them that\", zh:\"这幅图似乎向年轻一代传达了一条信息，提醒他们\"},\n      {name:\"升级版 · The purpose of the chart aims to remind\", text:\"The purpose of the chart aims to remind {agent} that\", zh:\"图表旨在提醒（某人）——升级表写法：be→aims to / serves to，us→the public 等\"},\n      {name:\"升级版 · convince\", text:\"The purpose of the chart is to convince {agent} that\", zh:\"图表意在使（某人）信服——remind 换 convince\"},\n      {name:\"升级版 · highlight the fact\", text:\"The chart highlights the fact that\", zh:\"图表强调这一事实——remind us 换 highlight the fact（删除 us）\"}\n    ]}\n  ]\n},\n];\n/* ==== data_vocab.js ==== */\n/* ================= 必背单词表补充（3.1 图表描述词汇） ================= */\nObject.assign(BANKS, {\n  peak: [\n    {en:\"peaked at\", zh:\"达到……的峰值（peak at）\", g:\"峰值\"},\n    {en:\"reached a peak of\", zh:\"达到……的峰值\", g:\"峰值\"},\n    {en:\"hit a record high of\", zh:\"创下……的历史新高\", g:\"峰值\"},\n    {en:\"reached an all-time high of\", zh:\"创下历史最高\", g:\"峰值\"},\n    {en:\"bottomed out at\", zh:\"在……触底（bottom out at）\", g:\"谷值\"},\n    {en:\"hit a trough of\", zh:\"跌至……的低谷\", g:\"谷值\"},\n    {en:\"fell to a low of\", zh:\"跌至……的低点\", g:\"谷值\"}\n  ],\n  approx: [\n    {en:\"approximately\", zh:\"大约（正式）\", g:\"约数\"},\n    {en:\"roughly\", zh:\"大约（常用）\", g:\"约数\"},\n    {en:\"nearly\", zh:\"将近\", g:\"约数\"},\n    {en:\"almost\", zh:\"几乎\", g:\"约数\"},\n    {en:\"just over\", zh:\"略高于\", g:\"约数\"},\n    {en:\"just under\", zh:\"略低于\", g:\"约数\"},\n    {en:\"about\", zh:\"约（最口语）\", g:\"约数\"}\n  ],\n  link: [\n    {en:\"whereas\", zh:\"而（强对比，书面）\", g:\"对比衔接\"},\n    {en:\"while\", zh:\"而（对比/同时）\", g:\"对比衔接\"},\n    {en:\"in contrast\", zh:\"相比之下\", g:\"对比衔接\"},\n    {en:\"by contrast\", zh:\"相比之下（更口语）\", g:\"对比衔接\"},\n    {en:\"meanwhile\", zh:\"与此同时\", g:\"对比衔接\"},\n    {en:\"on the contrary\", zh:\"恰恰相反（反驳用）\", g:\"对比衔接\"}\n  ],\n  rank: [\n    {en:\"tops the list\", zh:\"位居首位（rank first）\", g:\"排序\"},\n    {en:\"ranks first\", zh:\"排名第一\", g:\"排序\"},\n    {en:\"follows closely behind\", zh:\"紧随其后\", g:\"排序\"},\n    {en:\"takes the lion's share\", zh:\"占据最大份额\", g:\"排序\"},\n    {en:\"accounts for the largest proportion\", zh:\"占最大比例\", g:\"排序\"}\n  ]\n});\nSLOTS.peakV = {label:\"峰值/谷值动词\", bank:\"peak\", hint:\"peaked at / bottomed out at 一类\"};\nSLOTS.approxV = {label:\"约数\", bank:\"approx\", hint:\"approximately / roughly / just over\"};\nSLOTS.link = {label:\"对比衔接\", bank:\"link\", hint:\"whereas / while / in contrast / meanwhile\"};\nSLOTS.rankV = {label:\"排序结构\", bank:\"rank\", hint:\"tops the list / follows closely behind\"};\n\n/* ==== data_cards_p2.js ==== */\n/* =========================================================\n   第一段 · 图画 / 文字作文\n   ========================================================= */\nCARDS.push(\n{\n  id:\"pic_lead\", p:1, no:\"1a\", title:\"图画描述 · 引入句\", hint:\"升级版 As is shown\", open:true,\n  variants:[\n    {name:\"升级版 · symbolically depicted\",\n     text:\"As is symbolically depicted in the {pic} above,\",\n     zh:\"如上图象征性地描绘的那样，\",\n     note:\"升级表：shown→illustrated/depicted/portrayed/conveyed/described/presented/indicated/demonstrated/reflected，并加副词 vividly/symbolically/subtly/clearly；picture→drawing/painting/photograph/cartoon。这一句永远可用。\"},\n    {name:\"待选1 · thought-provoking scene\",\n     text:\"The {pic} above presents us with a thought-provoking scene:\",\n     zh:\"上面的漫画向我们呈现了一个发人深省的场景：\",\n     note:\"冒号后直接接描述，最省连接词。\"},\n    {name:\"待选2 · Portrayed distinctively\",\n     text:\"Portrayed distinctively in the {pic} above is a common scene:\",\n     zh:\"画中清晰地描绘出一个常见的场景：\",\n     note:\"完全倒装，句子显得高级；主语在后，注意主谓一致。\"},\n    {name:\"待选3 · What is clearly conveyed\",\n     text:\"What is clearly conveyed in the {pic} above is that\",\n     zh:\"图片明确传达出的是\",\n     note:\"主语从句 + that，后接完整描述句。\"},\n    {name:\"待选4 · familiar and thought-provoking\",\n     text:\"Depicted in the {pic} above is a scene that strikes us as both familiar and thought-provoking:\",\n     zh:\"图中描绘的是一个既熟悉又发人深省的场景：\",\n     note:\"适合 2018 选课、2020 习惯这类“身边小事”。\"},\n    {name:\"一图一表 · 图画+图表叠加\",\n     text:\"As is vividly depicted in the {pic} and clearly shown in the {chart} above,\",\n     zh:\"如上图生动描绘、下图清晰展示的那样，\",\n     note:\"2024 英一图画+图表：就是图画描述与图表总体描述的简单叠加，连词用 and。\"}\n  ]\n},\n{\n  id:\"pic_desc\", p:1, no:\"1b\", title:\"图画描述 · 主体\", hint:\"分类·拆分·组合法\",\n  variants:[\n    {name:\"单图（非对话）· 完整公式\",\n     text:\"{env} {basicV} {subject}, {adjPair}, {mainAct}, {detail}.\",\n     zh:\"在（环境）（基本动作）（主体），（形容词对），（主要动作），（细节）。\",\n     note:\"公式：环境 + 基本动作 + 主体，形容词对，主要动作，with 细节。主体通常是人或物；细节写表情心态，想不起来可不写。\"},\n    {name:\"单图（非对话）· 简版\",\n     text:\"{env} {basicV} {subject}, {mainAct}, {detail}.\",\n     zh:\"在（环境）（基本动作）（主体），（主要动作），（细节）。\",\n     note:\"时间紧、图画简单时用；先保证写得出，再追求写得细。\"},\n    {name:\"单图（对话）· 转述\",\n     text:\"{env} {basicV} {subject}, {mainAct}. One {evokeV} that {quote1}. {sub:contrast} the other {evokeV2} that {quote2}.\",\n     zh:\"在（环境）（基本动作）（主体），（主要动作）。其中一人认为……；相比之下，另一人坚持认为……。\",\n     note:\"推荐转述：人物对话往往十分简洁，直接翻译会显得文章低级。2022 英一听讲座即此写法。\"},\n    {name:\"单图（对话）· 直述\",\n     text:\"{env} {basicV} {subject}, {mainAct}. The girl on the left says, \\\"{quote1}.\\\" {sub:contrast} the girl on the right answers, \\\"{quote2}.\\\"\",\n     zh:\"……左边的女孩说：“……”相比之下，右边的女孩回答：“……”。\",\n     note:\"直述要加引号，且对话原文必须与图画一致；能用转述就别用直述。\"},\n    {name:\"两幅图 · 对照\",\n     text:\"the girl in the left picture, {leftState}, is fully focused on {leftAct}. {sub:contrast} the boy in the right picture, {rightState}, {rightAct}.\",\n     zh:\"左边图中的女孩（状态）全神贯注于（动作）。然而右边图中的男孩（状态）（动作）。\",\n     note:\"两幅图 = 简化后的单图公式重复两次 + 连词：对比用 However/While，相似用 Similarly，同时用 Meanwhile。2020 英一即此写法。\"},\n    {name:\"一图一表 · 图画+图表\",\n     text:\"{env} {basicV} {subject}, {mainAct}, {detail}. Referring to the statistics provided in the right {chart}, the {metric} of {topic} {verb1} {speed1} from {num1} in {year1} to {num2} in {year2}.\",\n     zh:\"（环境）中（主体）（动作），（细节）。而右侧图表的数据显示，主题词的……从年份的……变化到年份的……。\",\n     note:\"2024 英一：图画描述 + 图表总体描述叠加，各写一句即可，受篇幅限制无需细描。\"},\n    {name:\"例外 · there be 句型（2010）\",\n     text:\"there are many {elements} in the {container}, such as {examples}. Below the {container}, a caption reads: \\\"{caption}\\\"\",\n     zh:\"在这个（容器）中有许多（元素），例如……。（容器）下面写着：“……”\",\n     note:\"2010 文化火锅专用。there be 稍显平淡，可改：The hotpot integrates diverse cultural symbols, such as… / Appearing in the hotpot are…\"},\n    {name:\"补充 · 只写标题文字\",\n     text:\"below the {pic}, there is a caption which reads: \\\"{caption}\\\"\",\n     zh:\"图画下方有一句说明文字：“……”\",\n     note:\"描述困难、首段太短、或标题并非主题词时补；三种句型：Below the drawing, there is a caption which reads / The caption beneath the drawing reads / A profound statement is placed below the picture。\"}\n  ],\n  subs:[\n    {key:\"contrast\", label:\"关联词\", options:[\n      {name:\"By contrast,\", text:\"By contrast,\", zh:\"相比之下（对比，原句）\"},\n      {name:\"However,\", text:\"However,\", zh:\"然而（对比）\"},\n      {name:\"Conversely,\", text:\"Conversely,\", zh:\"反之（对比，较正式）\"},\n      {name:\"On the contrary,\", text:\"On the contrary,\", zh:\"恰恰相反（反驳）\"},\n      {name:\"Meanwhile,\", text:\"Meanwhile,\", zh:\"与此同时（同时发生）\"},\n      {name:\"Similarly,\", text:\"Similarly,\", zh:\"同样地（相似）\"},\n      {name:\"Likewise,\", text:\"Likewise,\", zh:\"同样地（相似，较正式）\"}\n    ]}\n  ]\n},\n{\n  id:\"theme_lead\", p:1, no:\"2a\", title:\"主题阐述 · 引入句\", hint:\"升级版 The purpose of the drawing\", open:true,\n  variants:[\n    {name:\"升级版 · primary intention\",\n     text:\"The primary intention of the {pic} is to remind {agent} that\",\n     zh:\"这幅图的首要意图是提醒（某人）\",\n     note:\"升级表：is to→aims to / serves to / is designed to（须删除 The purpose of）；us→the public / human beings / children and adults；purpose→message / implication / symbolic meaning；remind→convince / highlight the fact（删除 us）。越具体越好。\"},\n    {name:\"待选1 · Simple as the drawing is\",\n     text:\"Simple as the {pic} is, it conveys a truth that\",\n     zh:\"图画虽然简单，但蕴含真理：\",\n     note:\"让步倒装，最百搭；后接中心思想句。\"},\n    {name:\"待选2 · undoubtedly emphasizes\",\n     text:\"The {pic}, undoubtedly, emphasizes the core idea that\",\n     zh:\"这幅图，毫无疑问，突出了这样的核心观点：\",\n     note:\"插入语拉长句子，主谓之间插 undoubtedly。\"},\n    {name:\"待选3 · What the cartoon mirrors\",\n     text:\"What the {pic} above mirrors is a thought-provoking phenomenon that\",\n     zh:\"上图反映的是一个发人深省的现象：\",\n     note:\"主语从句 + mirrors，适合社会现象类寓意。\"},\n    {name:\"待选4 · conveys a clear message\",\n     text:\"The {pic} conveys a clear message:\",\n     zh:\"这幅图传达了一个明确的信息：\",\n     note:\"冒号后直接写中心思想，最像真题范文（2005 养老足球赛）。\"},\n    {name:\"一图一表 · and the chart\",\n     text:\"Without a doubt, the {pic} and the {chart} emphasize the truth that\",\n     zh:\"毫无疑问，图和表强调了一个事实：\",\n     note:\"与 pic_lead 的一图一表句配套使用。\"}\n  ]\n},\n{\n  id:\"theme_body\", p:1, no:\"2b\", title:\"中心思想\", hint:\"某事很重要 / 引起关注\",\n  variants:[\n    {name:\"方案1 · 如此重要以至于\",\n     text:\"{topic2} is so {importance} that the {problemN} deserves the highest level of attention and consideration.\",\n     zh:\"……如此重要，以至于这个（问题）值得最高程度的关注和考虑。\",\n     note:\"升级表：important→vital/critical/indispensable/significant/irreplaceable；problem→phenomenon/subject/situation/issue/scene/circumstance/it。主题词要具体到事。\"},\n    {name:\"方案2 · 给予高度重视\",\n     text:\"the utmost importance ought to be attached to {topic2} by {agent}.\",\n     zh:\"（某人）应当给予……高度重视。\",\n     note:\"2011 环保例句写法；也可换 our government and citizens should give the highest priority to …。“某人”一般指政府、机构、个人、民众。\"},\n    {name:\"方案2b · 放在首位\",\n     text:\"{agent} should give the highest priority to {topic2}.\",\n     zh:\"（某人）应该把……放在首位。\",\n     note:\"与方案 2 同源，主动语态更简洁。\"},\n    {name:\"方案3 · 取得重大成就\",\n     text:\"great accomplishments have been made in {topic2} by {agent}.\",\n     zh:\"（某人）在……方面取得了巨大成就。\",\n     note:\"2024 英一公园建设例句写法：great accomplishments / achievements have been made in …。“某人”参考 us 的替换词。\"},\n    {name:\"方案4 · 双重否定\",\n     text:\"at no time should {agent} underestimate the significance of {topic2}.\",\n     zh:\"（某人）任何时候都不应低估……的重要性。\",\n     note:\"2005 孝顺例句：at no time should the public underestimate the significance of filial piety。\"},\n    {name:\"方案4b · 重要性被低估\",\n     text:\"the importance of {topic2} should never be underestimated by {agent}.\",\n     zh:\"……的重要性绝不应被（某人）低估。\",\n     note:\"被动版；同类：The importance of … cannot be overstated by …\"},\n    {name:\"方案5 · 强调句型\",\n     text:\"it is {topic2} that deserves greater attention.\",\n     zh:\"正是……值得更多关注。\",\n     note:\"It is … that 强调句；同类：It is … that must be our top priority / requires our immediate attention。适合创新、选择等抽象主题。\"}\n  ]\n},\n{\n  id:\"txt_phen\", p:1, no:\"1\", title:\"文字改写\", hint:\"改写现象 + 改写观点\",\n  variants:[\n    {name:\"改写示范 · 同义替换\",\n     text:\"Nowadays, gaining trust from others is vital in the workplace. Many people are afraid of damaging their image by appearing unsure.\",\n     zh:\"如今，在职场中获得他人的信任是至关重要的。许多人害怕表现得不自信会损害自己的形象。\",\n     note:\"改写思路：同义词/词组替换、主动变被动、被动变主动、高度概括、变换修饰语位置。这是样题 1 的标准改写。\"},\n    {name:\"不会改写1 · It cannot be denied\",\n     text:\"It cannot be denied that {topic2} plays a key role in people's work and life.\",\n     zh:\"不可否认的是，……在人们工作和生活中扮演了重要角色。\",\n     note:\"实在改写不出来就用“引出主题 + 改写观点”，本句是样题 1 的备用开头。\"},\n    {name:\"不会改写2 · It is widely accepted\",\n     text:\"It is widely accepted that {topic2}, a strong and positive life attitude, is the key element for individuals to achieve success.\",\n     zh:\"人们普遍认为，……作为一种坚强积极的生活态度，是个人取得成功的关键因素。\",\n     note:\"后面同位语可按主题改：a precious quality / an essential ability。\"},\n    {name:\"不会改写3 · caused wide concern\",\n     text:\"Nowadays, it is well-known that the problem of {topic2} has caused wide concern.\",\n     zh:\"如今，众所周知，……的问题已经引起了广泛关注。\",\n     note:\"适合负面话题（网瘾、环境恶化）。\"},\n    {name:\"不会改写4 · has become a common phenomenon\",\n     text:\"With the rapid advancement of society and technology, {topic2} has become a common phenomenon in our daily lives.\",\n     zh:\"随着社会和技术的进步，……已经成为我们日常生活中一个普遍的现象。\",\n     note:\"样题 2（儿童与屏幕）的标准备用开头。\"},\n    {name:\"不会改写5 · whether to A or B\",\n     text:\"Currently, whether to {choiceA} or {choiceB} has become a hot topic among people, especially among the young, and heated discussions are on the way.\",\n     zh:\"目前，是……还是……已经成为人们的热门话题，尤其在年轻人中 "人们普遍相信\"},\n    {name:\"It is generally agreed that\", text:\"It is generally agreed that\", zh:\"人们普遍认同\"},\n    {name:\"It is well known that\", text:\"It is well known that\", zh:\"众所周知\"},\n    {name:\"It is commonly known that\", text:\"It is commonly known that\", zh:\"众所周知（变体）\"},\n    {name:\"It is universally known that\", text:\"It is universally known that\", zh:\"众所周知（更强）\"},\n    {name:\"It has been widely accepted that\", text:\"It has been widely accepted that\", zh:\"已被广泛接受\"},\n    {name:\"It has been widely reported that\", text:\"It has been widely reported that\", zh:\"已被广泛报道\"},\n    {name:\"There is no doubt that\", text:\"There is no doubt that\", zh:\"毫无疑问\"},\n    {name:\"Nobody can deny that\", text:\"Nobody can deny that\", zh:\"没人能否认\"},\n    {name:\"An increasing number of people are beginning to realize that\", text:\"An increasing number of people are beginning to realize that\", zh:\"越来越多的人开始意识到\"},\n    {name:\"We must acknowledge the fact that\", text:\"We must acknowledge the fact that\", zh:\"我们必须承认\"},\n    {name:\"We cannot ignore the fact that\", text:\"We cannot ignore the fact that\", zh:\"我们不能忽视……的事实\"},\n    {name:\"Definitely no one can deny the fact that\", text:\"Definitely no one can deny the fact that\", zh:\"当然，没有人能否认这个事实\"},\n    {name:\"A rising number of individuals are coming to the realization that\", text:\"A rising number of individuals are coming to the realization that\", zh:\"越来越多的人开始意识到（变体）\"},\n    {name:\"We are faced with the undeniable fact that\", text:\"We are faced with the undeniable fact that\", zh:\"我们面临着不可否认的事实\"},\n    {name:\"There is a growing recognition that\", text:\"There is a growing recognition that\", zh:\"人们越来越认识到\"}\n  ]},\n  {key:\"phrase\", label:\"短语（方案三专用）\", options:[\n    {name:\"play a crucial role in\", text:\"{topic2} plays a crucial role in {aspect}.\", zh:\"在……中起关键作用\"},\n    {name:\"play a vital role in\", text:\"{topic2} plays a vital role in {aspect}.\", zh:\"在……中起至关重要的作用\"},\n    {name:\"play a pivotal role in\", text:\"{topic2} plays a pivotal role in {aspect}.\", zh:\"在……中起核心作用\"},\n    {name:\"play a fundamental role in\", text:\"{topic2} plays a fundamental role in {aspect}.\", zh:\"在……中起基础作用\"},\n    {name:\"play a central role in\", text:\"{topic2} plays a central role in {aspect}.\", zh:\"在……中起中心作用\"},\n    {name:\"lay the foundation of\", text:\"{topic2} lays the foundation of {aspect}.\", zh:\"奠定……的基础\"},\n    {name:\"be a driving force behind\", text:\"{topic2} is a driving force behind {aspect}.\", zh:\"是……背后的推动力\"},\n    {name:\"be the cornerstone of\", text:\"{topic2} is the cornerstone of {aspect}.\", zh:\"是……的基石\"},\n    {name:\"act as a catalyst for\", text:\"{topic2} acts as a catalyst for {aspect}.\", zh:\"作为……的催化剂\"},\n    {name:\"have a beneficial influence on\", text:\"{topic2} has a beneficial influence on {aspect}.\", zh:\"对……有积极影响\"},\n    {name:\"bring advantages in\", text:\"{topic2} brings advantages in {aspect}.\", zh:\"在……方面带来优势\"},\n    {name:\"contribute significantly to\", text:\"{topic2} contributes significantly to {aspect}.\", zh:\"对……有重大贡献\"},\n    {name:\"undermine\", text:\"{topic2} may undermine {aspect}.\", zh:\"可能损害……（消极）\"},\n    {name:\"pose a threat to\", text:\"{topic2} poses a tremendous threat to {aspect}.\", zh:\"对……构成巨大威胁（消极）\"},\n    {name:\"be a double-edged sword for\", text:\"{topic2} is a double-edged sword for {aspect}.\", zh:\"对……是双刃剑（争议话题）\"},\n    {name:\"be strongly dependent on\", text:\"{aspect} is strongly dependent on {topic2}.\", zh:\"……高度依赖……（主语调换，注意单复数）\"},\n    {name:\"be inextricably linked to\", text:\"{aspect} is inextricably linked to {topic2}.\", zh:\"……与……密不可分\"},\n    {name:\"be closely tied to\", text:\"{aspect} is closely tied to {topic2}.\", zh:\"……与……紧密相连\"}\n  ]}\n];\n\nfunction mkReason(id,no,title,hint,defConn){\n  return {\n    id:id, p:2, no:no, title:title, hint:hint, defConn:defConn,\n    variants:[\n      {name:\"方案一 · 举例论证（个人路线）\",\n       text:\"{sub:conn} For instance, {person} {attV} {obj}, which {enablePhrase}. {timeWord} {outcome}.\",\n       zh:\"例如，我的……，……，这使……。在此期间/因此，……。\",\n       note:\"灵活应变四步组装：①引出例子（For instance / This point can be confirmed by the example of my roommate / To give a common example）②短语写现状 ③which 从句写好处 ④另起一句写心态或结果。放弃背名人事例，专攻身边 2~3 个例子。\"},\n      {name:\"方案二 · 宾从+定从（群众路线）\",\n       text:\"{sub:conn} The majority of {group} {believeV} that {topic2} will {provideVP} {benefit}, {result}.\",\n       zh:\"大多数人认为……会为他们提供一个更广阔的平台去……，这可能会让他们在未来处于有利位置。\",\n       note:\"believe 可换 maintain / hold the view / are convinced；provide…with a broader platform 可换 present…with a unique chance / create more opportunities for；which 从句逻辑必须与主题匹配（个人发展用 beneficial position，健康用 quality of life）。\"},\n      {name:\"方案二b · 不带 to 版\",\n       text:\"{sub:conn} The majority of {group} {believeV} that {topic2} will {provideNoTo}, {result}.\",\n       zh:\"大多数……相信……会为他们提供极大便利，这在日常生活中不可或缺。\",\n       note:\"用于“便利/机会”一类好处（2025 英一、2025 英二例句即此写法）。\"},\n      {name:\"方案三 · 从句 + 六大方面\",\n       text:\"{sub:conn} {sub:clause} {sub:phrase}\",\n       zh:\"（从句）……在（六大方面）中起关键作用。\",\n       note:\"从句只负责拉长句子，重点在省略号后面：善用短语 + 六大方面。加粗部分（主题词 + 某方面）按题换，其余万年不变。这是必须掌握的方案。\"},\n      {name:\"方案四 · not only…but also 倒装\",\n       text:\"{sub:conn} Not only does {topic2} {increaseV} {aspect}, but it also {enable3} {benefit}.\",\n       zh:\"……不仅提升了……，而且使他们能够……。\",\n       note:\"increase 可换 improve/enhance/promote/boost/cultivate/facilitate/indicate/demonstrate；enable 可换 help/allow/encourage/deepen/promote/relieve。主语是复数时用 do 不用 does，but also 后用 their。\"},\n      {name:\"方案五 · 虚拟语气（扣帽子）\",\n       text:\"{sub:conn} If {ignored} {topic2}, {catastrophe}.\",\n       zh:\"如果我们忽视……的重要性，我们就永远不会成为更好的自己／社会就没有未来。\",\n       note:\"第一步写主将从现句，第二步 fails→failed、will→would。拿到题目先判断主题落在个人/社会/国家哪一层，再调对应句式，但别扣太狠。建议放在原因三，段尾警醒，适用性极强。\"},\n      {name:\"方案六 · 对比论证（so as to）\",\n       text:\"{sub:conn} Compared with {compB}, {compA} can {smallAsp}, thereby {bigAsp}.\",\n       zh:\"与……相比，……能够……，从而……。\",\n       note:\"A 是主要内容、B 是次要内容。没有对比就创造对比（24英一用商业项目、26英一用传统人工照护）。so as to 结构也可换 which 引导的定语从句。\"},\n      {name:\"方案六b · the advantage lies in\",\n       text:\"{sub:conn} In contrast to {compB}, the advantage of {compA} lies in {aspect}.\",\n       zh:\"与……相比，……的优势在于……。\",\n       note:\"名词性收尾，适合方面不好展开时；后接名词或动名词。\"},\n      {name:\"方案七 · 比喻句\",\n       text:\"{sub:conn} {topic2} is {metaphor}.\",\n       zh:\"……是（灯塔/指南针/钥匙/引擎/桥梁/基石）。\",\n       note:\"按主题词选喻体：意志品质类→engine，心态类→lighthouse，品德类→foundation，思维类→compass，人际合作→bridge。写不出来别硬套；可加插入语拉长：Creativity and innovation, needless to say, are as important as a compass…\"}\n    ],\n    subs:REASON_SUBS\n  };\n}\nCARDS.push(\n{\n  id:\"p2_trans\", p:2, no:\"4\", title:\"过渡句\", hint:\"第四句 · 引出原因\",\n  variants:[\n    {name:\"升级表 · There are many reasons\",\n     text:\"There are {quant} {reasonN} to {explainV} my {ideaN}.\",\n     zh:\"有很多原因可以解释我的观点。\",\n     note:\"原句 There are many reasons to explain my idea。必背替换：many→innumerable/countless/abundant/adequate/sufficient/a host of/a variety of/plenty of；reason→factor/cause；explain→contribute to/give rise to/account for；idea→standpoint/perspective/viewpoint/opinion。\"},\n    {name:\"待选1 · Three key reasons\",\n     text:\"Three key reasons, from my perspective, account for this phenomenon.\",\n     zh:\"在我看来，三个关键原因可以解释这一现象。\",\n     note:\"简洁有力，英一三点原因首选。\"},\n    {name:\"待选2 · can be summarized as\",\n     text:\"From my perspective, the causes of {topic2} can be summarized as three main aspects.\",\n     zh:\"在我看来，……的成因可以归结为三个主要方面。\",\n     note:\"先把主题词点出来，读者更清楚。\"},\n    {name:\"待选3 · Several factors\",\n     text:\"Several factors contribute to this phenomenon.\",\n     zh:\"几个因素促成了这一现象。\",\n     note:\"最短最稳，英二两点原因也适用。\"},\n    {name:\"待选4 · A variety of reasons\",\n     text:\"A variety of reasons can be cited to account for this phenomenon.\",\n     zh:\"有很多原因可以用来解释这一现象。\",\n     note:\"被动 + 情态，句子长一点。\"},\n    {name:\"待选5 · A combination of factors\",\n     text:\"A combination of factors has contributed to the tendency reflected in this {chart}.\",\n     zh:\"多种因素共同促成了这张图表所反映的趋势。\",\n     note:\"图表作文专用，与第一段衔接最紧。\"}\n  ]\n},\nmkReason(\"r1\",\"5\",\"原因①\",\"第五句 · 原因分析\",\"Firstly,\"),\nmkReason(\"r2\",\"6\",\"原因②\",\"第六句 · 原因分析\",\"What's more,\"),\nmkReason(\"r3\",\"7\",\"原因③\",\"第七句 · 原因分析\",\"Last but not least,\"),\n{\n  id:\"p2_debate\", p:2, no:\"4b\", title:\"争议话题（可选）\", hint:\"正反论证：换掉过渡句\",\n  optional:true,\n  variants:[\n    {name:\"过渡 · pros and cons\",\n     text:\"Every situation has its pros and cons, and this issue is not exempt. {sub:formula}\",\n     zh:\"每种情况都有其利弊，这个问题也不例外。\",\n     note:\"争议话题（06偶像崇拜、09网络、13毕业生选择、13兼职、15手机聚会、19英二、20英二手机阅读）需要正反论证时，先用本句替换过渡句。\"},\n    {name:\"过渡 · remains controversial\",\n     text:\"In fact, this issue remains controversial. {sub:formula}\",\n     zh:\"事实上，这个问题仍有争议。\",\n     note:\"三种争议过渡任选：Every situation has its pros and cons…/ In fact, this issue remains controversial. / When it comes to …, opinions vary widely.\"},\n    {name:\"过渡 · opinions vary widely\",\n     text:\"When it comes to {topic2}, opinions vary widely. {sub:formula}\",\n     zh:\"涉及……时，意见分歧很大。\",\n     note:\"题目里出现“争议/看法不一”信号词时启用。\"}\n  ],\n  subs:[\n    {key:\"formula\", label:\"正反公式\", options:[\n      {name:\"公式1 · On the one hand\",\n       text:\"On the one hand, some people hold the view that {viewA}. On the other hand, the rest insist that {viewB}. Nevertheless, when we are confronted with {topic2}, we should be sensible enough to discard the dross and select the essence.\",\n       zh:\"一方面，一些人认为……；另一方面，剩下的人坚持认为……。然而面对……，我们应取其精华去其糟粕。\",\n       note:\"省略号代表的是七个方案里的句子或部分句子。2009 网络例句即此模板。\"},\n      {name:\"公式2 · Proponents / critics\",\n       text:\"Proponents of this trend argue that {viewA}. However, critics are quick to point out its adverse consequences, such as {viewB}. It is, therefore, imperative for us to adopt a discerning attitude, carefully weighing its merits against its demerits.\",\n       zh:\"该趋势的支持者认为……；然而批评者迅速指出其不利后果，例如……。因此我们必须采取有辨识力的态度，仔细权衡利弊。\",\n       note:\"更“高级”的争议句式，适合 13 英二兼职、20 英二手机阅读。\"},\n      ]}\n  ]\n}\n);\n\n/* =========================================================\n   第三段 · 总结全文 + 具体措施 + 畅想未来\n   ========================================================= */\nCARDS.push(\n{\n  id:\"p3_sum\", p:3, no:\"8\", title:\"总结全文\", hint:\"第八句 · 重申中心思想\",\n  variants:[\n    {name:\"公式1 · 得出结论（关注）\",\n     text:\"{sub:start} It is not difficult to draw the conclusion that enough attention must be paid to {topic2} by {agent}.\",\n     zh:\"不难得出结论：（某人）必须对……给予足够的重视。\",\n     note:\"注意根据情况变换时态：has been paid to（已重视）/ must be paid to（应重视）。24 英一例句用 has been paid to the infrastructure by the departments concerned。\"},\n    {name:\"公式2 · bear in mind\",\n     text:\"{sub:start} we should bear in mind that {topic2} is of great importance to {aspectShort}.\",\n     zh:\"我们应牢记在心的是，……对……很重要。\",\n     note:\"特别适用于意志品质类（the spirit of perseverance / never giving up / lifelong learning / selfless dedication / cooperation）。\"},\n    {name:\"公式3 · not an option, but a necessity\",\n     text:\"{sub:start} the discussion leads us to the realization that {topic2} is not an option, but a necessity.\",\n     zh:\"讨论使我们认识到，……不是一种选择，而是一种必要。\",\n     note:\"把主题词换成 cultural inheritance / high-quality lifestyle / elderly care 即可通吃。\"},\n    {name:\"公式4 · integral part of our lives\",\n     text:\"{sub:start} we are faced with the undeniable fact that {topic2} has become an integral part of {aspectShort}.\",\n     zh:\"我们面临着一个不可否认的事实：……已经成为……中不可或缺的一部分。\",\n     note:\"互联网、手机、户外活动一类“已融入生活”的主题专用。\"},\n    {name:\"公式4b · increasingly accessible\",\n     text:\"{sub:start} we are faced with the undeniable fact that {topic2} has become increasingly accessible to {group}.\",\n     zh:\"我们面临着一个不可否认的事实：……已经越来越为（人群）所接受。\",\n     note:\"2026 英一例句：have become increasingly popular with the general public。\"},\n    {name:\"方案二 · 否定倒装（give up）\",\n     text:\"{sub:start} by no means should we give up our efforts to {doSth}.\",\n     zh:\"我们决不能放弃在……上的努力。\",\n     note:\"结构：否定词 + 助动词 + 主谓宾。否定词可换 Never can we / On no account should we / Under no circumstances can we / By no means should we。\"},\n    {name:\"方案二b · 否定倒装（pursuit）\",\n     text:\"{sub:start} under no circumstances should we cease our pursuit of {objectN}.\",\n     zh:\"在任何情况下，我们都不应停止对……的追求。\",\n     note:\"动词短语变体：give up our efforts to / underestimate the profound impact of / cease our pursuit of / doubt the importance of。\"},\n    {name:\"方案三 · 万能但不够针对\",\n     text:\"{sub:start} it is evident that the trend reflected in the {chart} deserves our careful consideration.\",\n     zh:\"很明显，图表反映的趋势值得我们认真考虑。\",\n     note:\"万能且无需修改任何内容，应急使用；同类：There is no denying that further attention must be paid to… / Given the above analysis, it is not difficult to understand why…\"},\n    {name:\"趋势预测1 · continue to increase\",\n     text:\"Taking into account all the factors discussed above, we may reasonably conclude that, with the passage of time and the advancement of society, the number of {group} who choose to {doSth} will continue to increase in the coming years.\",\n     zh:\"综合考虑上述所有因素，我们可以合理地得出结论：随着时代变迁和社会进步，未来几年选择……的人数将持续增加。\",\n     note:\"图表作文第三段补充写法：总结全文 + 趋势预测，最简单；深度不及建议措施，仅应急使用。\"},\n    {name:\"趋势预测2 · is likely to continue\",\n     text:\"For the reasons given above, we can predict that an increasing number of {group} will focus on {topic2}, and this trend is likely to continue in the near future.\",\n     zh:\"基于上述原因，我们可以预测，将有越来越多的人关注……，这一趋势在不久的将来很可能会持续。\",\n     note:\"预测 + 延续，两句合一。\"},\n    {name:\"趋势预测3 · witness larger-scale development\",\n     text:\"Given the arguments above, the next few years will also witness larger-scale, faster-paced, and higher-quality development in {topic2}.\",\n     zh:\"鉴于上述论点，未来几年……也将迎来更大规模、更快速度和更高水平的发展。\",\n     note:\"三形容词并列，句式漂亮，适合发展类主题。\"},\n    {name:\"趋势预测4 · bound to continue\",\n     text:\"In conclusion, the phenomenon reflected in the chart is bound to continue, and it will keep exerting a positive influence on {aspect}.\",\n     zh:\"总之，图表所反映的现象必将持续下去，并将继续对……带来积极影响。\",\n     note:\"静态图应急用；若主题偏中性会略显生硬。\"},\n    {name:\"趋势预测5 · gain greater significance\",\n     text:\"In a word, as society keeps moving forward, {topic2} is likely to gain even greater significance in the days to come.\",\n     zh:\"总之，随着社会不断前进，……在未来很可能变得更加重要。\",\n     note:\"2026 英一双图表例句写法。\"}\n  ],\n  subs:[\n    {key:\"start\", label:\"句首标志\", options:[\n      {name:\"All in all,\", text:\"All in all,\", zh:\"总而言之（原书推荐）\"},\n      {name:\"To sum up,\", text:\"To sum up,\", zh:\"总结来说\"},\n      {name:\"In general,\", text:\"In general,\", zh:\"总的来说\"},\n      {name:\"Generally speaking,\", text:\"Generally speaking,\", zh:\"一般而言\"},\n      {name:\"On the whole,\", text:\"On the whole,\", zh:\"总体上\"},\n      {name:\"（不加标志）\", text:\"\", zh:\"直接进入总结句\"}\n    ]}\n  ]\n},\n{\n  id:\"p3_measure\", p:3, no:\"9·10\", title:\"具体措施\", hint:\"第九、十句 · 一句一个角度\",\n  variants:[\n    {name:\"方案一 · 两句并列（五角度）\",\n     text:\"{sub:m1} {sub:angle1}. {sub:m2} {sub:angle2}.\",\n     zh:\"一方面，……。另一方面，……。\",\n     note:\"五个角度：政府作为、公民意识、个人行为、媒体呼吁、家庭教育。任选三个角度掌握，肯定命中两个。可单独使用也可用连接词相连。\"},\n    {name:\"方案二 · 老子说的才是对的①\",\n     text:\"When it comes to concrete solutions, some people hold that {measureB} must take responsibility for {topic2}. In fact, it is {aspectD} that plays a crucial role in {aspectD2}.\",\n     zh:\"当涉及具体解决方案时，一些人认为……必须对……负责。事实上，……在……中起着至关重要的作用。\",\n     note:\"第一句抛出大多数人的做法，In fact 转折给出自己的看法。A=别人认为的实施方，C=你认为的实施方（培养公民意识一类），D 不要和 B 一模一样。主题词、实施方、措施都短时才用，否则字数太多。\"},\n    {name:\"方案二 · 老子说的才是对的②\",\n     text:\"On the surface, {measureB} seems to be a sound solution, but on careful consideration, we find that {measureB2} is a more reasonable and effective approach.\",\n     zh:\"表面上，……似乎是一个合理的解决方案，但仔细考虑后，我们发现……才是更合理、更有效的方法。\",\n     note:\"On the surface 让步 + but 转折，观点鲜明；26 英一英二都不太适合本方案（字数太 '<p>大作文 25 分钟默写完（约 200 词、18–20 行）：<b>5 分钟审题 + 在题目旁搭框架</b>，其余时间默写。先用本工具把 10 句定下来，考场只做“换词”这一件事。</p></div>'\n+ '<div class=\"h-sec\"><h3>四、高分准则</h3>'\n+ '<ul><li>卷面整洁：每天 10 分钟字帖。</li><li>结构清晰：看见题目就能定框架（本模板已代劳）。</li>'\n+ '<li>语言丰富：看见题目就能定句型（本模板已代劳）。</li><li>拼写正确：模板词 + 主题词都要会拼（空调、冰箱、机器人、洗碗机都是易错点）。</li>'\n+ '<li>契合主题：内容与主题相关、不牵强即可。</li></ul></div>'\n+ '<div class=\"h-sec\"><h3>五、学习路径与练习顺序</h3>'\n+ '<p>学习路径：图表作文第一段 → 通用第二段 → 通用第三段 → 图画作文第一段 → 文字作文第一段。</p>'\n+ '<p>练习顺序：26 英二（静态图）→ 23 英二（动态图）→ 26 英一（双图表）→ 24 英一（图画+图表）→ 23 英一（单图画）→ 20 英一（双图画）→ 文字作文大纲样题。</p>'\n+ '<p>每周套用 1–2 篇，考前 20 天每天 1 篇；把偏好的词句抄在一张纸上，形成自己的模板。</p></div>'\n+ '<div class=\"h-sec\"><h3>六、第二段七个方案怎么选</h3>'\n+ '<p>英一写 3 点原因，英二写 2–3 点。考场上七选三，重复概率几乎为零。建议至少掌握五个：<b>方案一（举例）、方案三（从句 + 六大方面）、方案五（虚拟语气）必掌握</b>，再用方案六（对比）、方案七（比喻）补位。方案五放在原因三，段尾警醒。</p>'\n+ '<p>争议话题（06 偶像崇拜、09 网络、13 毕业生选择、13 英二兼职、15 手机聚会、19 英二、20 英二手机阅读）：可正反论证，也可单方面论证重要性；需要正反时打开“争议话题”卡片。</p></div>'\n+ '<div class=\"h-sec\"><h3>七、常见失分点</h3>'\n+ '<p>① 静态图硬套 from…to… 年份；② 三句都用同一个动词副词；③ 增量忘记带单位（percentage points / units）；'\n+ '<p>④ 个人例子写成“马云、爱迪生”；⑤ 好处与 which 从句逻辑不匹配（健康用 quality of life，个人发展用 beneficial position）；⑥ 图画作文把 there be 当万能句。</p></div>';\n\n/* ---------------- 事件 ---------------- */\nfunction bind(){\n  $(\"#modes\").addEventListener(\"click\", function(e){\n    var b = e.target.closest(\".mode-btn\");\n    if(b) switchMode(b.getAttribute(\"data-mode\"));\n  });\n  $(\"#preset\").addEventListener(\"change\", function(e){\n    if(e.target.value) applyPreset(e.target.value);\n  });\n  $(\"#builder\").addEventListener(\"change\", function(e){\n    var node = e.target.closest(\".card\"); if(!node) return;\n    var cid = node.getAttribute(\"data-cid\");\n    var card = cardById(cid), st = state.cards[cid];\n    if(!card || !st) return;\n    if(e.target.getAttribute(\"data-sel\") === \"v\"){\n      pushSnap(); st.v = parseInt(e.target.value,10)||0; save(); refreshCard(cid); renderPreview();\n    } else if(e.target.getAttribute(\"data-sub\")){\n      pushSnap(); s   "bigB": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>大作文拼装台 · AI归来模板（27版）</title>\n<style>\n:root{\n  --bg:#0f1115; --panel:#171a21; --panel2:#1d2129; --panel3:#232833;\n  --line:#2a303c; --txt:#e7eaf0; --dim:#95a0b3; --dim2:#6d7889;\n  --acc:#5aa9ff; --acc-d:#22405f; --acc-t:#a9d1ff;\n  --warn:#f0b90b; --warn-d:#3a2f0a;\n  --ok:#3ddc97; --pink:#ff7ba8;\n  --r:10px;\n}\n*{box-sizing:border-box}\nhtml,body{margin:0;padding:0}\nbody{\n  background:var(--bg); color:var(--txt);\n  font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",\"PingFang SC\",\"Hiragino Sans GB\",\"Microsoft YaHei\",sans-serif;\n  font-size:13.5px; line-height:1.65; -webkit-font-smoothing:antialiased;\n}\nbutton,select,input,textarea{font-family:inherit;font-size:inherit;color:inherit}\n::-webkit-scrollbar{width:10px;height:10px}\n::-webkit-scrollbar-thumb{background:#2b323f;border-radius:6px;border:2px solid var(--bg)}\n::-webkit-scrollbar-track{background:transparent}\n\n/* ---------- 顶栏 ---------- */\n.top{\n  position:sticky; top:0; z-index:60;\n  background:rgba(15,17,21,.92); backdrop-filter:blur(10px);\n  border-bottom:1px solid var(--line);\n  padding:10px 18px 9px;\n}\n.top .r1{display:flex;align-items:center;gap:14px;flex-wrap:wrap}\n.brand{font-weight:700;letter-spacing:.4px;font-size:14.5px;display:flex;align-items:baseline;gap:8px}\n.brand em{font-style:normal;color:var(--dim2);font-weight:400;font-size:11.5px}\n.spacer{flex:1}\n.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}\n.seg button{\n  background:none;border:0;padding:5px 11px;border-radius:6px;cursor:pointer;\n  color:var(--dim);font-size:12.5px;transition:.15s;white-space:nowrap;\n}\n.seg button:hover{color:var(--txt);background:#252b36}\n.seg button.on{background:var(--acc-d);color:var(--acc-t);box-shadow:inset 0 0 0 1px #2f5680}\n.sel{\n  background:var(--panel2);border:1px solid var(--line);border-radius:8px;\n  padding:6px 9px;color:var(--txt);cursor:pointer;max-width:300px;\n}\n.sel:focus{outline:none;border-color:#3c5a7d}\n.btn{\n  background:var(--panel2);border:1px solid var(--line);border-radius:8px;\n  padding:6px 11px;cursor:pointer;color:var(--dim);transition:.15s;white-space:nowrap;\n}\n.btn:hover{color:var(--txt);border-color:#3a4351}\n.btn:disabled{opacity:.38;cursor:not-allowed}\n.btn.pri{background:var(--acc-d);border-color:#2f5680;color:var(--acc-t)}\n.btn.pri:hover{background:#274c73}\n.r2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}\n.tg{\n  display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;\n  background:var(--panel2);border:1px solid var(--line);border-radius:20px;\n  padding:4px 11px 4px 8px;font-size:12px;color:var(--dim);transition:.15s;\n}\n.tg:hover{border-color:#3a4351;color:var(--txt)}\n.tg.on{background:rgba(90,169,255,.12);border-color:#3a5c80;color:var(--acc-t)}\n.tg i{width:8px;height:8px;border-radius:50%;background:#3d4655;display:block;transition:.2s}\n.tg.on i{background:var(--acc);box-shadow:0 0 8px rgba(90,169,255,.65)}\n.hint{font-size:11.5px;color:var(--dim2)}\n.hint b{color:var(--dim);font-weight:600}\n\n/* ---------- 主区 ---------- */\n.cols{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:0;align-items:start}\n.builder{padding:16px 16px 90px 18px;min-width:0}\n.preview{\n  position:sticky;top:96px;height:calc(100vh - 96px);\n  border-left:1px solid var(--line);background:#12151a;\n  display:flex;flex-direction:column;min-width:0;\n}\n.pv-head{\n  display:flex;align-items:center;gap:8px;padding:10px 14px;\n  border-bottom:1px solid var(--line);flex-wrap:wrap;\n}\n.pv-head .t{font-weight:600;font-size:12.5px;color:var(--dim)}\n.pv-body{overflow:auto;padding:14px 16px 40px;flex:1}\n.pv-foot{border-top:1px solid var(--line);padding:8px 14px;display:flex;gap:12px;align-items:center;font-size:11.5px;color:var(--dim2)}\n\n/* 卡片 */\n.card{\n  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);\n  padding:9px 12px 11px;margin-bottom:9px;transition:border-color .15s;\n}\n.card:hover{border-color:#333b49}\n.card.off{opacity:.5}\n.card-h{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}\n.card-t{font-size:11.5px;color:var(--acc);font-weight:700;letter-spacing:.3px;white-space:nowrap}\n.card-n{font-size:11px;color:var(--dim2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.mini{\n  background:none;border:1px solid var(--line);border-radius:6px;padding:1px 7px;\n  font-size:11px;color:var(--dim2);cursor:pointer\n}\n.mini:hover{color:var(--pink);border-color:#5a3346}\n.mini.on{color:var(--warn);border-color:var(--warn-d);background:var(--warn-d)}\n.card select.sel{font-size:12px;padding:3px 6px;max-width:100%}\n.sent{\n  font-family:Georgia,\"Times New Roman\",\"Songti SC\",serif;\n  font-size:15px;line-height:1.85;color:#dde3ee;\n}\n.sent .punc{color:var(--dim2)}\n.zh{\n  font-size:12px;color:var(--dim2);margin-top:5px;line-height:1.7;\n  border-left:2px solid #2c3442;padding-left:8px;\n}\n.note{font-size:11.5px;color:#8a7b52;margin-top:5px}\n.note b{color:var(--warn);font-weight:600}\n\n/* 槽位 */\n.slot{\n  background:none;border:0;\n  border-bottom:1.5px dashed #5a6478;color:var(--acc-t);\n  padding:0 2px;margin:0 1px;cursor:pointer;border-radius:3px 3px 0 0;\n  transition:.12s;font:inherit;\n}\n.slot:hover{background:rgba(90,169,255,.16)}\n.slot.empty{color:var(--warn);border-bottom-color:var(--warn);background:rgba(240,185,11,.09)}\n.slot.empty:hover{background:rgba(240,185,11,.2)}\n.slot.act{background:rgba(90,169,255,.28);box-shadow:0 0 0 2px rgba(90,169,255,.28)}\n\n/* 预览 */\n.pv-p{margin-bottom:15px}\n.pv-p h4{\n  margin:0 0 6px;font-size:11px;color:var(--dim2);font-weight:600;\n  letter-spacing:1.2px;text-transform:uppercase;\n}\n.pv-en{\n  font-family:Georgia,\"Times New Roman\",\"Songti SC\",serif;\n  font-size:15.5px;line-height:1.95;color:#e9eef7;white-space:pre-wrap;word-break:break-word;\n}\n.pv-en .ph{color:var(--warn)}\n.pv-zh{font-size:12.5px;color:#8b95a7;line-height:1.8;margin-top:6px;white-space:pre-wrap}\n.pv-empty{color:var(--dim2);font-size:12.5px}\n\n/* 槽位面板 */\n.panel{\n  position:fixed;right:22px;bottom:22px;width:430px;max-height:64vh;\n  background:var(--panel3);border:1px solid #3a4352;\n  border-radius:14px;box-shadow:0 18px 60px rgba(0,0,0,.62);\n  display:flex;flex-direction:column;z-index:200;overflow:hidden;\n}\n.panel[hidden]{display:none}\n.pn-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}\n.pn-h .tt{font-weight:700;font-size:13px}\n.pn-h .lab{font-size:11px;color:var(--acc);background:var(--acc-d);padding:1px 7px;border-radius:20px}\n.pn-x{margin-left:auto;background:none;border:0;color:var(--dim2);cursor:pointer;font-size:17px;line-height:1;padding:2px 4px}\n.pn-x:hover{color:var(--pink)}\n.pn-s{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;gap:6px}\n.pn-s input{\n  flex:1;background:var(--bg);border:1px solid var(--line);border-radius:7px;\n  padding:6px 9px;outline:none;min-width:0;\n}\n.pn-s input:focus{border-color:#3c5a7d}\n.pn-list{overflow:auto;padding:6px}\n.op{\n  display:block;width:100%;text-align:left;background:none;border:1px solid transparent;\n  border-radius:8px;padding:6px 9px;cursor:pointer;margin-bottom:2px;\n}\n.op:hover{background:#2a313d;border-color:#3a4352}\n.op.on{background:rgba(90,169,255,.13);border-color:#39557a}\n.op .e{font-family:Georgia,\"Times New Roman\",serif;font-size:13.5px;color:#dfe6f2;line-height:1.5}\n.op .z{font-size:11px;color:var(--dim2);margin-top:1px}\n.op .g{font-size:10.5px;color:#7f8fa6;margin-top:2px}\n.op .g::before{content:\"▸ \";color:#4d5a6d}\n.pn-f{padding:7px 12px;border-top:1px solid var(--line);font-size:11px;color:var(--dim2);display:flex;gap:8px;align-items:center}\n\n.toast{\n  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);\n  background:#2b3442;border:1px solid #3f4a5c;color:#e7eaf0;padding:8px 16px;border-radius:20px;\n  font-size:12.5px;opacity:0;transition:.22s;pointer-events:none;z-index:300;\n}\n.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}\n@media (max-width:1080px){\n  .cols{grid-template-columns:1fr}\n  .preview{position:static;height:auto;border-left:0;border-top:1px solid var(--line)}\n  .panel{right:8px;left:8px;width:auto}\n}\n</style>\n</head>\n<body>\n<div class=\"top\">\n  <div class=\"r1\">\n    <div class=\"brand\">大作文拼装台 <em>AI 归来模板 · 27 版 · 英一英二通用</em></div>\n    <div class=\"spacer\"></div>\n    <div class=\"seg\" id=\"typeSeg\">\n      <button data-type=\"chart\">图表作文</button>\n      <button data-type=\"picture\">图画作文</button>\n      <button data-type=\"text\">文字作文</button>\n    </div>\n    <select class=\"sel\" id=\"presetSel\" title=\"载入讲义真题预设\"></select>\n    <button class=\"btn\" id=\"undoBtn\" title=\"撤销上一步结构改动\">↶ 撤销</button>\n    <button class=\"btn\" id=\"clearBtn\">清空</button>\n  </div>\n  <div class=\"r2\">\n    <div class=\"seg\" id=\"sceneSeg\"></div>\n    <div class=\"spacer\"></div>\n    <div class=\"tg on\" id=\"tgBi\"><i></i>中英对照</div>\n    <div class=\"tg\" id=\"tgExam\"><i></i>考场精简</div>\n    <div class=\"tg\" id=\"tgAnno\"><i></i>讲义标注</div>\n    <div class=\"tg\" id=\"tgCliche\"><i></i>升级前对照</div>\n  </div>\n</div>\n\n<div class=\"cols\">\n  <section class=\"builder\" id=\"builder\"></section>\n  <aside class=\"preview\">\n    <div class=\"pv-head\">\n      <span class=\"t\">全文预览</span>\n      <span class=\"hint\" id=\"pvMeta\"></span>\n      <div class=\"spacer\"></div>\n      <button class=\"btn\" id=\"copyBtn\">复制全文</button>\n      <button class=\"btn\" id=\"copyEnBtn\">只复制英文</button>\n    </div>\n    <div class=\"pv-body\" id=\"pvBody\"></div>\n    <div class=\"pv-foot\">\n      <span id=\"wc\">0 词</span>\n      <span>·</span>\n      <span id=\"est\">约 0 分钟</span>\n      <span>·</span>\n      <span>【】为未填槽位，点击左侧直接选取</span>\n    </div>\n  </aside>\n</div>\n\n<div class=\"panel\" id=\"panel\" hidden>\n  <div class=\"pn-h\">\n    <span class=\"tt\" id=\"pnTitle\">词库</span>\n    <span class=\"lab\" id=\"pnLab\"></span>\n    <button class=\"pn-x\" id=\"pnClose\">×</button>\n  </div>\n  <div class=\"pn-s\">\n    <input id=\"pnInput\" placeholder=\"手输自定义内容，回车生效…\" autocomplete=\"off\">\n    <button class=\"btn\" id=\"pnSet\">填入</button>\n    <button class=\"btn\" id=\"pnClr\">清空</button>\n  </div>\n  <div class=\"pn-list\" id=\"pnList\"></div>\n  <div class=\"pn-f\"><span id=\"pnCount\"></span></div>\n</div>\n<div class=\"toast\" id=\"toast\"></div>\n<script>\n(function(){\n\"use strict\";\n/* ============================================================\r\n   0. 紧凑列表解析： en|zh|标签|pl\r\n   ============================================================ */\r\nfunction L(txt){\r\n  var out=[], tag='';\r\n  txt.split('\\n').forEach(function(line){\r\n    line=line.replace(/\\s+$/,'');\r\n    if(!line || /^\\s*$/.test(line)) return;\r\n    if(line.charAt(0)==='#'){\r\n      var m=line.match(/^#\\s*(.*)$/); tag=m?m[1]:''; return;\r\n    }\r\n    var p=line.split('|');\r\n    var o={ en:p[0].replace(/^\\s+|\\s+$/g,''),\r\n            zh:(p[1]||'').replace(/^\\s+|\\s+$/g,''),\r\n            tag:(p[2]||tag||'').replace(/^\\s+|\\s+$/g,'') };\r\n    if((p[3]||'').replace(/\\s/g,'')==='pl') o.pl=true;\r\n    out.push(o);\r\n  });\r\n  return out;\r\n}\r\n\r\n/* ============================================================\r\n   1. 词库\r\n   ============================================================ */\r\nvar BANKS = {};\r\n\r\n/* ---- 图表类型 ---- */\r\nBANKS.chartWord = L(`\r\nline chart|折线图|2023英二，动态趋势\r\nbar chart|柱状图|2019英二、2026英二，静态对比\r\npie chart|饼状图|2026英一左图，占比\r\ntable|表格|2025英一，多列多行\r\nchart|图表|不确定图型时的万能说法\r\n`);\r\n\r\n/* ---- 主题词（实体 / 抽象） ---- */\r\nBANKS.theme = L(`\r\n#动态·实体（配 develop / expand）\r\nthe volume of exp c'},\r\n  chartDesc:{label:'图表描述',bank:'chartDesc'},\r\n\r\n  impAdj:{label:'强调形容词',bank:'impAdj'},\r\n  probWord:{label:'指代名词',bank:'probWord'},\r\n  agent:{label:'实施方',bank:'agent'},\r\n\r\n  field:{label:'领域',bank:'field'},\r\n  worry:{label:'担忧',bank:'worry'},\r\n  appos2:{label:'同位语',bank:'appos2'},\r\n  opt1:{label:'选项一',bank:'opt1'},\r\n  opt2:{label:'选项二',bank:'opt2'},\r\n  view:{label:'作者观点',bank:'view'},\r\n  butPart:{label:'补充看法',bank:'butPart'},\r\n\r\n  reasonWord:{label:'原因名词',bank:'reason'},\r\n  explainV:{label:'解释动词',bank:'explain'},\r\n  ideaWord:{label:'观点名词',bank:'ideaWord'},\r\n  lead:{label:'引出例子的说法',bank:'lead'},\r\n  exSubject:{label:'例子主体',bank:'exSubject'},\r\n  appos:{label:'同位语',bank:'appos'},\r\n  vbPhrase:{label:'现状短语',bank:'vbPhrase'},\r\n  whichClause:{label:'结果从句',bank:'whichClause'},\r\n  step4:{label:'第四步衔接',bank:'step4'},\r\n  result:{label:'结果句',bank:'result'},\r\n  believeV:{label:'观点动词',bank:'believeV'},\r\n  providePhrase:{label:'好处短语',bank:'providePhrase'},\r\n  whichPhrase:{label:'which 从句',bank:'whichPhrase'},\r\n  clauseLead:{label:'从句引导',bank:'clauseLead'},\r\n  rolePhrase:{label:'作用短语',bank:'rolePhrase'},\r\n  linkPhrase:{label:'关联短语',bank:'linkPhrase'},\r\n  aspect:{label:'某方面',bank:'aspect'},\r\n  aspect2:{label:'某方面②',bank:'aspect'},\r\n  v1:{label:'动词①',bank:'v1'},\r\n  v2:{label:'动词②',bank:'v2'},\r\n  act:{label:'行为',bank:'act'},\r\n  aItem:{label:'A（主推）',bank:'aItem'},\r\n  bItem:{label:'B（对比）',bank:'bItem'},\r\n  smallGain:{label:'小方面',bank:'smallGain'},\r\n  bigGain:{label:'大方面',bank:'bigGain'},\r\n  bigGainIng:{label:'大方面（动名词）',bank:'bigGain'},\r\n  met:{label:'比喻对象',bank:'lighthouse'},\r\n\r\n  opener:{label:'开头语',bank:'opener'},\r\n  negWord:{label:'否定词',bank:'negWord'},\r\n  action:{label:'动作',bank:'action'},\r\n  trendWord:{label:'名词',bank:'trendWord'},\r\n  sceneWord:{label:'名词',bank:'sceneWord'},\r\n  govMeasure:{label:'政府举措',bank:'govMeasure'},\r\n  awareness:{label:'意识',bank:'awareness'},\r\n  link:{label:'衔接词',bank:'link'},\r\n  consequence:{label:'不利后果',bank:'consequence'},\r\n  Actor:{label:'实施方A',bank:'Actor'},\r\n  Btheme:{label:'主题B',bank:'Btheme'},\r\n  Cactor:{label:'实施方C',bank:'Cactor'},\r\n  Dtheme:{label:'主题D',bank:'Dtheme'},\r\n  viewTopic:{label:'趋势/现象',bank:'viewTopic'}\r\n};\r\n\r\n/* 补充词库 */\r\nBANKS.qty = L(`\r\na host of|大量的|替换 many\r\ninnumerable|无数的|替换 many\r\ncountless|数不清的|替换 many\r\na variety of|各种各样的|替换 many\r\nplenty of|很多|2024英一原句\r\nabundant|充足的|替换 many\r\nadequate|足够的|替换 many\r\nsufficient|充分的|替换 many\r\n`);\r\nBANKS.reason = L(`\r\nreasons|原因|最常用\r\nfactors|因素|同义替换\r\ncauses|成因|同义替换\r\n`);\r\nBANKS.explain = L(`\r\nexplain|解释|最常用\r\naccount for|解释|同义替换\r\ncontribute to|促成|同义替换\r\ngive rise to|引起|同义替换\r\n`);\r\nBANKS.ideaWord = L(`\r\nidea|观点|最常用\r\nstandpoint|立场|同义替换\r\nperspective|视角|同义替换\r\nviewpoint|观点|同义替换\r\nopinion|看法|同义替换\r\n`);\r\nBANKS.leftAct = L(`\r\nthe girl in the left picture is fully focused on her homework, thinking that she will feel relieved when she finishes her work|左图中的女孩全神贯注做作业，心想完成任务就会轻松|2020英一\r\nthe girl in the left picture, sitting in front of the desk, is fully focused on her homework and says that she will feel relieved when she finishes her work|左图中的女孩坐在书桌前全神贯注做作业，说完成任务就会轻松|2020英一（升级版）\r\n`);\r\nBANKS.rightAct = L(`\r\nthe boy in the right picture is lying on the sofa, telling himself that he will not start until the deadline|右图中的男孩躺在沙发上，告诉自己要到最后一刻才开始|2020英一\r\nthe boy lying on the sofa in the right picture says that he will not start until the last minute|右图躺在沙发上的男孩说要到最后一刻才开始|2020英一（升级版）\r\n`);\r\nBANKS.leftAct2 = L(`\r\nis reading quietly|安静地读书|万能\r\nis working diligently|勤奋工作|万能\r\nis exercising|锻炼身体|2018选课\r\n`);\r\nBANKS.rightAct2 = L(`\r\nis playing on his phone|在玩手机|对比场景\r\nis sleeping|在睡觉|对比场景\r\nis idling away his time|在虚度时光|对比场景\r\n`);\r\nBANKS.picDesc = L(`\r\nseveral urban residents are exercising in a park and a youngster says that the new park is fantastic|几位城市居民在公园锻炼，一个年轻人说新公园棒极了|2024英一\r\ntwo from {y1} to {y2}, among which the rise in {item1} was the most striking.',\r\n    '上方{chartWord}展示了{y1}至{y2}年间{theme}的变化，其中{item1}的上升最为显著。'),\r\n  V('c2-2','待选2 · Divergent + with','动态·多方向｜书面感强，with 复合结构',\r\n    '{theme} experienced divergent trends from {y1} to {y2}, with {item1} rising most sharply.',\r\n    '{theme}在{y1}至{y2}年间经历了分化性的趋势，其中{item1}上升最为剧烈。'),\r\n  V('c2-3','待选3 · 状语式 + 对比','动态·多方向｜一句写尽升降。注：变量有三个时只写对比最鲜明的两个，第三个留给细节句',\r\n    'As reflected in the {chartWord}, {theme} moved in opposite directions from {y1} to {y2}, {item1} rising while {item2} falling.',\r\n    '如图中数据所示，{theme}在{y1}至{y2}年间朝不同方向变化，{item1}上升而{item2}下降。'),\r\n  V('c2-4','待选4 · 多变量同向','动态·多方向｜若多个变量走向相同，回到单方向的句子，主题词加 and 即可',\r\n    'The {chartWord} above illustrates the changes in {theme} and {theme2} from {y1} to {y2}, both of which rose {adv}.',\r\n    '上方{chartWord}展示了{y1}至{y2}年间{theme}与{theme2}的变化，二者均{adv}上升。')\r\n];\r\n\r\nS1.static = [\r\n  V('c3-1','待选1 · Distribution + with','静态图｜占比/格局首选，distribution 分布',\r\n    'The {chartWord} above presents the distribution of {theme} in {year}, with {item1} accounting for the largest share.',\r\n    '上方{chartWord}呈现了{year}年{theme}的分布，其中{item1}占比最高。'),\r\n  V('c3-2','待选2 · Dominance + with','静态图｜仅当第一项远高于其他项（断崖式领先）时使用，dominance 主导',\r\n    'The {chartWord} above highlights the dominance of {item1} in {theme}, with it overshadowing all other components.',\r\n    '上方{chartWord}突出了{item1}在{theme}中的主导地位，其远超其他各项。'),\r\n  V('c3-3','待选3 · Disparity + with','静态图｜各项差距明显时使用，disparity 差距；with + 宾语 + 现在分词',\r\n    'The {chartWord} above reveals a striking disparity in {theme}, with the proportions ranging from {vmin} to {vmax}.',\r\n    '上方{chartWord}揭示了{theme}中显著的差距，各项占比从{vmin}到{vmax}不等。')\r\n];\r\n\r\nS1.dual = [\r\n  V('c4-1','待选1 · While 并列','双图表（静静/动静/动动）｜一句话双图，最省字数',\r\n    'The chart on the left illustrates {theme1}, while the chart on the right presents {theme2}.',\r\n    '左侧的图展示了{theme1}，而右侧的图呈现了{theme2}。'),\r\n  V('c4-2','待选2 · As for 另起一句','双图表｜
