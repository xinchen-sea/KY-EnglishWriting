n    '两幅{pic}呈现出鲜明的对比：'),\r\n  V('q2-4','待选4 · 两幅图（倒装）','两幅图｜句子最长，适合字数不足',\r\n    'Depicted in the two {pic}s above is a contrast that strikes us as both familiar and thought-provoking:',\r\n    '上两幅{pic}描绘的是一种既熟悉又发人深省的对比：')\r\n];\r\n\r\nvar Q1 = [\r\n  V('g1-1','待选1 · 升级版 As is … depicted','讲义推荐：shown→depicted/portrayed，picture→cartoon/drawing，再加副词',\r\n    'As is {padv} {pverb} in the {pic} above,',\r\n    '如上图{padv}{pverb}，'),\r\n  V('g1-2','待选2 · thought-provoking scene','单图最常用，冒号后直接描述',\r\n    'The {pic} above presents us with a thought-provoking scene:',\r\n    '上面的{pic}向我们呈现了一个发人深省的场景：'),\r\n  V('g1-3','待选3 · Portrayed distinctively','倒装开头，句子显长',\r\n    'Portrayed distinctively in the {pic} above is a common scene:',\r\n    '画中清晰地描绘出一个常见的场景：'),\r\n  V('g1-4','待选4 · What is clearly conveyed','that 从句开头，后面直接接完整句',\r\n    'What is clearly conveyed in the {pic} is that',\r\n    '图片明确传达出的是'),\r\n  V('g1-5','待选5 · 熟悉又发人深省','双形容词，画面常见时用',\r\n    'Depicted in the {pic} above is a scene that strikes us as both familiar and thought-provoking:',\r\n    '图中描绘的是一个既熟悉又发人深省的场景：'),\r\n  V('g1-6','待选6 · there be 例外专用','2010 英一（文化火锅）这类“罗列型”图，用 socially symbolic scene 开头',\r\n    'The {pic} provides us with a socially symbolic scene:',\r\n    '这幅{pic}为我们提供了一个具有社会象征意义的场景：'),\r\n  V('g1-7','待选7 · 一图一表（叠加）','图画 + 图表：两者句式简单叠加，各描述一句',\r\n    'As is vividly depicted in the {pic} and clearly shown in the chart above, {picDesc}, and {chartDesc}.',\r\n    '如上图生动描绘且上方图表清晰所示，{picDesc}，并且{chartDesc}。'),\r\n  V('g1-8','待选8 · 一图一表（左图右表）','2024 英一原句结构，先图后表',\r\n    'The drawing on the left side provides us with a lively scene: {picDesc}. Referring to the statistics provided in the right chart, {chartDesc}.',\r\n    '左侧的图为我们提供了一个生动的场景：{picDesc}。参照右图提供的数据，{chartDesc}。'),\r\n  V('g1-9','待选9 · 一图一表（while 并列）','一句话双线，最省字数',\r\n    'The {pic} above depicts {picDesc}, while the chart below illustrates {chartDesc}.',\r\n    '上面的{pic}描绘了{picDesc}，而下方的图表说明了{chartDesc}。')\r\n];\r\n\r\nvar Q2 = [\r\n  V('d1','公式 · 环境+基本动作+主体','一幅图（非对话型）｜公式：环境 + 基本动作(do) + 主体，主要动作(doing)，with 细节',\r\n    '{env} {bverb} {subject}, {adjpair}, {mverb} {obj}, with {detail}.',\r\n    '{env}{bverb}{subject}，{adjpair}，{mverb}{obj}，{detail}。'),\r\n  V('d2','公式 · 省略修饰语','篇幅紧张时删掉 as well as 结构',\r\n    '{env} {bverb} {subject}, {mverb} {obj}, with {detail}.',\r\n    '{env}{bverb}{subject}，{mverb}{obj}，{detail}。'),\r\n  V('d3','公式 · 省略主要动作','画面没有明显动作（静物类）时用',\r\n    '{env} {bverb} {subject}, {adjpair}, with {detail}.',\r\n    '{env}{bverb}{subject}，{adjpair}，{detail}。'),\r\n  V('d4','例外 · there be 罗列','2010 英一｜图画元素太多、无单一主体时用；there be 稍平淡，可用 Appearing in… 改写',\r\n    'there are {many} cultural elements in the {hotpot}, such as {list}. Below the pot, a caption reads: \"{captionText}.\"',\r\n    '{hotpot}中有{many}文化元素，例如{list}。锅下面写着：“{captionText}”。'),\r\n  V('d5','公式 · 对话型（转述）','一幅图（对话型）｜推荐转述，直接翻译对话会显得低级',\r\n    '{env} {bverb} {subject}, {mverb} {obj}. {speakerA} argues that {sayA}. By contrast, {speakerB} maintains that {sayB}.',\r\n    '{env}{bverb}{subject}，{mverb}{obj}。{speakerA}认为{sayA}；相比之下，{speakerB}坚持认为{sayB}。'),\r\n  V('d6','公式 · 对话型（直述）','需要保留原话语气时用，引号内容须自己拼对',\r\n    '{env} {bverb} {subject}, {mverb} {obj}. {speakerA} says, \"{sayA}.\" By contrast, {speakerB} answers, \"{sayB}.\"',\r\n    '{env}{bverb}{subject}，{mverb}{obj}。{speakerA}说：“{sayA}。”相比之下，{speakerB}回答：“{sayB}。”'),\r\n  V('d7','公式 · 对话型（while 并列）','一句话收两人，最紧凑',\r\n    '{env} {bverb} {subject}, {mverb} {obj}. {speakerA} believes that {sayA}, while {speakerB} insists that {sayB}.',\r\n    '{env}{bverb}{subject}，{mverb}{obj}。{speakerA}认为{sayA}，而{speakerB}坚持认为{sayB}。'),\r\n  V('d8','公式 · 两幅图（thought-provoking）','两幅图｜左图主体 + 动作，However 转折，右图主体 + 动作',\r\n    '{leftAct}. However, {rightAct}.',\r\n    '{leftAct}。然而，{rightAct}。'),\r\n  V('d9','公式 · 两幅图（In the left picture）','两幅图｜句式最短，适合篇幅已够时',\r\n    'In the left {pic}, {leftSubj} {leftAct2}, whereas in the right {pic}, {rightSubj} {rightAct2}.',\r\n    '左图中，{leftSubj}{leftAct2}；而右图中，{rightSubj}{rightAct2}。'),\r\n  V('d10','公式 · 两幅图（sharp contrast）','两幅图｜强调对比，语气更重',\r\n    '{leftAct}. By contrast, {rightAct}.',\r\n    '{leftAct}。相比之下，{rightAct}。')\r\n];\r\n\r\nvar Q3 = [\r\n  V('cap1','待选1 · there is a caption','可选句｜图画下方有文字且该文字不是主题词时，才描述它',\r\n    'Below the {pic}, there is a caption which reads: \"{captionText}.\"',\r\n    '{pic}下方有一句说明文字：“{captionText}”。'),\r\n  V('cap2','待选2 · the caption beneath','同上，句式更短',\r\n    'The caption beneath the {pic} reads: \"{captionText}.\"',\r\n    '{pic}下方的文字是：“{captionText}”。'),\r\n  V('cap3','待选3 · a profound statement','同上，语气最重',\r\n    'A profound statement is placed below the {pic}: \"{captionText}.\"',\r\n    '{pic}下方写着一句意味深长的话：“{captionText}”。')\r\n];\r\n\r\nvar Q4 = [\r\n  V('h1','待选1 · The purpose of the drawing','讲义原句升级：us→具体受众，purpose→implication / symbolic meaning',\r\n    'The {purposeWord} of the {pic} is to remind {audience} that',\r\n    '这幅{pic}的{purposeWord}是提醒{audience}'),\r\n  V('h2','待选1b · aims to remind','删掉 The purpose of 后用 aims to，避免语义重复',\r\n    'The {pic} {aimVerb} to remind {audience} that',\r\n    '这幅{pic}{aimVerb}提醒{audience}'),\r\n  V('h3','待选2 · Simple as the drawing is','让步状语从句开头，书面感强（2011 英一原句）',\r\n    'Simple as the {pic} is, it conveys a truth that',\r\n    '这幅{pic}虽然简单，却蕴含一个真理：'),\r\n  V('h4','待选3 · undoubtedly emphasizes','语气肯定，适合品质类话题',\r\n    'The {pic}, undoubtedly, emphasizes the core idea that',\r\n    '毫无疑问，这幅{pic}强调了这样的核心观点：'),\r\n  V('h5','待选4 · What the cartoon mirrors','主语从句 + 现象，适合社会现象类',\r\n    'What the {pic} above mirrors is a thought-provoking phenomenon that',\r\n    '上图所反映的是一个发人深省的现象：'),\r\n  V('h6','待选5 · drawing and chart','一图一表专用，2024 英一原句',\r\n    'The {pic} and the chart aim to remind us that',\r\n    '这幅{pic}和图表都旨在提醒我们'),\r\n  V('h7','待选6 · Without a doubt','一图一表专用，语气更强',\r\n    'Without a doubt, the {pic} and the chart emphasize the truth that',\r\n    '毫无疑问，图和表都强调了一个事实：')\r\n];\r\n\r\nvar Q5 = [\r\n  V('m1','方案1 · so … that','中心思想首选公式；“主题词”要具体到事（信心匮乏/环境恶化/文化交流）',\r\n    '{theme} ~is~ so {impAdj} that the {probWord} deserves the highest level of attention and consideration.',\r\n    '{theme}如此{impAdj}，这一{probWord}值得最高程度的关注与思考。'),\r\n  V('m1b','方案1b · it deserves','probWord 省略时用 it，句子更短',\r\n    '{theme} ~is~ so {impAdj} that it deserves the highest level of attention and consideration.',\r\n    '{theme}如此{impAdj}，值得最高程度的关注与思考。'),\r\n  V('m2a','方案2 · utmost importance','被动语态，正式（2011 英一原句结构）',\r\n    'the utmost importance ought to be attached to {theme} by {agent}.',\r\n    '{agent}应当对{theme}给予高度重视。'),\r\n  V('m2b','方案2b · give the highest priority','主动语态，更直接',\r\n    '{agent} should give the highest priority to {theme}.',\r\n    '{agent}应当把{theme}放在首位。'),\r\n  V('m3','方案3 · great accomplishments','已经取得成就的话题（公园建设/环保），2024 英一原句',\r\n    'great accomplishments have been made in {theme} by {agent}.',\r\n    '{agent}在{theme}方面已经取得了巨大成就。'),\r\n  V('m4a','方案4 · at no time','双重否定 + 倒装，语气最强（2005 孝道原句）',\r\n    'at no time should {agent} underestimate the significance of {theme}.',\r\n    '{agent}在任何时候都不应低估{theme}的重要性。'),\r\n  V('m4b','方案4b · never be underestimated','被动，语气稳',\r\n    'the importance of {theme} should never be underestimated by {agent}.',\r\n    '{theme}的重要性绝不应被{agent}低估。'),\r\n  V('m4c','方案4c · cannot be overstated','“再强调也不过分”，高阶',\r\n    'the importance of {theme} cannot be overstated by {agent}.',\r\n    '{theme}的重要性无论怎样强调都不为过。'),\r\n  V('m5a','方案5 · 强调句型','It is … that …，突出主题词',\r\n    'it is {theme} that deserves greater attention.',\r\n    '正是{theme}值得更多关注。'),\r\n  V('m5b','方案5b · top priority','强调句 + 首要任务',\r\n    'it is {theme} that must be our top priority.',\r\n    '{theme}必须成为我们的首要任务。'),\r\n  V('m5c','方案5c · immediate attention','强调句 + 立即关注',\r\n    'it is {theme} that requires our immediate attention.',\r\n    '{theme}需要我们立即关注。')\r\n];\r\n\r\n/* ============================================================\r\n   6. 第一段：文字作文\r\n   ============================================================ */\r\nvar R1 = [\r\n  V('x1','待选1 · 改写现象','首选写法：同义词替换 + 高度概括 + 主动被动互换，别照抄原文',\r\n    'Nowadays, {theme} ~is~ vital in {field}. Many {people} are afraid of {worry}.',\r\n    '如今，{theme}在{field}中至关重要。许多{people}害怕{worry}。'),\r\n  V('x2','待选2 · It cannot be denied','改写不出来时用：先引出主题，再改写观点',\r\n    \"It cannot be denied that {theme} play~s~ a key role in people's work and life.\",\r\n    '不可否认，{theme}在人们的工作和生活中扮演着重要角色。'),\r\n  V('x3','待选3 · It is widely accepted','主题是某种态度/品质时用',\r\n    'It is widely accepted that {theme}, {appos2}, ~is~ the key element for individuals to achieve success.',\r\n    '人们普遍认为，{theme}——{appos2}——是个人取得成功的关键因素。'),\r\n  V('x4','待选4 · caused wide concern','主题是负面问题/现象时用',\r\n    'Nowadays, it is well-known that the problem of {theme} has caused wide concern.',\r\n    '如今，众所周知，{theme}的问题已经引起了广泛关注。'),\r\n  V('x5','待选5 · With the rapid advancement','时代背景开头，最百搭',\r\n    'With the rapid advancement of society and technology, {theme} ~has~ become a common phenomenon in our daily lives.',\r\n    '随着社会和科技的快速进步，{theme}已成为我们日常生活中一个普遍现象。'),\r\n  V('x6','待选6 · whether to A or B','材料是“二选一”争议时用',\r\n    'Currently, whether to {opt1} or {opt2} has become a hot topic among people, especially among the young, and heated discussions are on the way.',\r\n    '目前，是{opt1}还是{opt2}已成为人们的热门话题，尤其在年轻人中，激烈的讨论即将到来。')\r\n];\r\n\r\nvar R2 = [\r\n  V('v1','待选1 · The author believes','改写观点：只改写容易改写的那一句，作者观点多为同义句',\r\n    'The author believes that {view}.',\r\n    '作者认为，{view}。'),\r\n  V('v2','待选2 · Therefore, the author holds','带因果，衔接更顺',\r\n    'Therefore, the author holds that {view}.',\r\n    '因此，作者认为，{view}。'),\r\n  V('v3','待选3 · According to the author','最简洁',\r\n    'According to the author, {view}.',\r\n    '根据作者的观点，{view}。'),\r\n  V('v4','待选4 · In the opinion of the author','稍正式',\r\n    'In the opinion of the author, {view}.',\r\n    '在作者看来，{view}。')\r\n];\r\n\r\nvar R3 = [\r\n  V('a1','强烈同意','题干要求“说明是否同意”，这句必须有',\r\n    \"I fully agree with the author's viewpoint.\",\r\n    '我完全同意作者的观点。'),\r\n  V('a2','强烈反对','材料观点明显偏颇时用',\r\n    \"I strongly disagree with the author's opinion.\",\r\n    '我强烈反对作者的观点。'),\r\n  V('a3','部分同意','留一半余地，最好写',\r\n    \"I share the author's view to a large extent, but I also believe that {butPart}.\",\r\n    '我在很大程度上同意作者的观点，但我也认为{butPart}。')\r\n];\r\n/* ---- 第二/三段补充词库 ---- */\r\nBANKS.bigGainIng = L(`\r\npromoting all-round development|促进全面发展|2019英二\r\npromoting their physical and mental well-being|促进他们的身心健康|2024英一\r\nrelieving the burden on families and caregivers|减轻家庭与照护者的负担|2026英一\r\npromoting their all-round development|促进他们的全面发展|2026英二\r\nexpanding their horizons|开阔他们的视野|2018英一\r\n`);\r\nBANKS.actGer = L(`\r\nprotecting the environment|保护环境|2011英一\r\nsaving resources|节约资源|环保类\r\ncultivating good reading habits|培养良好阅读习惯|阅读类\r\nrespecting the elderly|尊敬老人|养老类\r\n`);\r\nBANKS.balA = L(`\r\neconomic development|经济发展|宏观\r\nchildren's physical exercise|儿童体育锻炼|2026英二\r\nwork|工作|个人\r\ntechnological progress|技术进步|科技\r\n`);\r\nBANKS.balB = L(`\r\nenvironmental protection|环境保护|宏观\r\nintellectual development|智力发展|2026英二\r\nlife|生活|个人\r\nhumanistic care|人文关怀|科技\r\n`);\r\nBANKS.goal = L(`\r\nsolve the problem|解决问题|万能\r\nhave a better life|拥有更好的生活|生活类\r\nadvance social progress|推动社会进步|宏观\r\npromote the healthy development of elderly-care robots|促进养老机器人健康发展|2026英一\r\n`);\r\nBANKS.predDo = L(`\r\nchoose to own smart home appliances|选择拥有智能家电|2025英一\r\npursue further study|选择继续深造|2019英二\r\ntake part in outdoor activities|参加户外活动|2026英二\r\n`);\r\nBANKS.predDir = L(`\r\nincrease|增加|上升\r\ndecline|减少|下降\r\n`);\r\nBANKS.predDo2 = L(`\r\nattach importance to {theme}|重视主题词|万能（可再改）\r\nchoose a healthy lifestyle|选择健康生活方式|2023英二\r\n`);\r\nBANKS.solA = L(`\r\nsetting rules based on scenic location|按景区位置制定规则|2011英一\r\nbuilding more elderly activity centers|建设更多老年活动中心|2025英二\r\nincreasing investment in infrastructure|增加基础设施投资|2024英一\r\n`);\r\nBANKS.solB = L(`\r\nraising public awareness|提升公众意识|2011英一\r\nfamily companionship|家庭陪伴|2025英二\r\nimproving the quality of public services|提升公共服务质量|2024英一\r\n`);\r\n\r\n/* ============================================================\r\n   7. 第二段\r\n   ============================================================ */\r\nvar S4 = [\r\n  V('t21','待选1 · 升级版 There are','讲义升级前句的升级版：many→a host of/a variety of，reason→factor/cause，explain→account for',\r\n    'There are {many} {reasonWord} to {explainV} this {viewTopic}.',\r\n    '有{many}{reasonWord}可以{explainV}这一{viewTopic}。'),\r\n  V('t22','待选2 · plenty of causes','2024 英一第二段原句',\r\n    'There are plenty of causes accounting for the phenomenon in various aspects.',\r\n    '造成这一现象的原因是多方面的。'),\r\n  V('t23','待选3 · Three key reasons','点明“三个原因”，与下文三点严丝合缝',\r\n    'Three key reasons, from my perspective, account for this phenomenon.',\r\n    '在我看来，三个关键原因可以解释这一现象。'),\r\n  V('t24','待选4 · causes summarized','带主题词，针对性强',\r\n    'From my perspective, the causes of {theme} can be summarized as three main aspects.',\r\n    '在我看来，{theme}的成因可以归结为三个主要方面。'),\r\n  V('t25','待选5 · Several factors','最短最稳，任何题目都能用',\r\n    'Several factors contribute to this phenomenon.',\r\n    '几个因素促成了这一现象。'),\r\n  V('t26','待选6 · A variety of reasons','稍长，适合字数不足时',\r\n    'A variety of reasons can be cited to account for this phenomenon.',\r\n    '有很多原因可以用来解释这一现象。'),\r\n  V('t27','待选7 · combination of factors','图表作文专用，呼应“趋势”',\r\n    'A combination of factors has contributed to the tendency reflected in this chart.',\r\n    '多种因素共同促成了这张图表所反映的趋势。'),\r\n  V('t28','争议1 · pros and cons','争议话题（06偶像崇拜/09网络/13兼职/20手机阅读）专用',\r\n    'Every situation has its pros and cons, and this issue is not exempt.',\r\n    '每种情况都有其利弊，这个问题也不例外。'),\r\n  V('t29','争议2 · remains controversial','争议话题，一句点题',\r\n    'In fact, this phenomenon remains controversial.',\r\n    '事实上，这一现象仍然存在争议。'),\r\n  V('t2a','争议3 · opinions vary widely','争议话题，带主题词',\r\n    'When it comes to {theme}, opinions vary widely.',\r\n    '涉及{theme}时，意见分歧很大。')\r\n];\r\n\r\n/* ---- 第5/6/7句：原因分析（三个位置共用同一套方案） ---- */\r\nvar REASONS = [\r\n  V('e1','方案一 · 举例论证（带同位语）','个人路线｜四步组装：引出例子→短语写现状→which 从句写好处→换角度写结果',\r\n    '{lead}, {exSubject}, {appos}, {vbPhrase}, which {whichClause}. {step4}, {result}.',\r\n    '{lead}，{exSubject}——{appos}——{vbPhrase}，这{whichClause}。{step4}，{result}。'),\r\n  V('e2','方案一b · 省略同位语','例子主体是人名时用（Kevin / 我爷爷）',\r\n    '{lead}, {exSubject}, {vbPhrase}, which {whichClause}. {step4}, {result}.',\r\n    '{lead}，{exSubject}{vbPhrase}，这{whichClause}。{step4}，{result}。'),\r\n  V('e3','方案一c · 省略 which','篇幅紧张时，去掉结果从句',\r\n    '{lead}, {exSubject}, {appos}, {vbPhrase}. {step4}, {result}.',\r\n    '{lead}，{exSubject}——{appos}——{vbPhrase}。{step4}，{result}。'),\r\n  V('e4','方案二 · 宾语从句（群众路线）','公式万年不变，只换主题词和好处；believe 可换 maintain / hold the view / are convinced',\r\n    'The majority of {people} {believeV} that {theme} will {providePhrase}, which {whichPhrase}.',\r\n    '大多数{people}{believeV}，{theme}将{providePhrase}，这{whichPhrase}。'),\r\n  V('e5','方案二b · Most people','同上，主语更短',\r\n    'Most {people} {believeV} that {theme} will {providePhrase}, which {whichPhrase}.',\r\n    '大多数{people}{believeV}，{theme}将{providePhrase}，这{whichPhrase}。'),\r\n  V('e6','方案三 · 从句 + 作用短语','拉长句子用；引导语任选，重点在省略号后的“某方面”',\r\n    '{clauseLead} {theme} {rolePhrase} {aspect}.',\r\n    '{clauseLead}{theme}在{aspect}方面{rolePhrase}。'),\r\n  V('e7','方案三b · 某方面依赖主题词','主谓要一致：aspect 作主语时谓语用复数（are）',\r\n    '{clauseLead} {aspect} ~is~ {linkPhrase} {theme}.',\r\n    '{clauseLead}{aspect}与{theme}密不可分。'),\r\n  V('e8','方案三c · 与某方面密不可分','2025 英一原句结构（inextricably linked to）',\r\n    '{clauseLead} {theme} ~is~ {linkPhrase} {aspect}.',\r\n    '{clauseLead}{theme}与{aspect}密不可分。'),\r\n  V('e9','方案四 · not only 倒装','Not only does 主题词…, but it also…；主语复数时自动变 do / they',\r\n    'Not only ~does~ {theme} {v1} {aspect}, but ~it~ also {v2} {aspect2}.',\r\n    '{theme}不仅能{v1}{aspect}，还{v2}{aspect2}。'),\r\n  V('e10','方案五 · 虚拟（个人层面）','扣帽子、上高度｜主将从现 → failed/would，三步变虚拟',\r\n    'If we ignored the importance of {theme}, we would never become a better version of ourselves.',\r\n    '如果我们忽视{theme}的重要性，我们就永远不会成为更好的自己。'),\r\n  V('e11','方案五b · 虚拟（社会层面）','段尾警醒，适用性最强，建议放在原因三',\r\n    'If everyone failed to {act}, our society would be confronted with an unpromising and fruitless future.',\r\n    '如果每个人都不去{act}，我们的社会将面临一个没有希望的未来。'),\r\n  V('e12','方案五c · 虚拟（国家层面）','最高规格，慎用，别扣太狠',\r\n    'If we underestimated the importance of {theme}, our nation would permanently lag behind in the new era of rapid development.',\r\n    '如果我们低估{theme}的重要性，我们的国家将在快速发展的新时代永远落后。'),\r\n  V('e13','方案五d · 虚拟（政府层面）','2024 英一原句：our cities would be confronted with…',\r\n    'If {agent} ignored the importance of {theme}, our cities would be confronted with an unpromising and fruitless future.',\r\n    '如果{agent}忽视{theme}的重要性，我们的城市将没有未来。'),\r\n  V('e14','方案五e · 虚拟（改写后半句）','后半句可自定义，避免千篇一律',\r\n    'If we failed to care for {people}, our society would become less compassionate and inclusive.',\r\n    '如果我们不能关爱{people}，我们的社会将变得缺乏同情心与包容性。'),\r\n  V('e15','方案五f · 虚拟（对象作主语）','儿童/老人等群体作主语，they 呼应',\r\n    'If {people} failed to {act}, they would never become a better version of themselves.',\r\n    '如果{people}不去{act}，他们将永远无法成为更好的自己。'),\r\n  V('e16','方案六 · 对比（so as to）','没有对比就创造对比：A 主推，B 陪衬',\r\n    'Compared with {bItem}, {aItem} can {smallGain}, so as to {bigGain}.',\r\n    '与{bItem}相比，{aItem}能{smallGain}，从而{bigGain}。'),\r\n  V('e17','方案六b · 对比（thereby）','推荐写法：去掉 which is，用分词作结果状语',\r\n    'Compared with {bItem}, {aItem} can {smallGain}, thereby {bigGainIng}.',\r\n    '与{bItem}相比，{aItem}能{smallGain}，从而{bigGainIng}。'),\r\n  V('e18','方案六c · 对比（the advantage lies in）','不写动作，直接给优势，句子短',\r\n    'In contrast to {bItem}, the advantage of {aItem} lies in {aspect}.',\r\n    '与{bItem}相比，{aItem}的优势在于{aspect}。'),\r\n  V('e19','方案七 · 明喻（灯塔）','心态态度类主题词适配：confidence / optimism / curiosity',\r\n    '{theme} ~is~ as important as a lighthouse, providing guidance in difficult times.',\r\n    '{theme}就像灯塔一样重要，在困难的时候为我们提供指引。'),\r\n  V('e20','方案七b · 明喻（指南针）','思  attitude','正反论证收尾：权衡利弊（2013 英二原句）',\r\n    'It is, therefore, imperative for us to adopt a discerning attitude, carefully weighing its merits against its demerits.',\r\n    '因此，我们必须采取一种有辨识力的态度，仔细权衡其利弊。')\r\n];\r\n\r\n/* ============================================================\r\n   8. 第三段\r\n   ============================================================ */\r\nvar S8 = [\r\n  V('s1','方案一 · enough attention','最稳的总结句；时态可换 has been paid（已发生）/ must be paid（应然）',\r\n    '{opener}, it is not difficult to draw the conclusion that enough attention must be paid to {theme} by {agent}.',\r\n    '{opener}，不难得出结论：{agent}必须对{theme}给予足够的重视。'),\r\n  V('s2','方案一b · bear in mind','特别适合意志品质类（坚持/永不放弃/终身学习）',\r\n    '{opener}, we should bear in mind that {theme} ~is~ of great importance to {aspect}.',\r\n    '{opener}，我们应牢记：{theme}对{aspect}极为重要。'),\r\n  V('s3','方案一c · not an option, but a necessity','文化传承/高质量生活类，2021/2023/2025 原句',\r\n    '{opener}, the discussion leads us to the realization that {theme} ~is~ not an option, but a necessity.',\r\n    '{opener}，讨论使我们认识到：{theme}不是一种选择，而是一种必要。'),\r\n  V('s4','方案一d · not a luxury, but a must','2026 英一原句，养老类',\r\n    '{opener}, the discussion leads us to the realization that {theme} ~is~ not a luxury, but a must.',\r\n    '{opener}，讨论使我们认识到：{theme}不是奢侈品，而是必需品。'),\r\n  V('s5','方案一e · integral part','互联网/手机/户外活动等“已成为一部分”的话题',\r\n    '{opener}, we are faced with the undeniable fact that {theme} ~has~ become an integral part of {aspect}.',\r\n    '{opener}，我们面临一个不可否认的事实：{theme}已成为{aspect}不可或缺的一部分。'),\r\n  V('s6','方案一f · increasingly popular','态度型图表，2026 英一原句',\r\n    '{opener}, we are faced with the undeniable fact that {theme} ~has~ become increasingly popular with the general public.',\r\n    '{opener}，我们面临一个不可否认的事实：{theme}已越来越受公众欢迎。'),\r\n  V('s7','方案二 · 否定词倒装','Never / On no account / Under no circumstances / By no means + 助动词 + 主谓宾',\r\n    '{opener}, {negWord} should we {action}.',\r\n    '{opener}，我们绝不应{action}。'),\r\n  V('s8','方案三 · |our|their|his|her|its|your)$/i;\r\n\r\nfunction isPlural(v){\r\n  if(!v) return false;\r\n  var s=String(v).replace(/\\([^)]*\\)/g,' ').replace(/【[^】]*】/g,' ').trim();\r\n  if(PL[s]) return true;\r\n  /* 中心词提取：the number of X / the elderly's participation in X 的单复数由 of/in 之前的中心词决定 */\r\n  var w0=s.split(/[\\s,;:]+/).filter(function(x){return x.length;});\r\n  for(var i=1;i<w0.length-1;i++){\r\n    if(PREP.test(w0[i].replace(/[^a-z]/gi,''))){\r\n      var head=w0.slice(0,i).join(' ');\r\n      var hw=head.split(' ').filter(function(x){return x.length;});\r\n      var hlast=(hw[hw.length-1]||'').toLowerCase().replace(/[^a-z']/g,'');\r\n      if(!hlast||DET.test(hlast)) break;\r\n      if(/^(a|an)$/i.test(hw[0])&&/^(number|variety|lot|range|series|great deal)$/i.test(hlast)) return true;\r\n      if(PL[head]) return true;\r\n      s=head; break;\r\n    }\r\n  }\r\n  if(/\\band\\b/.test(s)) return true;   /* 并列主语 A and B 视为复数 */\r\n  var w=s.split(/[\\s,;:]+/).filter(function(x){return x.length;});\r\n  if(!w.length) return false;\r\n  var last=w[w.length-1].toLowerCase().replace(/[^a-z']/g,'');\r\n  if(!last) return false;\r\n  if(IRR[last]!==undefined) return IRR[last];\r\n  if(/(ss|us|is|ics|sis)$/.test(last)) return false;\r\n  if(/[^s]s$/.test(last)) return true;\r\n  return false;\r\n}\r\n\r\nfunction agreeWord(kind,pl){\r\n  switch(kind){\r\n    case 'is': return pl?'are':'is';\r\n    case 'was': return pl?'were':'was';\r\n    case 'has': return pl?'have':'has';\r\n    case 'does': return pl?'do':'does';\r\n    case 'it': return pl?'they':'it';\r\n    case 'its': return pl?'their':'its';\r\n    case 'them': return pl?'them':'it';\r\n    case 'their': return pl?'their':'its';\r\n    default: return '';\r\n  }\r\n}\r\n\r\nfunction polish(s){\r\n  if(!s) return '';\r\n  s=s.replace(/\\s+/g,' ')\r\n     .replace(/\\s+([,.;:!?])/g,'$1')\r\n     .replace(/([,;:])(?=[A-Za-z])/g,'$1 ')\r\n     .replace(/\\(\\s+/g,'(').replace(/\\s+\\)/g,')')\r\n     .replace(/\\s+\"/g,' \"').replace(/\"\\s+/g,'\" ')\r\n     .replace(/\"\\s*\\./g,'.\"')\r\n     .replace(/\\s+'/g,\"'\")\r\n     .replace(/\\s+-\\s+/g,'-')\r\n     .trim();\r\n  s=s.replace(/, ([A-Z][a-z]+)/g,function(m,w){\r\n    return PROPER[w]?m:', '+w.toLowerCase();\r\n  });\r\n  s=s.replace(/, ([A-Z])(?![A-Za-z'’])/g,function(m,w){\r\n    return PROPER[w]?m:', '+w.toLowerCase();\r\n  });\r\n  s=s.replace(/(^|[.!?]\\s+)([a-z])/g,function(m,p,c){ return p+c.toUpperCase(); });\r\n  s=s.replace(/(^|[.!?]\\s+)(i)(?=[\\s',.])/g,function(m,p){ return p+'I'; });\r\n  return s.replace(/\\s+([,.;:!?])/g,'$1').replace(/\\s+/g,' ').trim();\r\n}\r\n\r\n/* ============================================================\r\n   14. 模板解析与渲染\r\n   ============================================================ */\r\nfunction tokenize(tpl){\r\n  var out=[],re=/\\{([A-Za-z0-9_]+)\\}|~([a-z]+)~/g,last=0,m;\r\n  while((m=re.exec(tpl))){\r\n    if(m.index>last) out.push({t:'s',v:tpl.slice(last,m.index)});\r\n    if(m[1]) out.push({t:'k',k:m[1]});\r\n    else out.push({t:'a',k:m[2]});\r\n    last=re.lastIndex;\r\n  }\r\n  if(last<tpl.length) out.push({t:'s',v:tpl.slice(last)});\r\n  return out;\r\n}\r\n\r\nfunction agreeRef(tokens,i){\r\n  var j;\r\n  for(j=i-1;j>=0;j--) if(tokens[j].t==='k') return tokens[j].k;\r\n  for(j=i+1;j<tokens.length;j++) if(tokens[j].t==='k') return tokens[j].k;\r\n  return null;\r\n}\r\n\r\nfunction esc(s){\r\n  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')\r\n    .replace(/>/g,'&gt;').replace(/\"/g,'&quot;');\r\n}\r\n\r\nfunction resolveMarks(str,pl){\r\n  return String(str)\r\n    .replace(/~(is|was|has|does|it|its|them|their)~/g,function(m,k){ return agreeWord(k,pl); })\r\n    .replace(/~s~/g,pl?'':'s')\r\n    .replace(/~es~/g,pl?'':'es');\r\n}\r\n\r\nfunction demark(str){\r\n  return String(str)\r\n    .replace(/~(is|was|has|does|it|its|them|their)~/g,function(m,k){\r\n      return {is:'is',was:'was',has:'has',does:'does',it:'it',its:'its',them:'them',their:'their'}[k]||'';\r\n    })\r\n    .replace(/~s~/g,'s').replace(/~es~/g,'es');\r\n}\r\n\r\nfunction zhUnit(s){\r\n  return String(s)\r\n    .replace(/(\\d[\\d.,]*)\\s*units?\\b/gi,'$1件')\r\n    .replace(/(\\d[\\d.,]*)\\s*hours?\\b/gi,'$1小时')\r\n    .replace(/(\\d[\\d.,]*)\\s*yuan\\b/gi,'$1元')\r\n    .replace(/(\\d[\\d.,]*)\\s*times\\b/gi,'$1倍')\r\n    .replace(/(\\d[\\d.,]*)\\s*percent\\b/gi,'$1%');\r\n}\r\n\r\nfunction zhSpace(s){\r\n  return String(s)\r\n    .replace(/([\\u4e00-\\u9fa5])([A-Za-z])/g,'$1 $2')\r\n    .replace(/([A-Za-z,])([\\u4e00-\\u9fa5])/g,'$1 $2');\r\n}\r\n\r\nfunction lastSlotBefore(tokens,i){\r\n  for(var j=i-1;j>=0;j--) if(tokens[j].t==='k') return tokens[j].k;\r\n  for(var k=i+1;k<tokens.length;k++) if(tokens[k].t==='k') return tokens[k].k;\r\n  return null;\r\n}\r\n\r\nfunction renderTpl(v,mode){\r\n  var tpl=(mode==='zh')?(v.zh||v.en):v.en;\r\n  var tokens=tokenize(tpl),out='',i,tk,def,val,lab,pl,ref;\r\n  for(i=0;i<tokens.length;i++){\r\n    tk=tokens[i];\r\n    if(tk.t==='s'){ out+=esc(tk.v); continue; }\r\n    if(tk.t==='a'){\r\n      if(mode==='zh'){ continue; }\r\n      if(tk.k==='it'||tk.k==='its'||tk.k==='them'||tk.k==='their'||tk.k==='v2'){\r\n        pl=isPlural(state.sl.theme||state.sl.theme1||'');\r\n      }else{\r\n        ref=lastSlotBefore(tokens,i);\r\n        pl=ref?isPlural(state.sl[ref]):false;\r\n      }\r\n      out+=esc(agreeWord(tk.k,pl));\r\n      continue;\r\n    }\r\n    def=SLOTDEF[tk.k]; lab=def?def.label:tk.k;\r\n    val=state.sl[tk.k]||''; var origVal=val;\r\n    if(tk.k==='v2'){\r\n      pl=isPlural(state.sl.theme||state.sl.theme1||'');\r\n    }else if(tk.k==='bverb'){\r\n      var nk=null,j;\r\n      for(j=i+1;j<tokens.length;j++) if(tokens[j].t==='k'){ nk=tokens[j].k; break; }\r\n      pl=nk?isPlural(state.sl[nk]):false;\r\n      if(val) val=val.replace(/s$/,'')+(pl?'':'s');\r\n    }else{\r\n      ref=lastSlotBefore(tokens,i);\r\n      pl=ref?isPlural(state.sl[ref]):false;\r\n    }\r\n    if(mode==='raw'){\r\n      out+=(val?resolveMarks(val,pl):('【'+lab+'】'));\r\n    } else if(mode==='zh'){\r\n      var zv=origVal?zhUnit(ZHOF[origVal]||ZHOF[demark(origVal)]||ZHOF[val]||demark(origVal)):('【'+lab+'】');\r\n      if(out&&/[A-Za-z0-9)]$/.test(out)&&/^[A-Za-z0-9(]/.test(zv)) out+=' ';\r\n      out+=esc(zhSpace(zv));\r\n    } else if(val){\r\n      out+='<button type=\"button\" class=\"slot\" data-k=\"'+esc(tk.k)+'\" title=\"点击替换：'+esc(lab)+'\">'+esc(resolveMarks(val,pl))+'</button>';\r\n    } else {\r\n      out+='<button type=\"button\" class=\"slot empty\" data-k=\"'+esc(tk.k)+'\" title=\"点击选取：'+esc(lab)+'\">【'+esc(lab)+'】</button>';\r\n    }\r\n  }\r\n  return out;\r\n}\r\n\r\nfunction getVariant(b){\r\n  var id=state.ch[b.id],i;\r\n  for(i=0;i<b.variants.length;i++) if(b.variants[i].id===id) return b.variants[i];\r\n  return b.variants[0];\r\n}\r\n\r\nfunction cardBlock(id){\r\n  var bs=structure(),i;\r\n  for(i=0;i<bs.length;i++) if(bs[i].id===id) return bs[i];\r\n  return {id:id};\r\n}\r\n\r\nfunction isOff(b){\r\n  var v=state.off[b.id];\r\n  if(v===true) return true;\r\n  if(v===false) return false;\r\n  return !!(b.defaultOff||(state.tg.exam&&b.optional));\r\n}\r\n\r\nfunction prefixHtml(b){\r\n  var p='';\r\n  if(b.ml!=null) p+='<span class=\"punc\">'+MEASURE_LINK[b.ml]+'</span> ';\r\n  if(b.ri!=null&&!getVariant(b).noConn){\r\n    var c=CONNS[state.conn][b.ri];\r\n    if(c) p+='<span class=\"punc\">'+c+'</span> ';\r\n  }\r\n  return p;\r\n}\r\nfunction prefixRaw(b){\r\n  var p='';\r\n  if(b.ml!=null) p+=MEASURE_LINK[b.ml]+' ';\r\n  if(b.ri!=null&&!getVariant(b).noConn){\r\n    var c=CONNS[state.conn][b.ri];\r\n    if(c) p+=c+' ';\r\n  }\r\n  return p;\r\n}\r\nfunction prefixZh(b){\r\n  var p='';\r\n  if(b.ml!=null) p+=(b.ml===0?'一方面，':'另一方面，');\r\n  if(b.ri!=null&&!getVariant(b).noConn){\r\n    var c=ZH_CONNS[state.conn][b.ri];\r\n    if(c) p+=c;\r\n  }\r\n  return p;\r\n}\r\n\r\n/* ============================================================\r\n   15. 渲染：编辑器\r\n   ============================================================ */\r\nfunction el(id){ return document.getElementById(id); }\r\n\r\nfunction renderTypeSeg(){\r\n  var box=el('typeSeg'),t,pairs=[['chart','图表作文'],['picture','图画作文'],['text','文字作文']];\r\n  box.innerHTML='';\r\n  pairs.forEach(function(p){\r\n    var b=document.createElement('button');\r\n    b.textContent=p[1]; b.setAttribute('data-type',p[0]);\r\n    if(state.type===p[0]) b.className='on';\r\n    box.appendChild(b);\r\n  });\r\n}\r\n\r\nfunction renderSceneSeg(){\r\n  var box=el('sceneSeg'),list=SCENES[state.type]||[];\r\n  box.innerHTML='';\r\n  if(state.type==='text'){\r\n    var sp=document.createElement('span');\r\n    sp.className='hint'; sp.innerHTML='文字作文：<b>文字改写 + 表明态度</b>，二、三段与图画图表通用';\r\n    box.appendChild(sp); return;\r\n  }\r\n  list.forEach(function(p){\r\n    var b=document.createElement('button');\r\n    b.textContent=p[1]; b.setAttribute('data-scene',p[0]);\r\n    if(state.scene===p[0]) b.className='on';\r\n    box.appendChild(b);\r\n  });\r\n}\r\n\r\nfunction renderPresetSel(){\r\n  var sel=el('presetSel');\r\n  sel.innerHTML='<option value=\"\">载入真题预设（'+PRESETS.length+' 篇）…</option>';\r\n  PRESETS.forEach(function(p){\r\n    var o=document.createElement('option');\r\n    o.value=p.id; o.textContent=p.name;\r\n    if(state.preset===p.id) o.selected=true;\r\n    sel.appendChild(o);\r\n  });\r\n}\r\n\r\nfunction renderBuilder(){\r\n  var box=el('builder');\r\n  box.innerHTML='';\r\n  var bs=structure(),i;\r\n  for(i=0;i<bs.length;i++){\r\n    var b=bs[i],v=getVariant(b);\r\n    var card=document.createElement('div');\r\n    card.className='card'+(isOff(b)?' off':'');\r\n    card.setAttribute('data-bid',b.id);\r\n\r\n    var head=document.createElement('div');\r\n    head.className='card-h';\r\n\r\n    var t=document.createElement('span');\r\n    t.className='card-t'; t.textContent=b.title;\r\n    head.appendChild(t);\r\n\r\n    var n=document.createElement('span');\r\n    n.className='card-n'; n.textContent=v.name+(b.hint?'　·　'+b.hint:'');\r\n    head.appendChild(n);\r\n\r\n    var tg=document.createElement('button');\r\n    tg.className='mini'+(isOff(b)?' on':'');\r\n    tg.textContent=isOff(b)?'已取消':'含';\r\n    tg.setAttribute('data-toggle',b.id);\r\n    tg.title='取消/恢复本句';\r\n    head.appendChild(tg);\r\n\r\n    var sel=document.createElement('select');\r\n    sel.className='sel';\r\n    sel.setAttribute('data-sel',b.id);\r\n    b.variants.forEach(function(vv){\r\n      var o=document.createElement('option');\r\n      o.value=vv.id; o.textContent=vv.name;\r\n      if(vv.id===v.id) o.selected=true;\r\n      sel.appendChild(o);\r\n    });\r\n    head.appendChild(sel);\r\n    card.appendChild(head);\r\n\r\n    var s=document.createElement('div');\r\n    s.className='sent';\r\n    s.innerHTML=prefixHtml(b)+renderTpl(v,'html');\r\n    card.appendChild(s);\r\n\r\n    if(state.tg.bi){\r\n      var z=document.createElement('div');\r\n      z.className='zh';\r\n      z.textContent=prefixZh(b)+renderTpl(v,'zh');\r\n      card.appendChild(z);\r\n    }\r\n    if(v.note){\r\n      var nt=document.createElement('div');\r\n      nt.className='note';\r\n      nt.textContent='讲义注：'+v.note;\r\n      card.appendChild(nt);\r\n    }\r\n    if(state.tg.cli&&CLICHE[b.id]){\r\n      var cl=document.createElement('div');\r\n      cl.className='note';\r\n      cl.textContent='升级前：'+CLICHE[b.id];\r\n      card.appendChild(cl);\r\n    }\r\n    box.appendChild(card);\r\n  }\r\n  renderConn();\r\n}\r\n\r\nfunction renderConn(){\r\n  var box=el('builder');\r\n  var head=box.querySelector('[data-connbar]');\r\n  if(head) head.parentNode.removeChild(head);\r\n  var bs=structure();\r\n  var hasReason=bs.some(function(b){return b.ri!=null;});\r\n  if(!hasReason) return;\r\n  var bar=document.createElement('div');\r\n  bar.className='card';\r\n  bar.setAttribute('data-connbar','1');\r\n  var h=document.createElement('div'); h.className='card-h';\r\n  var t=document.createElement('span'); t.className='card-t'; t.textContent='第二段连接词';\r\n  h.appendChild(t);\r\n  var n=document.createElement('span'); n.className='card-n';\r\n  n.textContent='三个原因用同一组连接词，结构立刻清晰；第四组只有两点';\r\n  h.appendChild(n);\r\n  var sel=document.createElement('select'); sel.className='sel'; sel.id='connSel';\r\n  var names=['Firstly / Secondly / Thirdly','To begin with / What\\'s more / Last but not least',\r\n             'To begin with / More importantly / Most importantly','For one thing / For another（两点）',\r\n             'First and foremost / Furthermore / Last but not least'];\r\n  names.forEach(function(nm,idx){\r\n    var o=document.createElement('option');\r\n    o.value=String(idx); o.textContent=nm;\r\n    if(idx===state.conn) o.selected=true;\r\n    sel.appendChild(o);\r\n  });\r\n  h.appendChild(sel);\r\n  bar.appendChild(h);\r\n  var hint=document.createElement('div');\r\n  hint.className='note';\r\n  hint.textContent='当前：'+CONNS[state.conn].filter(Boolean).join('  ');\r\n  bar.appendChild(hint);\r\n  box.insertBefore(bar,box.children[1]||null);\r\n}\r\n\r\n/* ============================================================\r\n   16. 渲染：预览\r\n   ============================================================ */\r\nfunction blockRaw(b){ return prefixRaw(b)+renderTpl(getVariant(b),'raw'); }\r\nfunction blockZh(b){ return prefixZh(b)+renderTpl(getVariant(b),'zh'); }\r\n\r\nfunction paragraph(n){\r\n  var en=[],zh=[],bs=structure(),i;\r\n  for(i=0;i<bs.length;i++){\r\n    var b=bs[i];\r\n    if(b.para!==n||isOff(b)) continue;\r\n    en.push(blockRaw(b));\r\n    zh.push(blockZh(b));\r\n  }\r\n  return {en:polish(en.join(' ')),zh:zhSpace(zh.join(''))};\r\n}\r\n\r\nfunction countWords(s){\r\n  var t=s.replace(/【[^】]*】/g,' ');\r\n  var m=t.match(/[A-Za-z][A-Za-z'-]*/g);\r\n  return m?m.length:0;\r\n}\r\n\r\nfunction renderPreview(){\r\n  var body=el('pvBody'),html='',total=0,names=['第一段','第二段','第三段'],i;\r\n  for(i=1;i<=3;i++){\r\n    var p=paragraph(i);\r\n    total+=countWords(p.en);\r\n    html+='<div class=\"pv-p\"><h4>'+names[i-1]+'</h4>';\r\n    if(!p.en){ html+='<div class=\"pv-empty\">（本段暂无内容）</div>'; }\r\n    else{\r\n      html+='<div class=\"pv-en\">'+esc(p.en).replace(/【[^】]*】/g,function(m){\r\n        return '<span class=\"ph\">'+m+'</span>';\r\n      })+'</div>';\r\n      if(state.tg.bi&&!state.tg.exam) html+='<div class=\"pv-zh\">'+esc(p.zh)+'</div>';\r\n    }\r\n    if(state.tg.anno){\r\n      var bs=structure(),list=[];\r\n      for(var k=0;k<bs.length;k++){\r\n        var b=bs[k];\r\n        if(b.para!==i||isOff(b)) continue;\r\n        list.push(b.title.replace(/第\\d+句 · /,'').replace(/（可选）|（.*?）/g,'')+'：'+getVariant(b).name);\r\n      }\r\n      html+='<div class=\"note\">套用标注 — '+esc(list.join(' ／ '))+'</div>';\r\n    }\r\n    html+='</div>';\r\n  }\r\n  body.innerHTML=html;\r\n  el('wc').textContent=total+' 词';\r\n  el('est').textContent='约 '+Math.max(1,Math.round(total/9))+' 分钟书写';\r\n  el('pvMeta').textContent=total+' 词 · 目标 160–200 词（英一）/150 词（英二）';\r\n}\r\n\r\nfunction render(){ renderBuilder(); renderPreview(); save(); }\r\n\r\n/* ============================================================\r\n   17. 持久化 / 快照\r\n   ============================================================ */\r\nfunction snapshot(){\r\n  var s=JSON.stringify({type:state.type,scene:state.scene,ch:state.ch,sl:state.sl,\r\n                        off:state.off,conn:state.conn,tg:state.tg,preset:state.preset});\r\n  if(undoStack.length&&undoStack[undoStack.length-1]===s) return;\r\n  undoStack.push(s);\r\n  if(undoStack.length>MAXUNDO) undoStack.shift();\r\n  el('undoBtn').disabled=undoStack.length===0;\r\n}\r\n\r\nfunction doUndo(){\r\n  if(!undoStack.length) return;\r\n  var prev=undoStack.pop();\r\n  if(!prev){ el('undoBtn').disabled=true; return; }\r\n  apply(JSON.parse(prev),true);\r\n  el('undoBtn').disabled=undoStack.length===0;\r\n  toast('已撤销');\r\n}\r\n\r\nfunction apply(o,silent){\r\n  state.type=o.type||'chart';\r\n  state.ch=o.ch||{};\r\n  state.sl=o.sl||{};\r\n  state.off=o.off||{};\r\n  state.conn=typeof o.conn==='number'?o.conn:1;\r\n  state.tg=o.tg||state.tg;\r\n  state.preset=o.preset||'';\r\n  var list=SCENES[state.type]||[];\r\n  state.scene=o.scene||(list[0]?list[0][0]:'dyn1');\r\n  renderTypeSeg(); renderSceneSeg(); renderPresetSel(); renderToggles();\r\n  if(!silent) render(); else render();\r\n}\r\n\r\nfunction save(){\r\n  if(!LS_OK) return;\r\n  try{ localStorage.setItem(LS,JSON.stringify({type:state.type,scene:state.scene,\r\n    ch:state.ch,sl:state.sl,off:state.off,conn:state.conn,tg:state.tg,preset:state.preset})); }\r\n  catch(e){}\r\n}\r\n\r\nfunction load(){\r\n  if(!LS_OK) return false;\r\n  try{\r\n    var raw=localStorage.getItem(LS);\r\n    if(!raw) return false;\r\n    var o=JSON.parse(raw);\r\n    if(!o||!o.type) return false;\r\n    apply(o,true);\r\n    return true;\r\n  }catch(e){ return false; }\r\n}\r\n\r\n/* ============================================================\r\n   18. 预设 / 清空\r\n   ============================================================ */\r\nfunction applyPreset(id){\r\n  var p=null,i;\r\n  for(i=0;i<PRESETS.length;i++) if(PRESETS[i].id===id){ p=PRESETS[i]; break; }\r\n  if(!p) return;\r\n  snapshot();\r\n  state.type=p.type;\r\n  state.scene=p.scene;\r\n  state.ch={};\r\n  state.sl={};\r\n  state.off={};\r\n  for(var k in p.ch) if(p.ch[k]) state.ch[k]=p.ch[k];\r\n  for(var k2 in p.sl) state.sl[k2]=p.sl[k2];\r\n  if(p.off) for(var k3 in p.off) state.off[k3]=p.off[k3];\r\n  state.conn=typeof p.conn==='number'?p.conn:1;\r\n  state.preset=p.id;\r\n  renderTypeSeg(); renderSceneSeg(); renderPresetSel(); render();\r\n  toast('已载入：'+p.name);\r\n}\r\n\r\nfunction clearAll(){\r\n  snapshot();\r\n  state.ch={}; state.sl={}; state.off={}; state.preset='';\r\n  renderPresetSel(); render();\r\n  toast('已清空（可撤销）');\r\n}\r\n\r\n/* ============================================================\r\n   19. 槽位面板\r\n   ============================================================ */\r\nvar panelKey=null;\r\nfunction openPanel(key){\r\n  panelKey=key;\r\n  var def=SLOTDEF[key]||{label:key};\r\n  el('pnTitle').textContent='词库';\r\n  el('pnLab').textContent=def.label;\r\n  el('pnInput').value=state.sl[key]||'';\r\n  renderOptions('');\r\n  var p=el('panel');\r\n  p.hidden=false;\r\n  document.querySelectorAll('.slot.act').forEach(function(x){x.classList.remove('act');});\r\n  document.querySelectorAll('.slot[data-k=\"'+key+'\"]').forEach(function(x){x.classList.add('act');});\r\n  el('pnInput').focus();\r\n  el('pnInput').select();\r\n}\r\n\r\nfunction renderOptions(q){\r\n  var def=SLOTDEF[panelKey]||{},list=el('pnList'),bank=def.bank?BANKS[def.bank]:null;\r\n  list.innerHTML='';\r\n  if(!bank){\r\n    var d=document.createElement('div');\r\n    d.className='pn-f';\r\n    d.textContent='该槽位没有预设词库，请在上方手输后回车。';\r\n    list.appendChild(d);\r\n    el('pnCount').textContent='';\r\n    return;\r\n  }\r\n  var cur=state.sl[panelKey]||'',shown=0;\r\n  bank.forEach(function(o){\r\n    if(q&&(o.en+' '+o.zh+' '+o.tag).toLowerCase().indexOf(q.toLowerCase())<0) return;\r\n    shown++;\r\n    var b=document.createElement('button');\r\n    b.type='button'; b.className='op'+(cur===o.en?' on':'');\r\n    b.setAttribute('data-val',o.en);\r\n    var e=document.createElement('div'); e.className='e'; e.textContent=demark(o.en);\r\n    b.appendChild(e);\r\n    if(o.zh){ var z=document.createElement('div'); z.className='z'; z.textContent=o.zh; b.appendChild(z); }\r\n    if(o.tag){ var g=document.createElement('div'); g.className='g'; g.textContent=o.tag; b.appendChild(g); }\r\n    list.appendChild(b);\r\n  });\r\n  if(!shown){\r\n    var n=document.createElement('div'); n.className='pn-f';\r\n    n.textContent='没有匹配项，直接回车可填入自定义内容。';\r\n    list.appendChild(n);\r\n  }\r\n  el('pnCount').textContent='共 '+bank.length+' 条可选 · 当前显示 '+shown+' 条 · 全部带中文注释';\r\n}\r\n\r\nfunction setSlot(v){\r\n  if(!panelKey) return;\r\n  state.sl[panelKey]=v;\r\n  var key=panelKey;\r\n  render();\r\n  var sl=document.querySelector('.slot[data-k=\"'+key+'\"]');\r\n  if(sl) sl.classList.add('act');\r\n}\r\n\r\nfunction closePanel(){\r\n  el('panel').hidden=true; panelKey=null;\r\n  document.querySelectorAll('.slot.act').forEach(function(x){x.classList.remove('act');});\r\n}\r\n\r\nvar toastTimer=null;\r\nfunction toast(msg){\r\n  var t=el('toast'); t.textContent=msg; t.className='toast on';\r\n  clearTimeout(toastTimer);\r\n  toastTimer=setTimeout(function(){ t.className='toast'; },1700);\r\n}\r\n\r\n/* ============================================================\r\n   20. 事件\r\n   ============================================================ */\r\nfunction renderToggles(){\r\n  var map=[['tgBi','bi'],['tgExam','exam'],['tgAnno','anno'],['tgCliche','cli']];\r\n  map.forEach(function(m){\r\n    var n=el(m[0]);\r\n    if(state.tg[m[1]]) n.classList.add('on'); else n.classList.remove('on');\r\n  });\r\n}\r\n\r\nfunction bind(){\r\n  el('typeSeg').addEventListener('click',function(e){\r\n    var b=e.target.closest('button[data-type]');\r\n    if(!b) return;\r\n    var t=b.getAttribute('data-type');\r\n    if(t===state.type) return;\r\n    snapshot();\r\n    state.type=t; state.scene=(SCENES[t][0]||['t',''])[0];\r\n    state.off={}; state.preset='';\r\n    renderTypeSeg(); renderSceneSeg(); renderPresetSel(); render();\r\n  });\r\n\r\n  el('sceneSeg').addEventListener('click',function(e){\r\n    var b=e.target.closest('button[data-scene]');\r\n    if(!b) return;\r\n    var s=b.getAttribute('data-scene');\r\n    if(s===state.scene) return;\r\n    snapshot();\r\n    state.scene=s; state.preset='';\r\n    renderSceneSeg(); renderPresetSel(); render();\r\n  });\r\n\r\n  el('presetSel').addEventListener('change',function(e){\r\n    var v=e.target.value;\r\n    if(!v) return;\r\n    applyPreset(v);\r\n  });\r\n\r\n  el('clearBtn').addEventListener('click',function(){ clearAll(); });\r\n  el('undoBtn').addEventListener('click',function(){ doUndo(); });\r\n\r\n  el('builder').addEventListener('click',function(e){\r\n    var tg=e.target.closest('button[data-toggle]');\r\n    if(tg){\r\n      var id=tg.getAttribute('data-toggle');\r\n      snapshot();\r\n      state.off[id]=!isOff(cardBlock(id));\r\n      render();\r\n      return;\r\n    }\r\n    var sl=e.target.closest('.slot');\r\n    if(sl){ openPanel(sl.getAttribute('data-k')); }\r\n  });\r\n\r\n  el('builder').addEventListener('change',function(e){\r\n    var sel=e.target.closest('select[data-sel]');\r\n    if(sel){\r\n      snapshot();\r\n      state.ch[sel.getAttribute('data-sel')]=sel.value;\r\n      state.preset='';\r\n      renderPresetSel();\r\n      render();\r\n      return;\r\n    }\r\n    if(e.target.id==='connSel'){\r\n      snapshot();\r\n      state.conn=parseInt(e.target.value,10)||0;\r\n      render();\r\n    }\r\n  });\r\n\r\n  el('pnList').addEventListener('click',function(e){\r\n    var op=e.target.closest('.op');\r\n    if(!op) return;\r\n    setSlot(op.getAttribute('data-val'));\r\n    closePanel();\r\n    toast('已填入');\r\n  });\r\n\r\n  el('pnInput').addEventListener('input',function(e){\r\n    renderOptions(e.target.value.trim());\r\n  });\r\n  el('pnInput').addEventListener('keydown',function(e){\r\n    if(e.key==='Enter'){\r\n      e.preventDefault();\r\n      var v=e.target.value.trim();\r\n      if(v){ setSlot(v); closePanel(); toast('已填入自定义内容'); }\r\n    }\r\n  });\r\n  el('pnSet').addEventListener('click',function(){\r\n    var v=el('pnInput').value.trim();\r\n    if(v){ setSlot(v); closePanel(); toast('已填入'); }\r\n  });\r\n  el('pnClr').addEventListener('click',function(){\r\n    if(!panelKey) return;\r\n    delete state.sl[panelKey];\r\n    closePanel(); render(); toast('已清空该槽位');\r\n  });\r\n  el('pnClose').addEventListener('click',closePanel);\r\n\r\n  document.addEventListener('keydown',function(e){\r\n    if(e.key==='Escape') closePanel();\r\n    if((e.ctrlKey||e.metaKey)&&e.key==='z'){\r\n      e.preventDefault(); doUndo();\r\n    }\r\n  });\r\n\r\n  el('copyBtn').addEventListener('click',function(){\r\n    var arr=[],i;\r\n    for(i=1;i<=3;i++){ var p=paragraph(i); if(p.en) arr.push(p.en); }\r\n    copyText(arr.join('\\n\\n'),'全文已复制（含三段）');\r\n  });\r\n  el('copyEnBtn').addEventListener('click',function(){\r\n    var arr=[],i;\r\n    for(i=1;i<=3;i++){ arr.push(paragraph(i).en); }\r\n    copyText(arr.join('\\n\\n'),'英文全文已复制');\r\n  });\r\n\r\n  [['tgBi','bi'],['tgExam','exam'],['tgAnno','anno'],['tgCliche','cli']].forEach(function(m){\r\n    el(m[0]).addEventListener('click',function(){\r\n      state.tg[m[1]]=!state.tg[m[1]];\r\n      renderToggles(); render();\r\n    });\r\n  });\r\n}\r\n\r\nfunction copyText(txt,msg){\r\n  var done=function(){ toast(msg); };\r\n  if(navigator.clipboard&&navigator.clipboard.writeText){\r\n    navigator.clipboard.writeText(txt).then(done,fallback);\r\n  } else fallback();\r\n  function fallback(){\r\n    var ta=document.createElement('textarea');\r\n    ta.value=txt; ta.style.position='fixed'; ta.style.left='-9999px';\r\n    document.body.appendChild(ta); ta.select();\r\n    try{ document.execCommand('copy'); done(); }catch(e){ toast('复制失败，请手动选择'); }\r\n    document.body.removeChild(ta);\r\n  }\r\n}\r\n\r\n/* ============================================================\r\n   21. 启动\r\n   ============================================================ */\r\nfunction boot(){\r\n  buildPL();\r\n  renderTypeSeg();\r\n  renderSceneSeg();\r\n  renderPresetSel();\r\n  renderToggles();\r\n  bind();\r\n  if(!load()){\r\n    applyPreset(PRESETS[0].id);\r\n    undoStack=[];\r\n    el('undoBtn').disabled=true;\r\n  } else {\r\n    render();\r\n    el('undoBtn').disabled=true;\r\n  }\r\n  renderToggles();\r\n  if(!LS_OK){\r\n    var f=document.querySelector('.pv-foot');\r\n    if(f&&!document.getElementById('lsWarn')){\r\n      var sp=document.createElement('span'); sp.id='lsWarn';\r\n      sp.textContent='· 当前环境不支持本机保存，改动仅本次有效';\r\n      f.appendChild(sp);\r\n    }\r\n  }\r\n   "smallA": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>考研英语小作文 · 逐句拼装模板（AI归来 27版）</title>\n<style>\n\n/* ===== 大作文模板 · 单文件交互版 ===== */\n*{box-sizing:border-box}\nhtml,body{margin:0;padding:0}\n:root{\n  --ink:#1b2a41; --ink2:#33475f; --paper:#fbf9f5; --line:#e3ddd2;\n  --accent:#0f6b5c; --accent2:#128a76; --gold:#b7791f; --red:#b4342b;\n  --slot:#eef6f4; --slotb:#9ccdc2; --filled:#e7f3ef;\n  --shadow:0 1px 2px rgba(27,42,65,.06),0 8px 24px rgba(27,42,65,.08);\n  --mono:\"Cascadia Mono\",Consolas,monospace;\n  --serif:Georgia,\"Times New Roman\",serif;\n}\nbody{\n  font:14px/1.65 -apple-system,\"Segoe UI\",\"PingFang SC\",\"Microsoft YaHei\",sans-serif;\n  color:var(--ink); background:\n    radial-gradient(1200px 600px at 10% -10%,#f2efe6 0%,transparent 60%),\n    radial-gradient(900px 500px at 100% 0%,#eaf2ef 0%,transparent 55%),\n    var(--paper);\n  -webkit-font-smoothing:antialiased;\n}\n/* ---------- 顶栏 ---------- */\n.top{position:sticky;top:0;z-index:40;background:rgba(251,249,245,.92);\n  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}\n.top-in{max-width:1480px;margin:0 auto;padding:10px 18px 8px}\n.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}\n.brand h1{font-size:16px;margin:0;letter-spacing:.4px}\n.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(15,107,92,.12)}\n.brand .sub{font-size:12px;color:#6b7a8d;letter-spacing:.2px}\n.brand .spacer{flex:1}\n.modes{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}\n.mode-btn{border:1px solid var(--line);background:#fff;color:var(--ink2);\n  padding:5px 11px;border-radius:999px;font-size:12.5px;cursor:pointer;\n  display:inline-flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap}\n.mode-btn:hover{border-color:var(--accent);color:var(--accent)}\n.mode-btn .tag{font-size:10px;color:#8a97a6;border:1px solid var(--line);border-radius:4px;padding:0 4px}\n.mode-btn.on{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 4px 12px rgba(27,42,65,.22)}\n.mode-btn.on .tag{color:#c9d4e0;border-color:#4a5b70}\n.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px;\n  font-size:12.5px;color:var(--ink2)}\n.tb-group{display:flex;align-items:center;gap:6px}\n.tb-group>label{color:#7b8794;font-size:12px}\nselect,input[type=text],input[type=search]{\n  font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);\n  border-radius:7px;padding:5px 8px;outline:none}\nselect:focus,input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(18,138,118,.12)}\n.btn{border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:7px;\n  padding:5px 10px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}\n.btn:hover{border-color:var(--accent);color:var(--accent)}\n.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}\n.btn.primary:hover{background:var(--accent2);color:#fff}\n.btn:disabled{opacity:.42;cursor:not-allowed}\n.switch{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;\n  border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px 4px 6px}\n.switch input{display:none}\n.switch i{width:14px;height:14px;border-radius:50%;background:#cbd3dd;position:relative;transition:.18s;display:inline-block}\n.switch input:checked+i{background:var(--accent2);box-shadow:inset 0 0 0 3px #fff}\n.switch span{font-size:12px}\n.switch input:checked~span{color:var(--accent)}\n/* ---------- 布局 ---------- */\n.layout{max-width:1480px;margin:0 auto;padding:16px 18px 80px;\n  display:grid;grid-template-columns:minmax(0,1.15fr) minmax(360px,.85fr);gap:18px;align-items:start}\n@media (max-width:1080px){.layout{grid-template-columns:1fr}}\n.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}\n.panel-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);\n  background:#fff;border-radius:14px 14px 0 0;z-index:12}\n.panel-h h2{margin:0;font-size:13.5px;letter-spacing:.5px}\n.panel-h .meta{font-size:12px;color:#7b8794}\n.panel-h .spacer{flex:1}\n/* ---------- 建造区 ---------- */\n.builder{padding:6px 0 14px}\n.para-h{display:flex;align-items:center;gap:8px;padding:12px 16px 4px}\n.para-h .pill{font-size:11.5px;background:var(--ink);color:#fff;border-radius:999px;padding:2px 9px;letter-spacing:.5px}\n.para-h .tip{font-size:12px;color:#7b8794}\n.card{margin:10px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;\n  transition:.15s;overflow:hidden}\n.card:hover{border-color:#cfd8e3}\n.card.off{opacity:.5}\n.card-h{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#fcfbf8;border-bottom:1px solid transparent;cursor:default}\n.card.open .card-h{border-bottom-color:var(--line)}\n.card-h .no{width:22px;height:22px;border-radius:7px;background:var(--ink);color:#fff;font-size:11.5px;\n  display:grid;place-items:center;flex:none;font-family:var(--mono)}\n.card-h .ttl{font-size:13px;font-weight:600;letter-spacing:.3px}\n.card-h .hint{font-size:11.5px;color:#8a97a6;font-weight:400}\n.card-h .spacer{flex:1}\n.card-h .count{font-size:11px;color:#8a97a6;font-family:var(--mono)}\n.mini{border:1px solid var(--line);background:#fff;border-radius:6px;font-size:11.5px;\n  color:#6b7a8d;padding:2px 7px;cursor:pointer}\n.mini:hover{color:var(--accent);border-color:var(--accent)}\n.card-b{padding:10px 12px 12px}\n.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}\n.ctl select{font-size:12.5px;max-width:100%}\n.ctl .lab{font-size:11.5px;color:#7b8794}\n.sent{font-family:var(--serif);font-size:16.5px;line-height:1.95;color:#1c2836;\n  background:#fffdf8;border:1px dashed #e6dfd2;border-radius:9px;padding:10px 12px;word-break:break-word}\n.slot{font-family:-apple-system,\"PingFang SC\",\"Microsoft YaHei\",sans-serif;font-size:12.5px;\n  border-radius:6px;padding:1px 6px;margin:0 1px;cursor:pointer;border:1px dashed var(--slotb);\n  background:var(--slot);color:#2a6b60;transition:.12s;display:inline;white-space:normal}\n.slot:hover{background:#dcefe9;border-color:var(--accent2)}\n.slot.empty{color:#8b6d3a;border-color:#d8c294;background:#fdf6e6}\n.slot.empty:hover{background:#fbeecf}\n.slot.on{background:var(--filled);border-style:solid;border-color:#8bc7b8;color:#0f5a4d;font-weight:600}\n.note{font-size:12px;color:#7b8794;margin-top:8px;line-height:1.6;border-left:2px solid #e6dfd2;padding-left:8px}\n.zh-line{font-size:12.5px;color:#6b7a8d;margin-top:6px;line-height:1.6}\n/* ---------- 预览 ---------- */\n.preview{position:sticky;top:calc(var(--topH,120px) + 12px);max-height:calc(100vh - var(--topH,120px) - 28px);\n  display:flex;flex-direction:column}\n@media (max-width:1080px){.preview{position:static;max-height:none}}\n.preview .panel-b{overflow:auto;padding:4px 0 10px}\n.paper{padding:14px 16px 6px}\n.para{margin-bottom:6px;padding-bottom:10px;border-bottom:1px dashed #ece6da}\n.para:last-child{border-bottom:none}\n.para-t{font-size:11px;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase;margin-bottom:4px;\n  display:flex;align-items:center;gap:8px}\n.para-t .spacer{flex:1}\n.para-t .wc{color:#9aa5b1;letter-spacing:0;text-transform:none;font-size:11px}\n.en{font-family:var(--serif);font-size:16px;line-height:1.9;color:#16202c;text-align:justify;white-space:pre-wrap}\n.en .ph{color:#b4342b;background:#fbeeec;border-radius:4px;padding:0 4px;font-size:12.5px;\n  font-family:-apple-system,\"PingFang SC\",sans-serif}\n.zh{font-size:12.5px;color:#7b8794;line-height:1.7;margin-top:5px;padding-left:2px}\n.zh .ph{color:#b4342b}\n.empty-tip{color:#a6b0bb;font-size:13px;padding:20px 6px;text-align:center}\n.tagline{font-size:11px;color:#9aa5b1;padding:0 16px 10px}\n/* ---------- 槽位面板 ---------- */\n.mask{position:fixed;inset:0;background:rgba(20,28,40,.28);z-index:60;display:none}\n.mask.on{display:block}\n.pop{position:fixed;z-index:70;width:420px;max-width:calc(100vw - 24px);max-height:min(70vh,560px);\n  background:#fff;border:1px solid #d8e0ea;border-radius:14px;box-shadow:0 20px 50px rgba(20,28,40,.24);\n  display:none;flex-direction:column;overflow:hidden}\n.pop.on{display:flex}\n.pop.wide{width:680px;max-height:min(82vh,660px);left:50%!important;top:50%!important;transform:translate(-50%,-50%)}\n.h-sec{padding:10px 14px;border-bottom:1px dashed #ece6da}\n.h-sec:last-child{border-bottom:none}\n.h-sec h3{margin:0 0 6px;font-size:13px;color:var(--ink);letter-spacing:.5px}\n.h-sec p,.h-sec li{font-size:12.5px;color:#5c6b7a;line-height:1.75;margin:3px 0}\n.h-sec ul{margin:4px 0;padding-left:18px}\n.h-sec table{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}\n.h-sec th,.h-sec td{border:1px solid #ece6da;padding:3px 6px;text-align:center;color:#5c6b7a}\n.h-sec th{background:#faf8f3;color:var(--ink2)}\n.h-sec b{color:var(--accent)}\n.pop-h{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}\n.pop-h .t{font-size:13px;font-weight:600}\n.pop-h .l{font-size:11.5px;color:#8a97a6}\n.pop-h .x{margin-left:auto;border:none;background:transparent;font-size:18px;color:#9aa5b1;cursor:pointer;line-height:1}\n.pop-in{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;gap:6px}\n.pop-in input{flex:1;font-size:13px}\n.pop-list{overflow:auto;padding:6px 6px 10px}\n.pop-g{font-size:11px;color:var(--gold);letter-spacing:1px;padding:8px 8px 3px}\n.opt{display:block;width:100%;text-align:left;border:1px solid transparent;background:transparent;\n  border-radius:8px;padding:6px 8px;cursor:pointer;font-size:13px}\n.opt:hover{background:#f2f8f6;border-color:#d5e9e3}\n.opt.sel{background:#e7f3ef;border-color:#8bc7b8}\n.opt .e{font-family:var(--serif);font-size:14.5px;color:#16202c;display:block}\n.opt .z{font-size:11.5px;color:#7b8794;display:block;margin-top:1px}\n.pop-f{padding:8px 12px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:space-between;background:#fcfbf8}\nkbd{font-family:var(--mono);font-size:11px;border:1px solid #d5dde5;border-bottom-width:2px;\n  border-radius:4px;padding:0 4px;background:#fff;color:#5a6b7d}\n/* ---------- 状态条 ---------- */\n.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:#fff;\n  padding:9px 16px;border-radius:999px;font-size:12.5px;opacity:0;pointer-events:none;transition:.25s;z-index:90}\n.toast.on{opacity:1;transform:translate(-50%,0)}\n/* ---------- 考场精简 / 打印 ---------- */\nbody.exam .card .note,body.exam .card .zh-line,body.exam .card .hint{display:none}\nbody.exam .card{margin:6px 12px}\nbody.exam .sent{font-size:15.5px;line-height:1.8;padding:8px 10px}\nbody.exam .zh{display:none}\nbody.exam .en{font-size:15.5px;line-height:1.85}\nbody.exam .tagline{display:none}\n@media print{\n  .top,.builder,.toast,.pop,.mask{display:none!important}\n  .layout{display:block;padding:0}\n  .preview{position:static;max-height:none;border:none;box-shadow:none}\n  .en{font-size:12pt}\n}\n/* 滚动条 */\n::-webkit-scrollbar{width:10px;height:10px}\n::-webkit-scrollbar-thumb{background:#d7dee6;border-radius:8px;border:3px solid #fff}\n::-webkit-scrollbar-thumb:hover{background:#c3ccd6}\n\n/* ---------- 小作文特有 ---------- */\n.en{white-space:pre-wrap}\n.para.right .en{text-align:right}\n.para-head .en{font-family:var(--serif);font-size:16px;letter-spacing:.3px}\n.slot.long{max-width:100%}\n.head-block .en{background:#fcfbf7;border:1px dashed #e6dfd2;border-radius:8px;padding:8px 10px;font-size:14.5px;line-height:1.7}\n.wordbar{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#8a97a6}\n.wordbar .bar{height:6px;width:86px;background:#ece6da;border-radius:6px;overflow:hidden}\n.wordbar .bar i{display:block;height:100%;width:0;background:var(--accent2);transition:.2s}\n.wordbar.over .bar i{background:#c98a2e}\n.wordbar.low .bar i{background:#9aa5b1}\n\r\n\n</style>\n</head>\n<body>\n<header class=\"top\">\n  <div class=\"top-in\">\n    <div class=\"brand\">\n      <span class=\"dot\"></span>\n      <h1>小作文 · 逐句拼装模板</h1>\n      <span class=\"sub\">AI归来 27版讲义｜书信 / 通知·告示 / 纪要 · 约 100 词 · 8 句成篇</span>\n      <span class=\"spacer\"></span>\n      <span class=\"sub\" id=\"stat\">—</span>\n    </div>\n    <div class=\"modes\" id=\"modes\"></div>\n    <div class=\"toolbar\">\n      <div class=\"tb-group\">\n        <label for=\"preset\">真题预设</label>\n        <select id=\"preset\" style=\"max-width:270px\"></select>\n      </div>\n      <div class=\"tb-group\">\n        <label class=\"switch\" title=\"预览区显示每句中文译文\"><input type=\"checkbox\" id=\"tZh\" checked><i></i><span>中英对照</span></label>\n        <label class=\"switch\" title=\"隐藏注释与中文，只留英文格式\"><input type=\"checkbox\" id=\"tExam\"><i></i><span>考场精简</span></label>\n        <label class=\"switch\" title=\"自动处理主谓一致、句首大写、逗号后小写\"><input type=\"checkbox\" id=\"tPolish\" checked><i></i><span>英文自动细节</span></label>\n        <label class=\"switch\" title=\"显示每个句子的适用语境说明\"><input type=\"checkbox\" id=\"tNote\" checked><i></i><span>注释</span></label>\n        <label class=\"switch\" title=\"预览区标出每句用了哪条待选句\"><input type=\"checkbox\" id=\"tTag\"><i></i><span>套用标注</span></label>\n      </div>\n      <span class=\"spacer\" style=\"flex:1\"></span>\n      <button class=\"btn\" id=\"help\" title=\"讲义要点：大纲、应对策略、50 句分组\">讲义要点</button>\n      <button class=\"btn\" id=\"undo\" title=\"Ctrl+Z\">↶ 撤销</button>\n      <button class=\"btn\" id=\"clear\">清空槽位</button>\n      <button class=\"btn primary\" id=\"copy\">复制全文</button>\n    </div>\n  </div>\n</header>\n\n<main class=\"layout\">\n  <section class=\"panel\">\n    <div class=\"panel-h\">\n      <h2>逐句拼装</h2>\n      <span class=\"meta\" id=\"modeDesc\"></span>\n      <span class=\"spacer\"></span>\n      <span class=\"meta\">点击 <span style=\"color:#8b6d3a\">【金色】</span> 槽位填词 · 下拉切换句型方案</span>\n    </div>
