<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>考研英语大作文 · 逐句拼装模板（AI归来 27版）</title>
<style>

/* ===== 大作文模板 · 单文件交互版 ===== */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
:root{
  --ink:#1b2a41; --ink2:#33475f; --paper:#fbf9f5; --line:#e3ddd2;
  --accent:#0f6b5c; --accent2:#128a76; --gold:#b7791f; --red:#b4342b;
  --slot:#eef6f4; --slotb:#9ccdc2; --filled:#e7f3ef;
  --shadow:0 1px 2px rgba(27,42,65,.06),0 8px 24px rgba(27,42,65,.08);
  --mono:"Cascadia Mono",Consolas,monospace;
  --serif:Georgia,"Times New Roman",serif;
}
body{
  font:14px/1.65 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--ink); background:
    radial-gradient(1200px 600px at 10% -10%,#f2efe6 0%,transparent 60%),
    radial-gradient(900px 500px at 100% 0%,#eaf2ef 0%,transparent 55%),
    var(--paper);
  -webkit-font-smoothing:antialiased;
}
/* ---------- 顶栏 ---------- */
.top{position:sticky;top:0;z-index:40;background:rgba(251,249,245,.92);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1480px;margin:0 auto;padding:10px 18px 8px}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand h1{font-size:16px;margin:0;letter-spacing:.4px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(15,107,92,.12)}
.brand .sub{font-size:12px;color:#6b7a8d;letter-spacing:.2px}
.brand .spacer{flex:1}
.modes{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.mode-btn{border:1px solid var(--line);background:#fff;color:var(--ink2);
  padding:5px 11px;border-radius:999px;font-size:12.5px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap}
.mode-btn:hover{border-color:var(--accent);color:var(--accent)}
.mode-btn .tag{font-size:10px;color:#8a97a6;border:1px solid var(--line);border-radius:4px;padding:0 4px}
.mode-btn.on{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 4px 12px rgba(27,42,65,.22)}
.mode-btn.on .tag{color:#c9d4e0;border-color:#4a5b70}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px;
  font-size:12.5px;color:var(--ink2)}
.tb-group{display:flex;align-items:center;gap:6px}
.tb-group>label{color:#7b8794;font-size:12px}
select,input[type=text],input[type=search]{
  font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);
  border-radius:7px;padding:5px 8px;outline:none}
select:focus,input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(18,138,118,.12)}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:7px;
  padding:5px 10px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent2);color:#fff}
.btn:disabled{opacity:.42;cursor:not-allowed}
.switch{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;
  border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px 4px 6px}
.switch input{display:none}
.switch i{width:14px;height:14px;border-radius:50%;background:#cbd3dd;position:relative;transition:.18s;display:inline-block}
.switch input:checked+i{background:var(--accent2);box-shadow:inset 0 0 0 3px #fff}
.switch span{font-size:12px}
.switch input:checked~span{color:var(--accent)}
/* ---------- 布局 ---------- */
.layout{max-width:1480px;margin:0 auto;padding:16px 18px 80px;
  display:grid;grid-template-columns:minmax(0,1.15fr) minmax(360px,.85fr);gap:18px;align-items:start}
@media (max-width:1080px){.layout{grid-template-columns:1fr}}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.panel-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);
  background:#fff;border-radius:14px 14px 0 0;z-index:12}
.panel-h h2{margin:0;font-size:13.5px;letter-spacing:.5px}
.panel-h .meta{font-size:12px;color:#7b8794}
.panel-h .spacer{flex:1}
/* ---------- 建造区 ---------- */
.builder{padding:6px 0 14px}
.para-h{display:flex;align-items:center;gap:8px;padding:12px 16px 4px}
.para-h .pill{font-size:11.5px;background:var(--ink);color:#fff;border-radius:999px;padding:2px 9px;letter-spacing:.5px}
.para-h .tip{font-size:12px;color:#7b8794}
.card{margin:10px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;
  transition:.15s;overflow:hidden}
.card:hover{border-color:#cfd8e3}
.card.off{opacity:.5}
.card-h{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#fcfbf8;border-bottom:1px solid transparent;cursor:default}
.card.open .card-h{border-bottom-color:var(--line)}
.card-h .no{width:22px;height:22px;border-radius:7px;background:var(--ink);color:#fff;font-size:11.5px;
  display:grid;place-items:center;flex:none;font-family:var(--mono)}
.card-h .ttl{font-size:13px;font-weight:600;letter-spacing:.3px}
.card-h .hint{font-size:11.5px;color:#8a97a6;font-weight:400}
.card-h .spacer{flex:1}
.card-h .count{font-size:11px;color:#8a97a6;font-family:var(--mono)}
.mini{border:1px solid var(--line);background:#fff;border-radius:6px;font-size:11.5px;
  color:#6b7a8d;padding:2px 7px;cursor:pointer}
.mini:hover{color:var(--accent);border-color:var(--accent)}
.card-b{padding:10px 12px 12px}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.ctl select{font-size:12.5px;max-width:100%}
.ctl .lab{font-size:11.5px;color:#7b8794}
.sent{font-family:var(--serif);font-size:16.5px;line-height:1.95;color:#1c2836;
  background:#fffdf8;border:1px dashed #e6dfd2;border-radius:9px;padding:10px 12px;word-break:break-word}
.slot{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:12.5px;
  border-radius:6px;padding:1px 6px;margin:0 1px;cursor:pointer;border:1px dashed var(--slotb);
  background:var(--slot);color:#2a6b60;transition:.12s;display:inline;white-space:normal}
.slot:hover{background:#dcefe9;border-color:var(--accent2)}
.slot.empty{color:#8b6d3a;border-color:#d8c294;background:#fdf6e6}
.slot.empty:hover{background:#fbeecf}
.slot.on{background:var(--filled);border-style:solid;border-color:#8bc7b8;color:#0f5a4d;font-weight:600}
.note{font-size:12px;color:#7b8794;margin-top:8px;line-height:1.6;border-left:2px solid #e6dfd2;padding-left:8px}
.zh-line{font-size:12.5px;color:#6b7a8d;margin-top:6px;line-height:1.6}
/* ---------- 预览 ---------- */
.preview{position:sticky;top:calc(var(--topH,120px) + 12px);max-height:calc(100vh - var(--topH,120px) - 28px);
  display:flex;flex-direction:column}
@media (max-width:1080px){.preview{position:static;max-height:none}}
.preview .panel-b{overflow:auto;padding:4px 0 10px}
.paper{padding:14px 16px 6px}
.para{margin-bottom:6px;padding-bottom:10px;border-bottom:1px dashed #ece6da}
.para:last-child{border-bottom:none}
.para-t{font-size:11px;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase;margin-bottom:4px;
  display:flex;align-items:center;gap:8px}
.para-t .spacer{flex:1}
.para-t .wc{color:#9aa5b1;letter-spacing:0;text-transform:none;font-size:11px}
.en{font-family:var(--serif);font-size:16px;line-height:1.9;color:#16202c;text-align:justify;white-space:pre-wrap}
.en .ph{color:#b4342b;background:#fbeeec;border-radius:4px;padding:0 4px;font-size:12.5px;
  font-family:-apple-system,"PingFang SC",sans-serif}
.zh{font-size:12.5px;color:#7b8794;line-height:1.7;margin-top:5px;padding-left:2px}
.zh .ph{color:#b4342b}
.empty-tip{color:#a6b0bb;font-size:13px;padding:20px 6px;text-align:center}
.tagline{font-size:11px;color:#9aa5b1;padding:0 16px 10px}
/* ---------- 槽位面板 ---------- */
.mask{position:fixed;inset:0;background:rgba(20,28,40,.28);z-index:60;display:none}
.mask.on{display:block}
.pop{position:fixed;z-index:70;width:420px;max-width:calc(100vw - 24px);max-height:min(70vh,560px);
  background:#fff;border:1px solid #d8e0ea;border-radius:14px;box-shadow:0 20px 50px rgba(20,28,40,.24);
  display:none;flex-direction:column;overflow:hidden}
.pop.on{display:flex}
.pop.wide{width:680px;max-height:min(82vh,660px);left:50%!important;top:50%!important;transform:translate(-50%,-50%)}
.h-sec{padding:10px 14px;border-bottom:1px dashed #ece6da}
.h-sec:last-child{border-bottom:none}
.h-sec h3{margin:0 0 6px;font-size:13px;color:var(--ink);letter-spacing:.5px}
.h-sec p,.h-sec li{font-size:12.5px;color:#5c6b7a;line-height:1.75;margin:3px 0}
.h-sec ul{margin:4px 0;padding-left:18px}
.h-sec table{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
.h-sec th,.h-sec td{border:1px solid #ece6da;padding:3px 6px;text-align:center;color:#5c6b7a}
.h-sec th{background:#faf8f3;color:var(--ink2)}
.h-sec b{color:var(--accent)}
.pop-h{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.pop-h .t{font-size:13px;font-weight:600}
.pop-h .l{font-size:11.5px;color:#8a97a6}
.pop-h .x{margin-left:auto;border:none;background:transparent;font-size:18px;color:#9aa5b1;cursor:pointer;line-height:1}
.pop-in{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;gap:6px}
.pop-in input{flex:1;font-size:13px}
.pop-list{overflow:auto;padding:6px 6px 10px}
.pop-g{font-size:11px;color:var(--gold);letter-spacing:1px;padding:8px 8px 3px}
.opt{display:block;width:100%;text-align:left;border:1px solid transparent;background:transparent;
  border-radius:8px;padding:6px 8px;cursor:pointer;font-size:13px}
.opt:hover{background:#f2f8f6;border-color:#d5e9e3}
.opt.sel{background:#e7f3ef;border-color:#8bc7b8}
.opt .e{font-family:var(--serif);font-size:14.5px;color:#16202c;display:block}
.opt .z{font-size:11.5px;color:#7b8794;display:block;margin-top:1px}
.pop-f{padding:8px 12px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:space-between;background:#fcfbf8}
kbd{font-family:var(--mono);font-size:11px;border:1px solid #d5dde5;border-bottom-width:2px;
  border-radius:4px;padding:0 4px;background:#fff;color:#5a6b7d}
/* ---------- 状态条 ---------- */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:#fff;
  padding:9px 16px;border-radius:999px;font-size:12.5px;opacity:0;pointer-events:none;transition:.25s;z-index:90}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* ---------- 考场精简 / 打印 ---------- */
body.exam .card .note,body.exam .card .zh-line,body.exam .card .hint{display:none}
body.exam .card{margin:6px 12px}
body.exam .sent{font-size:15.5px;line-height:1.8;padding:8px 10px}
body.exam .zh{display:none}
body.exam .en{font-size:15.5px;line-height:1.85}
body.exam .tagline{display:none}
@media print{
  .top,.builder,.toast,.pop,.mask{display:none!important}
  .layout{display:block;padding:0}
  .preview{position:static;max-height:none;border:none;box-shadow:none}
  .en{font-size:12pt}
}
/* 滚动条 */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#d7dee6;border-radius:8px;border:3px solid #fff}
::-webkit-scrollbar-thumb:hover{background:#c3ccd6}

</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <span class="dot"></span>
      <h1>大作文 · 逐句拼装模板</h1>
      <span class="sub">AI归来 27版讲义｜图表 / 双图表 / 图画 / 图画+图表 / 文字 · 10 句成篇</span>
      <span class="spacer"></span>
      <span class="sub" id="stat">—</span>
    </div>
    <div class="modes" id="modes"></div>
    <div class="toolbar">
      <div class="tb-group">
        <label for="preset">真题预设</label>
        <select id="preset" style="max-width:260px"></select>
      </div>
      <div class="tb-group">
        <label class="switch" title="预览区显示每句中文译文"><input type="checkbox" id="tZh" checked><i></i><span>中英对照</span></label>
        <label class="switch" title="隐藏注释、只留英文，模拟考场默写"><input type="checkbox" id="tExam"><i></i><span>考场精简</span></label>
        <label class="switch" title="自动处理主谓一致、句首大写、逗号后小写"><input type="checkbox" id="tPolish" checked><i></i><span>英文自动细节</span></label>
        <label class="switch" title="显示每个用法的适用语境说明"><input type="checkbox" id="tNote" checked><i></i><span>注释</span></label>
        <label class="switch" title="预览区标出每句用了哪个待选句/公式（讲义套用标注）"><input type="checkbox" id="tTag"><i></i><span>套用标注</span></label>
      </div>
      <span class="spacer" style="flex:1"></span>
      <button class="btn" id="help" title="讲义要点：大纲、时间分配、学习路径">讲义要点</button>
      <button class="btn" id="undo" title="Ctrl+Z">↶ 撤销</button>
      <button class="btn" id="clear">清空槽位</button>
      <button class="btn primary" id="copy">复制全文</button>
    </div>
  </div>
</header>

<main class="layout">
  <section class="panel">
    <div class="panel-h">
      <h2>逐句拼装</h2>
      <span class="meta" id="modeDesc"></span>
      <span class="spacer"></span>
      <span class="meta">点击 <span style="color:#8b6d3a">【金色】</span> 槽位填词 · 下拉切换句型方案</span>
    </div>
    <div class="builder" id="builder"></div>
  </section>

  <aside class="panel preview">
    <div class="panel-h">
      <h2>全文预览</h2>
      <span class="meta" id="wc">0 词</span>
      <span class="spacer"></span>
      <button class="mini" id="copy2">复制</button>
    </div>
    <div class="panel-b"><div class="paper" id="paper"></div></div>
    <div class="tagline">英一 160–200 词 / 英二约 150 词；蓝色【】为未填槽位。</div>
  </aside>
</main>

<div class="mask" id="mask"></div>
<div class="pop" id="pop" role="dialog" aria-label="词库">
  <div class="pop-h">
    <span class="t" id="popTitle">词库</span>
    <span class="l" id="popHint"></span>
    <button class="x" id="popX" aria-label="关闭">×</button>
  </div>
  <div class="pop-in">
    <input type="text" id="popInput" placeholder="输入自定义内容，回车确定">
    <button class="btn" id="popSet">确定</button>
  </div>
  <div class="pop-list" id="popList"></div>
  <div class="pop-f">
    <span style="font-size:11.5px;color:#8a97a6">Esc 关闭 · ↑↓ 选择 · Enter 确认</span>
    <button class="btn" id="popClear">清空此槽</button>
  </div>
</div>
<div class="pop wide" id="helpPop" role="dialog" aria-label="讲义要点">
  <div class="pop-h"><span class="t">讲义要点 · 一页速查</span><button class="x" id="helpX">×</button></div>
  <div class="pop-list" id="helpBody"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ==== data_banks.js ==== */
/* ================= 词库 ================= */
var BANKS = {
  /* ---------- 图表 ---------- */
  chart: [
    {en:"line chart", zh:"线状图（折线图）", g:"图表类型"},
    {en:"bar chart", zh:"柱状图", g:"图表类型"},
    {en:"pie chart", zh:"饼状图", g:"图表类型"},
    {en:"table", zh:"表格（25英一、2012英二）", g:"图表类型"},
    {en:"chart", zh:"图表（统称，最保险）", g:"图表类型"},
    {en:"two charts", zh:"两幅图（双图表专用）", g:"图表类型"}
  ],
  metric: [
    {en:"proportion", zh:"比例（占比首选）", g:"指标"},
    {en:"percentage", zh:"百分比（占比首选）", g:"指标"},
    {en:"share", zh:"份额（占比）", g:"指标"},
    {en:"ratio", zh:"比率（对比大小用，非占比）", g:"指标"},
    {en:"number", zh:"数量（可数）", g:"指标"},
    {en:"level", zh:"水平（素养、满意度）", g:"指标"},
    {en:"rate", zh:"率（参与率、满意率）", g:"指标"},
    {en:"volume", zh:"业务量、体量", g:"指标"},
    {en:"ownership", zh:"拥有量（家电、车辆）", g:"指标"},
    {en:"participation rate", zh:"参与率（休闲活动调查）", g:"指标"}
  ],
  verb: [
    {en:"increased", zh:"增加（increase）", g:"增加"},
    {en:"rose", zh:"上升（rise）", g:"增加"},
    {en:"grew", zh:"增长（grow）", g:"增加"},
    {en:"expanded", zh:"扩大（expand）", g:"增加"},
    {en:"climbed", zh:"攀升（climb）", g:"增加"},
    {en:"jumped", zh:"跃升（jump）", g:"增加"},
    {en:"surged", zh:"激增（surge）", g:"增加"},
    {en:"soared", zh:"猛涨（soar）", g:"增加"},
    {en:"decreased", zh:"减少（decrease）", g:"减少"},
    {en:"declined", zh:"下降（decline）", g:"减少"},
    {en:"diminished", zh:"减小（diminish）", g:"减少"},
    {en:"shrunk", zh:"收缩（shrink）", g:"减少"},
    {en:"dropped", zh:"下落（drop）", g:"减少"},
    {en:"fell", zh:"下降（fall）", g:"减少"},
    {en:"remained flat", zh:"持平（remain flat）", g:"持平"},
    {en:"stayed", zh:"保持在（stay at）", g:"持平"},
    {en:"stood", zh:"处于（stand at）", g:"持平"},
    {en:"stabilized", zh:"趋于稳定（stabilize）", g:"持平"},
    {en:"varied", zh:"变化（vary）", g:"波动"},
    {en:"fluctuated", zh:"波动（fluctuate）", g:"波动"},
    {en:"rose and fell", zh:"起伏（rise and fall）", g:"波动"}
  ],
  speed: [
    {en:"sharply", zh:"迅速地（急剧）", g:"迅速"},
    {en:"markedly", zh:"显著地", g:"迅速"},
    {en:"notably", zh:"明显地", g:"迅速"},
    {en:"remarkably", zh:"显著地", g:"迅速"},
    {en:"significantly", zh:"大幅地", g:"迅速"},
    {en:"dramatically", zh:"急剧地", g:"迅速"},
    {en:"slightly", zh:"轻微地", g:"缓慢"},
    {en:"gradually", zh:"逐渐地", g:"缓慢"},
    {en:"steadily", zh:"稳步地", g:"缓慢"},
    {en:"modestly", zh:"小幅地", g:"缓慢"},
    {en:"marginally", zh:"略微地", g:"缓慢"},
    {en:"at a modest pace", zh:"以温和的速度", g:"缓慢"}
  ],
  trendV: [
    {en:"rose steadily", zh:"稳步上升（动态单方向·最稳）"},
    {en:"increased gradually", zh:"逐步上升（缓慢·折线图）"},
    {en:"climbed remarkably", zh:"显著攀升（迅速）"},
    {en:"soared dramatically", zh:"急剧飙升（爆发式）"},
    {en:"declined steadily", zh:"稳步下降"},
    {en:"fell sharply", zh:"急剧下降"},
    {en:"dropped significantly", zh:"大幅下降"},
    {en:"fluctuated noticeably", zh:"明显波动"},
    {en:"remained largely stable", zh:"基本持平"},
    {en:"kept rising year after year", zh:"逐年上升"}
  ],
  trendN: [
    {en:"steady rise", zh:"稳步上升（名词短语）"},
    {en:"sharp increase", zh:"急剧上升"},
    {en:"dramatic surge", zh:"显著增长"},

  m.all.slice(m.cards.length).forEach(function(c){ order.push(typeof c==="string"?c:c.id); });
  var html = "";
  var lastP = 0;
  order.forEach(function(cid){
    var card = cardById(cid); if(!card) return;
    var st = state.cards[cid]; if(!st) return;
    if(card.p !== lastP){
      lastP = card.p;
      var t = paraTitle(card.p);
      html += '<div class="para-h"><span class="pill">'+t[0]+'</span><span class="tip">'+esc(t[1])+'</span></div>';
    }
    html += cardHTML(cid, card, st);
  });
  $("#builder").innerHTML = html;
  $("#modeDesc").textContent = m.desc || "";
}
function refreshCard(cid){
  var card = cardById(cid), st = state.cards[cid];
  var node = document.querySelector('.card[data-cid="'+cid+'"]');
  if(!card || !st || !node) return;
  var v = variantOf(card, st);
  node.classList.toggle("off", !st.on);
  var s = node.querySelector(".sent"); if(s) s.innerHTML = sentenceHTML(card, st, true);
  var n = node.querySelector(".note"); if(n) n.textContent = v.note||"";
  var z = node.querySelector(".zh-line"); if(z) z.textContent = v.zh||"";
  var c = node.querySelector(".count"); if(c) c.textContent = filledCount(card,st);
  var tg = node.querySelector('[data-act="toggle"]'); if(tg) tg.textContent = st.on?"移除":"加入";
  (card.subs||[]).forEach(function(sd){
    var sel = node.querySelector('select[data-sub="'+sd.key+'"]');
    if(sel && sel.parentElement) sel.parentElement.style.display = hasSub(rawText(card, st), sd.key) ? "" : "none";
  });
}

/* ---------------- 渲染：预览 ---------------- */
function collect(){
  var m = modeById(state.mode);
  var order = [];
  modeCardList(m).forEach(function(c){ order.push(c.id); });
  m.all.slice(m.cards.length).forEach(function(c){ order.push(typeof c==="string"?c:c.id); });
  var rows = [], buf = null, bufZh = "", bufCard = null;
  order.forEach(function(cid){
    var card = cardById(cid), st = state.cards[cid];
    if(!card || !st || !st.on) return;
    var pcs = piecesOf(card, st);
    if(card.open){
      buf = buf ? buf.concat([{type:"t", s:" "}], pcs) : pcs;
      bufZh += (variantOf(card, st).zh || "");
      bufCard = bufCard || card;
      return;
    }
    var whole = buf ? buf.concat([{type:"t", s:" "}], pcs) : pcs;
    var zh = bufZh + (variantOf(card, st).zh || "");
    var pol = polishPieces(whole, !!state.flags.polish);
    var en = textOfPieces(pol, card).trim();
    buf = null; bufZh = ""; bufCard = null;
    if(!en) return;
    rows.push({p:card.p, card:card, st:st, en:en, zh:zh, html:htmlOfPieces(pol, false)});
  });
  if(buf){
    var p0 = polishPieces(buf, !!state.flags.polish);
    var e0 = textOfPieces(p0, null).trim();
    if(e0) rows.push({p:bufCard.p, card:bufCard, st:state.cards[bufCard.id], en:e0, zh:bufZh, html:htmlOfPieces(p0, false)});
  }
  return rows;
}
function countWords(rows){
  var s = rows.map(function(r){ return r.en; }).join(" ");
  s = s.replace(/【[^】]*】/g," ");
  var w = s.split(/\s+/).filter(function(x){ return /[A-Za-z0-9%]/.test(x); });
  return w.length;
}
function renderPreview(){
  var rows = collect();
  var html = "";
  if(!rows.length){ html = '<div class="empty-tip">还没有可预览的句子</div>'; }
  [1,2,3].forEach(function(p){
    var rs = rows.filter(function(r){ return r.p === p; });
    if(!rs.length) return;
    html += '<div class="para"><div class="para-t"><span>第'+["一","二","三"][p-1]+'段</span><span class="spacer"></span><span class="wc">'+countWords(rs)+' 词</span></div>';
    rs.forEach(function(r){
      html += '<div class="en">'+r.html+'</div>';
      if(state.flags.tag){ html += '<div class="tagline">套用标注：'+esc(r.card.no)+' '+esc(r.card.title)+' · '+esc(variantOf(r.card,r.st).name)+'</div>'; }
      if(state.flags.zh && r.zh){ html += '<div class="zh">'+esc(r.zh)+'</div>'; }
    });
    html += '</div>';
  });
  $("#paper").innerHTML = html;
  $("#wc").textContent = countWords(rows) + " 词";
  var total = 0, filled = 0;
  var seen = {};
  rows.forEach(function(r){
    piecesOf(r.card, r.st).forEach(function(pc){ if(pc.type==="slot" && !seen[pc.id]){ seen[pc.id]=1; total++; if(slotValue(pc.id).trim()) filled++; } });
  });
  $("#stat").textContent = "已填槽位 " + filled + "/" + total + " · 全文 " + countWords(rows) + " 词";
}
function renderAll(){ renderBuilder(); renderPreview(); }

/* ---------------- 槽位面板 ---------------- */
var popTarget = null, popList = [], popSel = -1;
function openSlot(id, anchor){
  popTarget = id;
  var d = slotDef(id);
  $("#popTitle").textContent = "【" + d.label + "】词库";
  $("#popHint").textContent = d.hint || "";
  $("#popInput").value = slotValue(id);
  popSel = -1;
  drawPopList("");
  var pop = $("#pop");
  pop.classList.add("on"); $("#mask").classList.add("on");
  var r = anchor.getBoundingClientRect();
  var w = 420, h = Math.min(window.innerHeight*0.7, 560);
  var left = Math.min(Math.max(12, r.left), window.innerWidth - w - 12);
  var top = r.bottom + 8;
  if(top + h > window.innerHeight - 12) top = Math.max(12, r.top - h - 8);
  pop.style.left = left + "px"; pop.style.top = top + "px";
  setTimeout(function(){ $("#popInput").focus(); $("#popInput").select(); }, 10);
}
function drawPopList(q){
  var bank = bankOf(popTarget);
  q = (q||"").trim().toLowerCase();
  var items = bank.filter(function(o){
    if(!q) return true;
    return (o.en+" "+o.zh).toLowerCase().indexOf(q) >= 0;
  });
  popList = items;
  var cur = slotValue(popTarget).trim();
  var html = "";
  var lastG = null;
  if(!items.length) html += '<div style="padding:14px 10px;color:#9aa5b1;font-size:12.5px">词库中没有匹配项，可直接在上方输入自定义内容。</div>';
  items.forEach(function(o,i){
    if(o.g && o.g !== lastG){ lastG = o.g; html += '<div class="pop-g">'+esc(o.g)+'</div>'; }
    html += '<button class="opt'+(cur===o.en?" sel":"")+'" data-i="'+i+'"><span class="e">'+esc(o.en)+'</span><span class="z">'+esc(o.zh||"")+'</span></button>';
  });
  $("#popList").innerHTML = html;
}
function closePop(){
  $("#pop").classList.remove("on"); $("#mask").classList.remove("on");
  popTarget = null;
}
function setSlot(id, val){
  pushSnap();
  state.slots[id] = val;
  save();
  refreshSlotsEverywhere(id);
  renderPreview();
}
function refreshSlotsEverywhere(id){
  var ids = activeCardIds();
  ids.forEach(function(cid){
    var card = cardById(cid), st = state.cards[cid];
    if(!card || !st || !st.on) return;
    var raw = rawText(card, st);
    if(raw.indexOf("{"+id+"}") >= 0){
      var node = document.querySelector('.card[data-cid="'+cid+'"] .sent');
      if(node) node.innerHTML = sentenceHTML(card, st, true);
      var c = document.querySelector('.card[data-cid="'+cid+'"] .count');
      if(c) c.textContent = filledCount(card, st);
    }
  });
}

/* ---------------- 快照 / 存储 ---------------- */
function pushSnap(){
  snapshots.push(JSON.stringify(state));
  if(snapshots.length > MAX_SNAP) snapshots.shift();
  $("#undo").disabled = snapshots.length === 0;
}
function undo(){
  if(!snapshots.length) return;
  var s = snapshots.pop();
  state = JSON.parse(s);
  ensureState(state.mode);
  $("#undo").disabled = snapshots.length === 0;
  syncControls();
  save(); renderAll();
  toast("已撤销一步");
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify({s:state, t:Date.now()})); }catch(e){}
}
function load(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(!raw) return false;
    var o = JSON.parse(raw);
    if(!o || !o.s || !o.s.mode) return false;
    if(!modeById(o.s.mode)) return false;
    state = o.s;
    state.flags = state.flags || {zh:true,exam:false,polish:true,note:true,tag:false};
    ensureState(state.mode);
    return true;
  }catch(e){ return false; }
}
var toastTimer = null;
function toast(msg){
  var t = $("#toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("on"); }, 1600);
}

/* ---------------- 预设 / 题型 ---------------- */
function applyPreset(pid){
  var p = null;
  PRESETS.forEach(function(x){ if(x.id===pid) p=x; });
  if(!p) return;
  pushSnap();
  state = freshState(p.mode);
  Object.keys(p.cards||{}).forEach(function(cid){
    var card = cardById(cid); if(!card) return;
    var cfg = p.cards[cid];
    if(!state.cards[cid]) state.cards[cid] = defaultCardState(card);
    var st = state.cards[cid];
    if(cfg.on === false) st.on = false;
    else if(cfg.on === true) st.on = true;
    if(cfg.v != null) st.v = matchIdx(card.variants, cfg.v);
    Object.keys(cfg.subs||{}).forEach(function(k){
      var sd = null; (card.subs||[]).forEach(function(s){ if(s.key===k) sd=s; });
      if(sd) st.subs[k] = matchIdx(sd.options, cfg.subs[k]);
    });
  });
  state.slots = {};
  Object.keys(p.slots||{}).forEach(function(k){ state.slots[k] = p.slots[k]; });
  ensureState(p.mode);
  $("#preset").value = p.id;
  syncControls();
  save(); renderAll();
  toast("已载入：" + p.name);
}
function switchMode(id){
  if(state.mode === id) return;
  pushSnap();
  state.mode = id;
  state.cards = {};
  ensureState(id);
  save(); syncControls(); renderAll();
}

/* ---------------- 事件 ---------------- */
function bind(){
  $("#modes").addEventListener("click", function(e){
    var b = e.target.closest(".mode-btn");
    if(b) switchMode(b.getAttribute("data-mode"));
  });
  $("#preset").addEventListener("change", function(e){
    if(e.target.value) applyPreset(e.target.value);
  });
  $("#builder").addEventListener("change", function(e){
    var node = e.target.closest(".card"); if(!node) return;
    var cid = node.getAttribute("data-cid");
    var card = cardById(cid), st = state.cards[cid];
    if(!card || !st) return;
    if(e.target.getAttribute("data-sel") === "v"){
      pushSnap(); st.v = parseInt(e.target.value,10)||0; save(); refreshCard(cid); renderPreview();
    } else if(e.target.getAttribute("data-sub")){
      pushSnap(); st.subs[e.target.getAttribute("data-sub")] = parseInt(e.target.value,10)||0;
      save(); refreshCard(cid); renderPreview();
    }
  });
  $("#builder").addEventListener("click", function(e){
    var slot = e.target.closest(".slot");
    if(slot){ e.preventDefault(); openSlot(slot.getAttribute("data-slot"), slot); return; }
    var tg = e.target.closest('[data-act="toggle"]');
    if(tg){
      var node = tg.closest(".card"); var cid = node.getAttribute("data-cid");
      var st = state.cards[cid]; if(!st) return;
      pushSnap(); st.on = !st.on;
      var m = modeById(state.mode);
      var def = null;
      m.cards.forEach(function(c){ if(typeof c==="object" && c.id===cid) def=c; });
      if(st.on && def && def.excl){
        Object.keys(state.cards).forEach(function(other){
          if(other!==cid){
            var oc = cardById(other); var od = null;
            m.cards.forEach(function(c){ if(typeof c==="object" && c.id===other) od=c; });
            if(od && od.excl === def.excl) state.cards[other].on = false;
          }
        });
        renderBuilder();
      }
      save(); refreshCard(cid); syncControls(); renderPreview();
    }
  });
  $("#help").addEventListener("click", function(){
    $("#helpBody").innerHTML = HELP_HTML;
    $("#helpPop").classList.add("on"); $("#mask").classList.add("on");
  });
  $("#helpX").addEventListener("click", function(){ $("#helpPop").classList.remove("on"); $("#mask").classList.remove("on"); });
  $("#mask").addEventListener("click", function(){ $("#helpPop").classList.remove("on"); closePop(); });
  $("#popX").addEventListener("click", closePop);
  $("#popList").addEventListener("click", function(e){
    var b = e.target.closest(".opt"); if(!b || !popTarget) return;
    var i = parseInt(b.getAttribute("data-i"),10);
    var o = popList[i]; if(!o) return;
    setSlot(popTarget, o.en);
    closePop();
    toast("已填入：" + o.en);
  });
  $("#popSet").addEventListener("click", function(){
    if(!popTarget) return;
    setSlot(popTarget, $("#popInput").value.trim());
    closePop();
  });
  $("#popInput").addEventListener("keydown", function(e){
    if(e.key === "Enter"){ e.preventDefault(); $("#popSet").click(); }
    if(e.key === "ArrowDown"){ e.preventDefault(); e.stopPropagation(); var f=$("#popList .opt"); if(f) f.focus(); }
  });
  $("#popList").addEventListener("keydown", function(e){
    var items = $$("#popList .opt");
    var cur = document.activeElement;
    var idx = items.indexOf(cur);
    if(e.key === "ArrowDown"){ e.preventDefault(); if(items[idx+1]) items[idx+1].focus(); }
    if(e.key === "ArrowUp"){ e.preventDefault(); if(items[idx-1]) items[idx-1].focus(); }
    if(e.key === "Enter" && cur && cur.classList.contains("opt")){ e.preventDefault(); cur.click(); }
  });
  $("#popClear").addEventListener("click", function(){
    if(!popTarget) return;
    setSlot(popTarget, "");
    closePop();
    toast("已清空该槽位");
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape"){ closePop(); $("#helpPop").classList.remove("on"); }
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="z"){ e.preventDefault(); undo(); }
  });
  ["tZh","tExam","tPolish","tNote","tTag"].forEach(function(id){
    $("#"+id).addEventListener("change", function(e){
      var map = {tZh:"zh",tExam:"exam",tPolish:"polish",tNote:"note",tTag:"tag"};
      state.flags[map[id]] = e.target.checked;
      document.body.classList.toggle("exam", !!state.flags.exam);
      $$(".card .note").forEach(function(n){ n.style.display = state.flags.note ? "" : "none"; });
      save();
      if(id === "tPolish"){ renderBuilder(); }
      renderPreview();
    });
  });
  $("#undo").addEventListener("click", undo);
  $("#clear").addEventListener("click", function(){
    pushSnap();
    state.slots = {};
    save(); renderAll();
    toast("已清空全部槽位（可撤销）");
  });
  $("#copy").addEventListener("click", copyAll);
  $("#copy2").addEventListener("click", copyAll);
  function copyAll(){
    var rows = collect();
    var txt = "";
    [1,2,3].forEach(function(p){
      var rs = rows.filter(function(r){ return r.p===p; });
      if(!rs.length) return;
      txt += ["第一段","第二段","第三段"][p-1] + "\n";
      rs.forEach(function(r){ txt += sentencePlainForCopy(r.card, r.st) + "\n"; });
      txt += "\n";
    });
    txt = txt.trim();
    if(!txt){ toast("还没有内容可复制"); return; }
    var done = function(){ toast("已复制全文（" + countWords(rows) + " 词）"); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done, function(){ fallback(txt); done(); });
    } else { fallback(txt); done(); }
  }
  function fallback(txt){
    var ta = document.createElement("textarea");
    ta.value = txt; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); }catch(e){}
    document.body.removeChild(ta);
  }
}

/* ---------------- 启动 ---------------- */
function syncOffset(){
  var h = document.querySelector(".top");
  if(h && h.offsetHeight > 0) document.documentElement.style.setProperty("--topH", h.offsetHeight + "px");
}
function init(){
  buildModes(); buildPresets();
  var ok = load();
  if(!ok){ state = freshState("dyn1"); applyPreset("p23y2"); snapshots.length = 0; }
  else {
    var found = false;
    PRESETS.forEach(function(p){ if(p.mode === state.mode) found = true; });
    $("#preset").value = "";
  }
  ensureState(state.mode);
  syncControls();
  renderAll();
  bind();
  syncOffset();
  window.addEventListener("resize", syncOffset);
}
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();

window.__DZW__ = {
  getState:function(){ return state; },
  setMode:function(id){ switchMode(id); },
  applyPreset:function(id){ applyPreset(id); },
  cards:function(){ return activeCardIds(); },
  setSlot:function(id,v){ state.slots[id]=v; save(); renderAll(); },
  undo:undo,
  snapCount:function(){ return snapshots.length; },
  polish:sentenceText
};
})();

</script>
